IMAGE=postgres-client

# The Postgres client's major, which is the state backend's server major
# (`settings.POSTGRES_TAG`): `tests/test_images.py` holds the two equal, so
# this moves in the pull request that moves the server. The release within the
# major is the one the base's Debian release carries when the image is built.
POSTGRES_MAJOR=17

TAG="${POSTGRES_MAJOR}"

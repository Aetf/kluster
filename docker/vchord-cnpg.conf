IMAGE=vchord-cnpg

# The CNPG operand this extends, as one key and its digest (see
# pgcron-cnpg.conf). Postgres 15 is where immich's database is; a major move is
# a declarative in-place upgrade, not a bump of this line
# (declarative/workloads.md).
#
# renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
PG_TAG=15.13-1-bookworm
PG_DIGEST=sha256:32312ca4300023b15d260adb9b25ef2ea8c061e3218e788fe5de84eac08a3033
PG_MAJOR="${PG_TAG%%.*}"

# pgvecto.rs, whose extension is named `vectors`. Still installed because
# immich's existing database has the extension and its shared_preload_libraries
# lists it; VectorChord is its successor, and dropping it is a data migration
# rather than an image change. The prebuilt .deb ships inside a per-version,
# per-architecture image on Docker Hub, each tag its own single-platform index,
# so each architecture's build pulls its own reference: the key ending in the
# architecture's name reaches that build without the suffix (framework/ci.md
# §4).
#
# Both references are `<tag>@<digest>`, which renovate moves as a pair: it
# refreshes each digest on its own, and reads a release off each tag through
# the regex versioning on its hint, the Postgres major held as compatibility.
# A release waits on dashboard approval and moves both lines in one pull
# request (renovate.json5), because it is an extension upgrade of immich's
# existing database rather than a rebuild. The `pg15` in the tags is PG_TAG's
# major.
#
# renovate: datasource=docker depName=docker.io/tensorchord/pgvecto-rs-binary versioning=regex:^pg(?<compatibility>\d+)-v(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)-amd64$
PGVECTO_RS_AMD64=pg15-v0.3.0-amd64@sha256:8b0d49f3e159e17af42b949fde49a56040cfbb0c16d17e41e336aab425536fda
# renovate: datasource=docker depName=docker.io/tensorchord/pgvecto-rs-binary versioning=regex:^pg(?<compatibility>\d+)-v(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)-arm64$
PGVECTO_RS_ARM64=pg15-v0.3.0-arm64@sha256:9780739b475db8f040cef58b89dd2c17d126aec59a0e503ecd4111664b872aca

# VectorChord, the extension immich actually indexes with (`vchord`). Its
# release assets are per-architecture .debs.
#
# renovate: datasource=github-releases depName=tensorchord/VectorChord
VECTORCHORD_SEMVER=0.3.0

# The base's Debian codename is dropped from the tag: what a consumer needs to
# read off it is the Postgres version and the vector extension it was built
# with.
TAG="${PG_TAG%-*}-${VECTORCHORD_SEMVER}"

IMAGE=vchord-cnpg

# The CNPG operand this extends, as one key (see pgcron-cnpg.conf). Postgres
# 15 is where immich's database is; a major move is a declarative in-place
# upgrade, not a bump of this line (declarative/workloads.md).
#
# renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
PG_TAG=15.13-1-bookworm
PG_MAJOR="${PG_TAG%%.*}"

# pgvecto.rs, whose extension is named `vectors`. Still installed because
# immich's existing database has the extension and its shared_preload_libraries
# lists it; VectorChord is its successor, and dropping it is a data migration
# rather than an image change. The prebuilt .deb ships inside a per-version,
# per-architecture image on Docker Hub (`pg15-v0.3.0-arm64`), which no renovate
# datasource can read as a version, so the version is tracked at its source
# repository instead.
#
# renovate: datasource=github-releases depName=tensorchord/pgvecto.rs extractVersion=^v(?<version>.+)$
PGVECTO_RS_SEMVER=0.3.0

# VectorChord, the extension immich actually indexes with (`vchord`). Its
# release assets are per-architecture .debs.
#
# renovate: datasource=github-releases depName=tensorchord/VectorChord
VECTORCHORD_SEMVER=0.3.0

# The base's Debian codename is dropped from the tag: what a consumer needs to
# read off it is the Postgres version and the vector extension it was built
# with.
TAG="${PG_TAG%-*}-${VECTORCHORD_SEMVER}"

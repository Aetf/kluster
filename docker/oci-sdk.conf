IMAGE=oci-sdk

# The OCI SDK, at a release inside the range `pyproject.toml` declares for
# `oci`, which `tests/test_images.py` holds (framework/ci.md §4). The SDK
# releases about weekly, so renovate offers this pin once a month, in the
# window the base refreshes use.
#
# renovate: datasource=pypi depName=oci
OCI_VERSION=2.191.0

TAG="${OCI_VERSION}"

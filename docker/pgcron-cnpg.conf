IMAGE=pgcron-cnpg

# The CNPG operand this extends. The whole upstream tag is one key so that a
# bump is one line renovate can write; PG_MAJOR is derived from it rather than
# pinned twice, because the two drifting apart would install the pg_cron build
# for a server that is not there. The digest on the line below the tag is the
# multi-arch index the tag served when it was pinned; renovate moves the two
# together, and a refresh of the same tag moves the digest alone.
#
# renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
PG_TAG=17.10-standard-trixie
PG_DIGEST=sha256:78c4fdf165e8ffb1b5b7a7fc6b22b3cf37890a338b4c1c8c4d913896129a86da
PG_MAJOR="${PG_TAG%%.*}"

TAG="${PG_TAG}"

IMAGE=pgcron-cnpg

# The CNPG operand this extends. The whole upstream tag is one key so that a
# bump is one line renovate can write; PG_MAJOR is derived from it rather than
# pinned twice, because the two drifting apart would install the pg_cron build
# for a server that is not there.
#
# renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
PG_TAG=17.10-standard-trixie
PG_MAJOR="${PG_TAG%%.*}"

# Bumped when this image changes without its base changing — the tag has to
# move for the rebuild to be addressable.
PGCRON_REV=1

TAG="${PG_TAG}-${PGCRON_REV}"

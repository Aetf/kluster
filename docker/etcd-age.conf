IMAGE=etcd-age

# etcd, `etcdctl` and `etcdutl`, from the repository Talos runs etcd from
# (`EtcdImage` in Talos' constants), as one `<tag>@<digest>` of its multi-arch
# index. The release is on the minor the cluster's etcd runs: a newer
# `etcdutl` restores an older snapshot, an older one is not promised to restore
# a newer one, and a newer one proves less about the cluster's own etcd. So a
# minor or major release waits on dashboard approval, and the Talos release
# that moves the cluster's minor is where it is approved (renovate.json5). A
# patch release is not offered: the global `patch: enabled: false` holds here,
# where the rule for `docker/` would lift it. The regex versioning reads only
# a bare `v<major>.<minor>.<patch>`, which leaves out the per-architecture
# tags and the Kubernetes-style `<release>-<revision>` ones the same
# repository carries.
#
# renovate: datasource=docker depName=registry.k8s.io/etcd versioning=regex:^v(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)$
ETCD=v3.6.16@sha256:b29d816b546a1966fe7034a33b34e231fa98c47ce4d2883f70b0555020b22132

# age, built from its module at the release whose library talos-backup
# encrypts the snapshots with. The format is the contract, so this follows
# age's releases and not `mise.toml`'s `age`. The hint strips the module
# version's `v`, since the pin is read as a value that starts with a digit.
#
# renovate: datasource=go depName=filippo.io/age extractVersion=^v(?<version>.+)$
AGE_VERSION=1.3.2

# The etcd release alone: what a consumer reads off the tag is the etcd it
# restores with. A move of age or of a base is a rebuild under the same
# version, told apart by the fingerprint.
TAG="${ETCD%%@*}"

[project]
name = "kluster"
version = "0.1.0"
description = "Pulumi program for a Talos/Cilium hybrid Kubernetes cluster spanning OCI and a homelab LAN"
authors = [
    { name = "Aetf", email = "aetf@unlimited-code.works" }
]
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
requires-python = ">= 3.12"

dependencies = [
    "pulumi>=3.254.0",
    "pulumi-kubernetes>=4.23.0",
    "requests>=2.32.3",
    "jinja2>=3.1.4",
    "pulumi-crds",
    "pulumi-github>=6.4.0",
    "pulumi-kubernetes-cert-manager>=0.2.0",
    "cryptography>=50.0.0",
    "oci>=2.184.2",
    "pulumi-oci>=4.20.0",
    "pulumiverse-talos>=0.8.1",
    "pykeepass>=4.2.0",
    "keyring>=25.7.0",
    "pulumi-cloudflare>=6.11.0",
]

[project.scripts]
update_crds = 'kluster.scripts.update_crds:main'
credentials = 'kluster.scripts.credentials.cli:main'
state-backend = 'kluster.scripts.state_backend.cli:main'

[dependency-groups]
dev = [
    "ipython>=8.30.0",
    "tqdm>=4.67.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruamel-yaml>=0.19.1",
    "ruff>=0.15.11",
    "basedpyright>=1.39.10",
]
##
## Project management section
##
[tool.uv]
managed = true
default-groups = ["dev"]

# Pin the package index so locking doesn't pick up ambient registry settings
# (e.g. UV_INDEX_URL pointing at a private mirror). Note CLI flags and env
# vars still take precedence over this if explicitly set.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.uv.sources]
pulumi-crds = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/kluster", "src/putils"]

##
## Formatter and linter
##
[tool.ruff]
line-length = 120
# In addition to the standard set of exclusions, omit all tests, plus a specific file.
extend-exclude = ["lib", "packages/crds"]

[tool.ruff.format]
quote-style = "single"
docstring-code-format = true

# Ignore `E402` (import violations) in all `__init__.py` files, and in select subdirectories.
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]

##
## Type checker
##


[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
include = ["src", "tests", "deploy", "__main__.py"]
# Both are workspace packages installed editable, through an import finder the
# type checker cannot follow; it reads them from the tree instead. Listing
# `src` is not redundant: naming any extra path makes this the whole search
# path, so leaving it out resolves `kluster` as an unstubbed third-party
# library.
extraPaths = ["src", "packages/crds"]
# Generated CRD bindings are not ours to annotate.
exclude = [
    "packages/crds",
    "**/__pycache__",
    ".venv",
]
# basedpyright-only opinions that fight a Pulumi codebase more than they help:
# provider SDKs surface Any at every boundary, and Pulumi resources are
# constructed for effect, not for their return value.
reportAny = false
reportExplicitAny = false
reportUnusedCallResult = false

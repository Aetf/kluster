[project]
name = "kluster"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Aetf", email = "aetf@unlimited-code.works" }
]
dependencies = [
    "pulumi>=3.117.0",
    "pulumi-kubernetes>=4.12.0",
    "pip>=24.0",
    "requests>=2",
    "pyyaml>=6.0.1",
    "jinja2>=3.1.4",
    "pulumi-crds @ file:///home/aetf/develop/cloud/kluster-py/lib/crds",
]
readme = "README.md"
requires-python = ">= 3.8"

[project.scripts]
stack = 'kluster.scripts.stack:main'
update_crds = 'kluster.scripts.update_crds:main'


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = [
    "ipython>=8.24.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/kluster"]

[tool.ruff]
line-length = 120
# In addition to the standard set of exclusions, omit all tests, plus a specific file.
extend-exclude = ["lib"]

[tool.ruff.format]
quote-style = "single"
docstring-code-format = true


# Ignore `E402` (import violations) in all `__init__.py` files, and in select subdirectories.
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]

[tool.pyright]
venvPath = "."
venv = ".venv"

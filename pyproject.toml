[project]
name = "kluster"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Aetf", email = "aetf@unlimited-code.works" }
]
readme = "README.md"
requires-python = ">= 3.12"

dependencies = [
    "pulumi>=3.117.0",
    "pulumi-kubernetes>=4.12.0",
    "pip>=24.0",
    "requests>=2",
    "pyyaml>=6.0.1",
    "jinja2>=3.1.4",
    "pulumi-crds",
]

[project.scripts]
stack = 'kluster.scripts.stack:main'
update_crds = 'kluster.scripts.update_crds:main'

[dependency-groups]
dev = [
    "ipython>=8.30.0",
    "tqdm>=4.67.1",
]
##
## Project management section
##
[tool.uv]
managed = true
default-groups = ["dev"]

[tool.uv.sources]
pulumi-crds = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/kluster"]

##
## Formatter and linter
##
[tool.ruff]
line-length = 120
# In addition to the standard set of exclusions, omit all tests, plus a specific file.
extend-exclude = ["lib"]

[tool.ruff.format]
quote-style = "single"
docstring-code-format = true

# Ignore `E402` (import violations) in all `__init__.py` files, and in select subdirectories.
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]

##
## Type checker
##
[tool.pyright]
venvPath = "."
venv = ".venv"


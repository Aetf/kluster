[project]
name = "kluster"
version = "0.1.0"
description = "Pulumi program for a Talos/Cilium hybrid Kubernetes cluster spanning OCI and a homelab LAN"
authors = [
    { name = "Aetf", email = "aetf@unlimited-code.works" }
]
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
requires-python = ">= 3.12"

dependencies = [
    "pulumi>=3.254.0",
    "pulumi-kubernetes>=4.23.0",
    "requests>=2.32.3",
    "jinja2>=3.1.4",
    "pulumi-crds",
    "pulumi-github>=6.4.0",
    "pulumi-kubernetes-cert-manager>=0.2.0",
    "cryptography>=50.0.0",
    "oci>=2.184.2",
    "pulumi-oci>=4.20.0",
    "pulumiverse-talos>=0.8.1",
    "pykeepass>=4.2.0",
    "keyring>=25.7.0",
    "pulumi-cloudflare>=6.11.0",
    "pulumi-libvirt>=0.5.4",
    "pulumi-b2",
    "pulumi-unifi",
    "pulumi-zerotier",
    "asyncssh>=2.24.0",
]

[project.scripts]
update_crds = 'kluster.scripts.update_crds:main'
credentials = 'kluster.scripts.credentials.cli:main'
state-backend = 'kluster.scripts.state_backend.cli:main'

[dependency-groups]
dev = [
    "ipython>=8.30.0",
    "tqdm>=4.67.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruamel-yaml>=0.19.1",
    "ruff>=0.15.11",
    "basedpyright>=1.39.10",
    "import-linter>=2.14",
]
##
## Project management section
##
[tool.uv]
managed = true
default-groups = ["dev"]

# Pin the package index so locking doesn't pick up ambient registry settings
# (e.g. UV_INDEX_URL pointing at a private mirror). Note CLI flags and env
# vars still take precedence over this if explicitly set.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

# Generated SDKs, committed like `packages/crds` rather than fetched: three of
# them have no published Python package at all. They are produced by Pulumi's
# any-Terraform-provider bridge, and regenerating one is a single command run
# from the repository root (the SDK lands in `sdks/<name>`, from where it
# replaces `packages/<name>`):
#
#   pulumi package add terraform-provider Backblaze/b2   --language python
#   pulumi package add terraform-provider filipowm/unifi --language python
#   pulumi package add terraform-provider zerotier/zerotier --language python
#
# `--language python` keeps the generator out of `Pulumi.yaml`: the bridge's
# parameterization (which upstream provider, which version) travels inside the
# committed SDK's own `pulumi-plugin.json`, so nothing else has to record it.
[tool.uv.sources]
pulumi-crds = { workspace = true }
pulumi-b2 = { workspace = true }
pulumi-unifi = { workspace = true }
pulumi-zerotier = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/kluster", "src/putils"]

##
## Formatter and linter
##
[tool.ruff]
line-length = 120
# In addition to the standard set of exclusions: vendored libraries, and
# `packages/`, whose every member is a generated provider SDK. The leading
# slash anchors the first one to the repository root — a bare `lib` is matched
# against every path segment, and would silently take `src/kluster/lib/` with
# it.
extend-exclude = ["/lib", "packages"]

[tool.ruff.format]
quote-style = "single"
docstring-code-format = true

# Ignore `E402` (import violations) in all `__init__.py` files, and in select subdirectories.
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]

##
## Type checker
##


[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
include = ["src", "tests", "deploy", "__main__.py"]
# All of these are workspace packages installed editable, through an import
# finder the type checker cannot follow; it reads them from the tree instead.
# Listing `src` is not redundant: naming any extra path makes this the whole
# search path, so leaving it out resolves `kluster` as an unstubbed
# third-party library.
extraPaths = ["src", "packages/crds", "packages/b2", "packages/unifi", "packages/zerotier"]
# Generated bindings — CRD schemas and bridged provider SDKs — are not ours to
# annotate. They are still on the search path above, so code that imports them
# is checked against them; only their own sources are skipped.
exclude = [
    "packages",
    "**/__pycache__",
    ".venv",
]
# basedpyright-only opinions that fight a Pulumi codebase more than they help:
# provider SDKs surface Any at every boundary, and Pulumi resources are
# constructed for effect, not for their return value.
reportAny = false
reportExplicitAny = false
reportUnusedCallResult = false

##
## Import contract
##
# The source layout is a set of layers, and a layer that quietly reached
# upwards would take the layout with it — so the layering is a checked
# contract rather than a convention (rfc-002 §2.3). Run as
# `uv run lint-imports`, in CI beside ruff and basedpyright.
[tool.importlinter]
root_packages = ["kluster", "putils"]

# Each entry below is one layer, so the areas *inside* a layer may import each
# other freely — `homelab` names `talos`'s cluster type in its signature, and a
# contract making the areas independent would enforce a boundary the design
# does not have.
[[tool.importlinter.contracts]]
name = "Layers: a package imports what is below it and nothing above it"
type = "layers"
layers = [
    "kluster.stacks",
    "kluster.components",
    "kluster.providers",
    "kluster.lib",
    "kluster.conventions",
    "putils",
]

# A script is a program of its own. It shares `lib` and `conventions` with the
# declarations and nothing else, so a console entry point can never drag a
# stack's resource graph into a command someone runs by hand.
[[tool.importlinter.contracts]]
name = "Scripts declare no resources"
type = "forbidden"
source_modules = ["kluster.scripts"]
forbidden_modules = ["kluster.stacks", "kluster.components", "kluster.providers"]

# A custom provider is generic code for a class of system; which host, which
# name and which credential are the estate's decisions, and they belong to the
# provider's callers.
[[tool.importlinter.contracts]]
name = "A provider knows no conventions"
type = "forbidden"
source_modules = ["kluster.providers"]
forbidden_modules = ["kluster.conventions"]

# Not a rule so much as what `putils` is: the framework of rfc-001, which
# knows no estate.
[[tool.importlinter.contracts]]
name = "The framework knows no estate"
type = "forbidden"
source_modules = ["putils"]
forbidden_modules = ["kluster"]

# A stack program is wiring, and `kluster.main` is the only thing that
# dispatches it. Something another module imports for its contents is a
# component, whatever directory it sits in.
[[tool.importlinter.contracts]]
name = "Only the entrypoint imports a stack program"
type = "forbidden"
source_modules = [
    "kluster.components",
    "kluster.providers",
    "kluster.lib",
    "kluster.conventions",
    "kluster.scripts",
    "putils",
]
forbidden_modules = ["kluster.stacks"]

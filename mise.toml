# All three are secrets in the sense that matters here -- the passphrase
# decrypts every stack's config, the URL names a client key, the token
# administers the forge -- so mise does not echo them back in `mise env` or a
# task's command line. This list is variable names; the files they are read
# from are covered by .gitignore instead.
redactions = ["PULUMI_CONFIG_PASSPHRASE", "PULUMI_BACKEND_URL", "GITHUB_TOKEN"]

# Pinned, not `latest`: CI installs from this file, so a floating version is a
# breaking upgrade that lands without a PR, a preview, or a way to bisect it.
# Renovate maintains these -- it cannot bump `latest`, which is why they are
# written out.
[tools]
pulumi = "3.257.0"
uv = "0.11.26"
# Deterministic age identities are cross-checked against the real tool, and
# the box's dumps are age-encrypted; butane renders the appliance's Ignition.
# This version tracks the appliance's pin (state_backend/settings.py), so the
# cross-check exercises what actually runs there -- a test holds the two equal.
age = "1.3.1"
"aqua:coreos/butane" = "0.29.0"

# Three things a `pulumi` run needs that no template can compute: the state
# passphrase, derived from the offline derivation seed (docs/credentials.md
# §2.2); the backend URL, written beside the client certificate it names; and
# the `github` stack's admin token, an account root from the personal estate.
# Each is read from its **workstation slot** -- a git-ignored file under
# `.credentials/`, written by a `credentials` or `state-backend` command
# (credentials.md §1 rule 6).
#
# Every one of them falls back to whatever is already in the environment
# rather than to an empty string: CI passes them in as Environment secrets,
# and a blank value here would overwrite them (framework/ci.md §2). The
# `.credentials/` layout is what `workstation.py` writes, so the two agree on
# `config_root` -- the directory holding this file -- rather than by
# coincidence.
#
# The second branch of each is the pre-`.credentials/` location, kept so a
# workstation that predates the move keeps working without being touched.
# TODO(kluster-ops#34): delete those branches, and the two stale entries in
# .gitignore, once every workstation has been converged.
[env]
PULUMI_CONFIG_PASSPHRASE = """
{%- set slot = [config_root, '.credentials/pulumi.passphrase'] | join_path -%}
{%- set moved = [config_root, '.pulumi.secret'] | join_path -%}
{%- if slot is file -%}
{{- read_file(path=slot) | trim -}}
{%- elif moved is file -%}
{{- read_file(path=moved) | trim -}}
{%- else -%}
{{- env.PULUMI_CONFIG_PASSPHRASE | default(value="") -}}
{%- endif -%}
"""
PULUMI_BACKEND_URL = """
{%- set slot = [config_root, '.credentials/state-backend/backend-url'] | join_path -%}
{%- set moved = [env.HOME, '.config/kluster/state-backend/backend-url'] | join_path -%}
{%- if slot is file -%}
{{- read_file(path=slot) | trim -}}
{%- elif moved is file -%}
{{- read_file(path=moved) | trim -}}
{%- else -%}
{{- env.PULUMI_BACKEND_URL | default(value="") -}}
{%- endif -%}
"""
# The token file is one layer of the account-root chain (credentials.md §2):
# `credentials master github remember` writes it, and this materializes it for
# apply time because a provider reads a variable and not a keyring. Note that
# `gh` reads this variable too: inside this directory it will act as the admin
# token.
GITHUB_TOKEN = """
{%- set slot = [config_root, '.credentials/roots/github.token'] | join_path -%}
{%- set moved = [config_root, '.github.token'] | join_path -%}
{%- if slot is file -%}
{{- read_file(path=slot) | trim -}}
{%- elif moved is file -%}
{{- read_file(path=moved) | trim -}}
{%- else -%}
{{- env.GITHUB_TOKEN | default(value="") -}}
{%- endif -%}
"""

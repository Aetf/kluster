# All three are secrets in the sense that matters here -- the passphrase
# decrypts every stack's config, the URL names a client key, the token
# administers the forge -- so mise does not echo them back in `mise env` or a
# task's command line. This list is variable names; the files they are read
# from are covered by .gitignore instead.
redactions = ["PULUMI_CONFIG_PASSPHRASE", "PULUMI_BACKEND_URL", "GITHUB_TOKEN"]

# Pinned, not `latest`: CI installs from this file, so a floating version is a
# breaking upgrade that lands without a PR, a preview, or a way to bisect it.
# Renovate maintains these -- it cannot bump `latest`, which is why they are
# written out.
[tools]
pulumi = "3.257.0"
uv = "0.11.26"
# age is the tool this repository escrows with rather than a format it
# reimplements: `age`/`age-keygen` write and open every ciphertext under
# `escrow/`, and the box's dumps are age-encrypted too; butane renders the
# appliance's Ignition. This version tracks the appliance's pin
# (state_backend/settings.py), so the round trip the tests exercise is the one
# that actually runs there -- a test holds the two equal.
age = "1.3.1"
"aqua:coreos/butane" = "0.29.0"

# What a `pulumi` run needs that no template can compute: the state
# passphrase, recovered from its escrow ciphertext (docs/credentials.md
# §2.2); the backend URL and the three files of the client bundle it connects
# with; and the `github` stack's admin token, an account root from the
# personal estate.
# Each is read from its **workstation slot** -- a git-ignored file under
# `.credentials/`, written by a `credentials` or `state-backend` command
# (credentials.md §1 rule 6).
#
# Every one of them falls back to whatever is already in the environment
# rather than to an empty string: CI passes them in as Environment secrets,
# and a blank value here would overwrite them (framework/ci.md §2). The
# `.credentials/` layout is what `workstation.py` writes, so the two agree on
# `config_root` -- the directory holding this file -- rather than by
# coincidence.
#
# The second branch of each is the pre-`.credentials/` location, kept so a
# workstation that predates the move keeps working without being touched.
# TODO(kluster-ops#34): delete those branches, and the two stale entries in
# .gitignore, once every workstation has been converged.
[env]
PULUMI_CONFIG_PASSPHRASE = """
{%- set slot = [config_root, '.credentials/pulumi.passphrase'] | join_path -%}
{%- set moved = [config_root, '.pulumi.secret'] | join_path -%}
{%- if slot is file -%}
{{- read_file(path=slot) | trim -}}
{%- elif moved is file -%}
{{- read_file(path=moved) | trim -}}
{%- else -%}
{{- env.PULUMI_CONFIG_PASSPHRASE | default(value="") -}}
{%- endif -%}
"""
PULUMI_BACKEND_URL = """
{%- set slot = [config_root, '.credentials/state-backend/backend-url'] | join_path -%}
{%- set moved = [env.HOME, '.config/kluster/state-backend/backend-url'] | join_path -%}
{%- if slot is file -%}
{{- read_file(path=slot) | trim -}}
{%- elif moved is file -%}
{{- read_file(path=moved) | trim -}}
{%- else -%}
{{- env.PULUMI_BACKEND_URL | default(value="") -}}
{%- endif -%}
"""
# The bundle the URL above authenticates with. It names no path itself, so the
# three files travel as the libpq variables — which is the one channel both
# libpq and the driver behind Pulumi's Postgres backend read, and which
# nothing has to expand. Each resolves the *same* bundle directory the URL
# came from, tested on the same file, so a workstation whose bundle sits in
# the pre-`.credentials/` location gets a matching set rather than a URL from
# one place and a certificate from another. CI runs `pulumi` through mise too,
# and materializes the `ci` bundle into `.credentials/state-backend/` of the
# checkout, so it resolves here exactly as a workstation does.
PGSSLROOTCERT = """
{%- set slot = [config_root, '.credentials/state-backend'] | join_path -%}
{%- set moved = [env.HOME, '.config/kluster/state-backend'] | join_path -%}
{%- set slot_url = [slot, 'backend-url'] | join_path -%}
{%- set moved_url = [moved, 'backend-url'] | join_path -%}
{%- if slot_url is file -%}
{{- [slot, 'ca.crt'] | join_path -}}
{%- elif moved_url is file -%}
{{- [moved, 'ca.crt'] | join_path -}}
{%- else -%}
{{- env.PGSSLROOTCERT | default(value="") -}}
{%- endif -%}
"""
PGSSLCERT = """
{%- set slot = [config_root, '.credentials/state-backend'] | join_path -%}
{%- set moved = [env.HOME, '.config/kluster/state-backend'] | join_path -%}
{%- set slot_url = [slot, 'backend-url'] | join_path -%}
{%- set moved_url = [moved, 'backend-url'] | join_path -%}
{%- if slot_url is file -%}
{{- [slot, 'client.crt'] | join_path -}}
{%- elif moved_url is file -%}
{{- [moved, 'client.crt'] | join_path -}}
{%- else -%}
{{- env.PGSSLCERT | default(value="") -}}
{%- endif -%}
"""
PGSSLKEY = """
{%- set slot = [config_root, '.credentials/state-backend'] | join_path -%}
{%- set moved = [env.HOME, '.config/kluster/state-backend'] | join_path -%}
{%- set slot_url = [slot, 'backend-url'] | join_path -%}
{%- set moved_url = [moved, 'backend-url'] | join_path -%}
{%- if slot_url is file -%}
{{- [slot, 'client.key'] | join_path -}}
{%- elif moved_url is file -%}
{{- [moved, 'client.key'] | join_path -}}
{%- else -%}
{{- env.PGSSLKEY | default(value="") -}}
{%- endif -%}
"""
# The token file is one layer of the account-root chain (credentials.md §2):
# `credentials root github remember` writes it, and this materializes it for
# apply time because a provider reads a variable and not a keyring. Note that
# `gh` reads this variable too: inside this directory it will act as the admin
# token.
GITHUB_TOKEN = """
{%- set slot = [config_root, '.credentials/roots/github.token'] | join_path -%}
{%- set moved = [config_root, '.github.token'] | join_path -%}
{%- if slot is file -%}
{{- read_file(path=slot) | trim -}}
{%- elif moved is file -%}
{{- read_file(path=moved) | trim -}}
{%- else -%}
{{- env.GITHUB_TOKEN | default(value="") -}}
{%- endif -%}
"""

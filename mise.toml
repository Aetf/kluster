# mise does not echo these back in `mise env` or a task's command line. The
# passphrase is a secret -- the Pulumi stack passphrase decrypts the state and
# the config of every stack but the operator stacks. The URL carries no
# credential -- the client key is a file `PGSSLKEY` names -- and is redacted
# all the same: it names the state backend's address and role. This list is
# variable names; the files they are read from are covered by .gitignore
# instead.
redactions = ["PULUMI_CONFIG_PASSPHRASE", "PULUMI_BACKEND_URL"]

# A version names a release, not its bytes: a publisher can upload a release
# asset again under the version it already had, and an install by version takes
# whatever is there. `mise.lock` records, for each tool below, the release's
# download URL and the sha256 of the artifact behind it, and an install checks
# what it downloaded against that sum and refuses a mismatch. `locked` is what
# makes the record binding. Without it, a tool with no matching entry -- a pin
# moved here and not in the lock -- installs anyway and the install writes
# down the sum of whatever it fetched, so the record would vouch for nothing.
# With it, that install refuses by name, and `mise lock` is what moves an
# entry: a bump of a pin is finished when its entry has moved with it, and a
# test holds every pin to an entry carrying a sum.
#
# The lock holds `linux-x64`, the platform of every runner, of a cloud
# session and of the workstations; `mise lock` refreshes the platforms a lock
# already holds, so renovate keeps that set. A checkout on another platform
# adds its own with `mise lock --platform`. `mise lock` also rewrites the sum
# of an entry whose version has not moved to what the release serves now, so a
# lock diff that changes a sum and not its version is a release re-uploaded
# under its name, and is read as one.
[tool_config]
locked = true

# Pinned, not `latest`: CI installs from this file, so a floating version is a
# breaking upgrade that lands without a PR, a preview, or a way to bisect it.
# Renovate maintains these -- it cannot bump `latest`, which is why they are
# written out.
[tools]
pulumi = "3.257.0"
uv = "0.11.26"
# age is the tool this repository escrows with rather than a format it
# reimplements: `age`/`age-keygen` write and open every ciphertext under
# `escrow/`, and the box's dumps are age-encrypted too; butane renders the
# appliance's Ignition. This version tracks the appliance's pin
# (`kluster.lib.state_backend.settings`), so the round trip the tests exercise is the one
# that actually runs there -- a test holds the two equal.
age = "1.3.1"
"aqua:coreos/butane" = "0.29.0"
# talosctl is what the suite asks whether Talos accepts the machine
# configuration the Talos component renders: `gen config` builds the base the
# provider builds, and `validate --strict` is the release's own validation of
# the document, with its warnings made errors. A node applying the document
# also checks it against its own running state, which no document alone can
# answer and this does not reach. This version is the fleet's release, `versions:talos` in Pulumi.yaml, so the
# verdict is the pinned release's own -- a test holds the two equal, and one
# renovate rule moves both.
talosctl = "1.13.9"
# node runs ZeroTier's own rule compiler, which the suite asks whether Central
# would accept the overlay's rendered flow rules. The compiler is JavaScript
# with no dependencies, vendored at the release the CI member runs
# (tests/vendor/zerotier-rule-compiler/source.toml), so node is the whole of
# what it needs installed.
node = "24.21.0"
# The prose checker AGENTS.md's gate runs over every markdown file, and the
# one gate tool no registry carries: it is pinned straight to its GitHub
# release, whose `linux-x64` archive bundles the Java it runs on, so a runner
# needs no JDK beside it. Both `ltex-cli-plus` and the `ltex-ls-plus` server
# the editors speak to come from this one archive.
#
# The empty `version_prefix` is what keeps the install off the GitHub API,
# which a Claude Code cloud session's GitHub proxy refuses for every repository
# not attached to the session (framework/dispatch.md §1.4). This project tags
# its releases without a `v`, and without the option mise looks for a
# `v`-prefixed tag first. With it, and from mise 2026.9.14 on, the release and
# its attestation come from mise's versions host and the archive from the
# release download, and `api.github.com` is asked only if that host fails; an
# earlier mise asks the API whatever the prefix. That floor is why CI and the
# cloud session install one mise, pinned in the workflows and in
# `deploy/cloud-session/toolchain.sh` (framework/ci.md §3). Renovate reads the
# table form as it read the bare string: same dependency, same datasource, the
# `version` moved.
"github:ltex-plus/ltex-ls-plus" = { version = "18.7.0", version_prefix = "" }

# What a `pulumi` run needs that no template can compute: the Pulumi
# stack passphrase, recovered from its escrow ciphertext (docs/credentials.md
# §2.2), and the backend URL and the three files of the client bundle it
# connects with. Each is read from its **workstation slot** -- a git-ignored
# file under `.credentials/`, written by a `credentials` or `state-backend`
# command (credentials.md §1 rule 6).
#
# No provider credential is among them, the `github` stack's admin token
# included: each of those is a secret in its own stack's committed
# configuration, which the program reads for itself with a passphrase
# (credentials.md §3).
#
# **Nothing here reaches an operator stack** -- a stack no CI job runs, `github`
# among them (framework/pulumi.md §3.3). Those are encrypted under a
# passphrase of their own and may keep their state somewhere other than the
# backend below, and a template cannot see which stack a command names, so
# neither value can be chosen here. They run through the `operator-stack`
# driver, which sets both on the process it starts and removes these, so
# `operator-stack github plan` rather than `pulumi preview -s github`. A bare
# `pulumi ... -s github` meets the stack passphrase, and that is not silent:
# `encryptionsalt` is a verifier, so `pulumi` answers `error: incorrect
# passphrase` and exits non-zero having written nothing.
#
# Every one of them falls back to whatever is already in the environment
# rather than to an empty string: CI sets the passphrase on the step that runs
# `pulumi`, from an Environment secret, and a blank value here would overwrite
# it (framework/ci.md §2); the bundle and its URL CI materializes into the
# slot instead (below). The Python side finds `.credentials/` by walking up to
# this file (`kluster.lib.workstation`), so a slot a command writes and a slot
# a template reads agree on `config_root` -- the directory holding this file
# -- rather than by coincidence.
#
# Where a slot exists it outranks the environment, because the slot is the
# source: inside a checkout that holds one, an exported `PULUMI_BACKEND_URL`
# does not redirect a `pulumi` run through `mise x`. A scratch probe therefore
# calls the binary `mise which pulumi` names with its own backend in that one
# command (framework/testing.md §5.1).
#
# The slots answer for the checkout itself and for nothing under its
# `.claude/`, which is where `jj` workspaces live (framework/dispatch.md
# §1.2). A workspace holds no slots of its own -- `.credentials/` is ignored
# and never copied -- but mise renders every `mise.toml` from the working
# directory up, so inside a workspace these templates run twice: first from
# the enclosing checkout's copy, with `config_root` naming that checkout, and
# then from the workspace's own, which fall back to whatever the first
# rendering put in the environment. Unguarded, that hands every workspace the
# enclosing checkout's backend URL and passphrases ahead of the shell's,
# while the Python side, which finds `.credentials/` from its own source tree
# (`workstation.directory()`), gives a workspace none. So each template
# answers as if no slot existed when the working directory lies under
# `config_root/.claude/`, and a `pulumi` run that needs the slots runs from
# the checkout that holds them (kluster-ops#387). The test is a prefix match
# with the separator included, so `.claude-notes/`, or a sibling checkout
# whose name extends this one's, is not under it; Tera's `starting_with`
# takes only a literal, which is why it is spelled as a `split` whose first
# piece is empty. The guard is repeated in each template rather than set once
# in `[vars]`: mise merges `[vars]` across config files with the nearest
# winning, so there it would be computed against the workspace's own
# `config_root` and never fire.
[env]
PULUMI_CONFIG_PASSPHRASE = """
{%- set slot = [config_root, '.credentials/pulumi.passphrase'] | join_path -%}
{%- set claude = [config_root, '.claude'] | join_path ~ '/' -%}
{%- set nested = (cwd ~ '/') | split(pat=claude) | first == '' -%}
{%- if slot is file and not nested -%}
{{- read_file(path=slot) | trim -}}
{%- else -%}
{{- env.PULUMI_CONFIG_PASSPHRASE | default(value="") -}}
{%- endif -%}
"""
PULUMI_BACKEND_URL = """
{%- set slot = [config_root, '.credentials/state-backend/backend-url'] | join_path -%}
{%- set claude = [config_root, '.claude'] | join_path ~ '/' -%}
{%- set nested = (cwd ~ '/') | split(pat=claude) | first == '' -%}
{%- if slot is file and not nested -%}
{{- read_file(path=slot) | trim -}}
{%- else -%}
{{- env.PULUMI_BACKEND_URL | default(value="") -}}
{%- endif -%}
"""
# The bundle the URL above authenticates with. It names no path itself, so the
# three files travel as the libpq variables — which is the one channel both
# libpq and the driver behind Pulumi's Postgres backend read, and which
# nothing has to expand. Each is tested on the slot's URL file, the same test
# the URL itself makes, so the four come from one place -- the slot, or else
# the environment -- rather than a URL from one and a certificate from the
# other. CI runs `pulumi` through mise too, and materializes the `ci` bundle
# into `.credentials/state-backend/` of the checkout, so it resolves here
# exactly as a workstation does.
PGSSLROOTCERT = """
{%- set slot = [config_root, '.credentials/state-backend'] | join_path -%}
{%- set slot_url = [slot, 'backend-url'] | join_path -%}
{%- set claude = [config_root, '.claude'] | join_path ~ '/' -%}
{%- set nested = (cwd ~ '/') | split(pat=claude) | first == '' -%}
{%- if slot_url is file and not nested -%}
{{- [slot, 'ca.crt'] | join_path -}}
{%- else -%}
{{- env.PGSSLROOTCERT | default(value="") -}}
{%- endif -%}
"""
PGSSLCERT = """
{%- set slot = [config_root, '.credentials/state-backend'] | join_path -%}
{%- set slot_url = [slot, 'backend-url'] | join_path -%}
{%- set claude = [config_root, '.claude'] | join_path ~ '/' -%}
{%- set nested = (cwd ~ '/') | split(pat=claude) | first == '' -%}
{%- if slot_url is file and not nested -%}
{{- [slot, 'client.crt'] | join_path -}}
{%- else -%}
{{- env.PGSSLCERT | default(value="") -}}
{%- endif -%}
"""
PGSSLKEY = """
{%- set slot = [config_root, '.credentials/state-backend'] | join_path -%}
{%- set slot_url = [slot, 'backend-url'] | join_path -%}
{%- set claude = [config_root, '.claude'] | join_path ~ '/' -%}
{%- set nested = (cwd ~ '/') | split(pat=claude) | first == '' -%}
{%- if slot_url is file and not nested -%}
{{- [slot, 'client.key'] | join_path -}}
{%- else -%}
{{- env.PGSSLKEY | default(value="") -}}
{%- endif -%}
"""

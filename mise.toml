# mise does not echo these back in `mise env` or a task's command line. The
# passphrase is a secret -- the Pulumi stack passphrase decrypts the state and
# the config of every stack but `physical` and the operator stacks. The URL carries no
# credential -- the client key is a file `PGSSLKEY` names -- and is redacted
# all the same: it names the state backend's address and role. This list is
# variable names; the files they are read from are covered by .gitignore
# instead.
redactions = ["PULUMI_CONFIG_PASSPHRASE", "PULUMI_BACKEND_URL"]

# A version names a release, not its bytes: a publisher can upload a release
# asset again under the version it already had, and an install by version takes
# whatever is there. `mise.lock` records, for each tool below, the release's
# download URL and the sha256 of the artifact behind it, and an install checks
# what it downloaded against that sum and refuses a mismatch. `locked` is what
# makes the record binding. Without it, a tool with no matching entry -- a pin
# moved here and not in the lock -- installs anyway and the install writes
# down the sum of whatever it fetched, so the record would vouch for nothing.
# With it, that install refuses by name, and `mise lock` is what moves an
# entry: a bump of a pin is finished when its entry has moved with it, and a
# test holds every pin to an entry carrying a sum.
#
# The lock holds `linux-x64`, the platform of every runner, of a cloud
# session and of the workstations; `mise lock` refreshes the platforms a lock
# already holds, so renovate keeps that set. A checkout on another platform
# adds its own with `mise lock --platform`. `mise lock` also rewrites the sum
# of an entry whose version has not moved to what the release serves now, so a
# lock diff that changes a sum and not its version is a release re-uploaded
# under its name, and is read as one.
[tool_config]
locked = true

# Pinned, not `latest`: CI installs from this file, so a floating version is a
# breaking upgrade that lands without a PR, a preview, or a way to bisect it.
# Renovate maintains these -- it cannot bump `latest`, which is why they are
# written out.
[tools]
pulumi = "3.274.1"
uv = "0.13.7"
# age is the tool this repository escrows with rather than a format it
# reimplements: `age`/`age-keygen` write and open every ciphertext under
# `escrow/`, and the box's dumps are age-encrypted too; butane renders the
# appliance's Ignition. This version tracks the appliance's pin
# (`kluster.lib.state_backend.settings`), so the round trip the tests exercise is the one
# that actually runs there -- a test holds the two equal.
age = "1.3.1"
"aqua:coreos/butane" = "0.29.0"
# The Postgres client `state-backend dump` and `restore` run: `pg_dump` and
# `pg_restore`, and `psql` beside them, linked against the libpq that reads the
# client bundle's `PGSSL*` paths. mise's registry resolves the name to
# `conda:postgresql`, prebuilt from the `conda-forge` channel -- mise's default,
# written out because `mise.lock` records the channel as an option of the
# entry -- and the lock holds the sum of every conda package the install
# unpacks, not only this one. The major is
# the appliance's (`POSTGRES_IMAGE` in `kluster.lib.state_backend.settings`):
# `pg_dump` refuses a server of a newer major than its own, and what a client
# of a newer major writes is not guaranteed to load into the appliance's
# server, even when it was dumped from that server -- a test holds the two
# majors equal.
postgres = { version = "17.11", channel = "conda-forge" }
# The awk the appliance's dump script runs under, so the suite judges the
# script's parser with the interpreter the box judges it with rather than
# whichever `awk` a host has. The box's `awk` is Fedora CoreOS's gawk, at the
# release `FCOS_RELEASE` in `kluster.lib.state_backend.settings` names: 5.3.2
# there. gawk publishes source alone, so it comes from the `conda-forge`
# channel like the Postgres client above, whose builds of the 5.3 line stop at
# 5.3.1. The pin follows the appliance's gawk line rather than gawk's newest
# release: Fedora CoreOS 44 ships gawk 5.3. Each Fedora major ships its own
# line, so a bump of the appliance's FCOS major re-checks this pin -- read the
# new build's gawk off its package list (`rpmostree.rpmdb.pkglist` in the
# build's `commitmeta.json`) and move the pin to that line.
"conda:gawk" = { version = "5.3.1", channel = "conda-forge" }
# The `xsltproc` the libvirt provider runs on the machine running the
# `physical` stack, to apply every `xml.xslt` a declaration hands it
# (framework/pulumi.md §3.2): every libvirt resource the homelab host declares
# through a stylesheet, from `components/homelab/templates/`. The stack runs
# under `mise x`, so the provider finds this one on `PATH`. libxslt publishes
# source alone, so it comes from the `conda-forge` channel like the Postgres
# client and gawk.
"conda:libxslt" = { version = "1.1.45", channel = "conda-forge" }
# jq is what the scripts under test run beside that awk -- the dump script on
# the box, and the workflow steps the suite runs as they are written -- and
# what the runbooks filter a JSON reading with, reaching it through mise as
# the style rule has them reach a pinned tool (docs/style/README.md,
# "Comments and docs").
# Its releases are static binaries.
jq = "1.8.2"
# The shell the gateway runs its `#!/bin/sh` scripts under, so the suite runs
# every such device template under the interpreter the device runs it with
# rather than whichever `/bin/sh` a host has, which is not the device's: bash
# on a workstation, which accepts the bashisms dash refuses, and the runner
# image's own build of dash on CI's Ubuntu runners (tests/device_shell.py). The
# gateway's base is Debian 13 (docs/physical/gateway.md §1), whose dash is
# `0.5.12-12`: upstream's 0.5.12 release with Debian's patches on it, built
# without the C library's `fnmatch` and without libedit. The patches change
# what a script may say -- `set -o pipefail`, which upstream took only in
# 0.5.13, and `\e` in `echo` and `printf` -- so a build of upstream's 0.5.12
# refuses scripts the device runs, and the pin is Debian's own package: the
# amd64 build of the device's, from the same source, patches and configuration,
# the architecture all that separates the two. Its binary links the C library
# alone, at the floor the package's `Pre-Depends` names, so any host with glibc
# 2.38 or later runs it. The pin's version is the package's Debian version,
# revision included, and it follows the device's package rather than dash's
# newest release: `gateway-health` reads the device's `dash` package against
# `DEVICE_BASE.dash_version` in `kluster.components.gateway`, which
# `tests/test_dash_pin.py` holds equal to this version, so a firmware that
# brings another dash -- a newer Debian, or a revision within this one -- is a
# finding, and the pin moves to that package by hand (docs/operations.md §1,
# the gateway's dash row, says what moves it). The package comes from
# snapshot.debian.org, which keeps every package Debian has published at a
# fixed URL, and the sum is the one the release's `Packages` index lists for
# it, in the `InRelease` that the release's archive keys sign.
#
# mise's `http` backend does not unpack a `.deb`: it installs the package file
# itself, here as `usr/bin/dash`, and the `postinstall` replaces that file with
# the binary the package's data archive holds at that path, read by the
# `bsdtar` of the `conda:libarchive` pin below. The binary alone is taken,
# because the package's `usr/bin/sh` link would put dash ahead of a host's `sh`
# for everything run under `mise x`. That layer is `bin`, `depends`,
# `postinstall` and the `conda:libarchive` pin. It goes once mise unpacks a
# `.deb` and can install one executable out of it; a mise that does unpack it
# fails this install by name, since `bsdtar` is then handed an executable
# instead of a package. mise's safe mode (`MISE_SAFE=1`) refuses an install
# that runs a tool's `postinstall`; a `mise lock` is no install, so renovate's,
# which runs in that mode, passes.
"http:dash".version = "0.5.12-12"
"http:dash".bin_path = "usr/bin"
"http:dash".bin = "dash"
"http:dash".depends = ["conda:libarchive"]
"http:dash".postinstall = 'cd "$MISE_TOOL_INSTALL_PATH" && bsdtar -xOf usr/bin/dash "data.tar.*" | bsdtar -xf - ./usr/bin/dash'
"http:dash".platforms.linux-x64.url = "https://snapshot.debian.org/archive/debian/20250204T211159Z/pool/main/d/dash/dash_{{ version }}_amd64.deb"
"http:dash".platforms.linux-x64.checksum = "sha256:a8902cb6d8650134764a25fb80aec8589d858ef71ece1680a62e84816c37bb04"
# The `bsdtar` that takes dash's binary out of its Debian package, in the
# `http:dash` pin's `postinstall` above, and nothing else: libarchive reads
# both the package's `ar` container and the compressed `tar` inside it. It is
# part of that pin's layer and goes with it. libarchive publishes source alone,
# so it comes from the `conda-forge` channel like the Postgres client, gawk and
# libxslt.
"conda:libarchive" = { version = "3.8.11", channel = "conda-forge" }

# jj is the version control a workstation runs, and the operator-stack driver
# reads a jj checkout's working copy through it, so the cases that hold that
# reading run the pinned release here and in CI alike. Its releases are
# static binaries.
jj = "0.47.1"
# talosctl is what the suite asks whether Talos accepts the machine
# configuration the Talos component renders: `gen config` builds the base the
# provider builds, and `validate --strict` is the release's own validation of
# the document, with its warnings made errors. A node applying the document
# also checks it against its own running state, which no document alone can
# answer and this does not reach. The suite also reads, from `images default`,
# the Kubernetes release the pinned Talos defaults to, whose minor the kubectl
# pin below is held to. It is also the client the runbooks read and steer the
# nodes with, through `mise x`. This version is the fleet's release,
# `versions:talos` in Pulumi.yaml, so the verdict is the pinned release's own,
# and a runbook's client speaks the nodes' release -- a test holds the two
# equal, and one renovate rule moves both.
talosctl = "1.13.9"
# kubeseal is what `credentials` seals the cluster's sealed values with
# (docs/credentials.md §1 rule 6): the format is a hybrid encryption of the
# sealed-secrets controller's own, so the tool built for it does the sealing
# rather than a reimplementation that could disagree with the controller. The
# suite opens what it seals with `--recovery-unseal` and a key pair of its own.
# This version is the controller's release (rfc-007 §6.1).
kubeseal = "0.39.1"
# doggo is the DNS client the runbooks ask a public resolver with, so that a
# reading of what the world resolves is taken by the same client on every
# workstation rather than by whichever `dig` a host has, or lacks: the anchor
# reading of the whole-cluster rebuild (docs/operations.md §3.5, `anchors`).
# Its releases are static binaries.
doggo = "1.4.2"
# gh is GitHub's client, which the runbooks and `drill rebuild` read and
# steer the forge with: the deploy chain's runs and workflows, a pull
# request's merge, the Environments and their secret names. The drill parses
# the JSON its `--json` fields print, so every workstation reads that output
# from one release. mise's registry resolves the name to `aqua:cli/cli`. Its
# releases are static binaries.
gh = "2.104.0"
# kubectl is the client a runbook reads and steers the cluster with, under the
# kubeconfig `physical`'s outputs carry. kubectl is supported within one
# minor of the API server, so its minor is the one of the Kubernetes the
# pinned Talos release defaults to, which the cluster runs (operations.md §1,
# the Kubernetes version row): v1.36 under Talos v1.13. A test holds the two
# minors equal, and an `allowedVersions` bound in `renovate.json5` keeps
# renovate on that line, so a Talos release that defaults to another minor
# moves this pin and the bound in its own pull request. The runbooks' reads of
# the legacy cluster run this client too, outside that window by the
# operator's ruling, until the legacy cluster retires (kluster-ops#79). Its
# releases are static binaries, from the Kubernetes project's own download
# host rather than from GitHub.
kubectl = "1.36.6"
# cmctl is cert-manager's client, which asks the cluster's cert-manager what
# a certificate's state is and renews one on demand (`cmctl renew`). It is
# versioned apart from cert-manager and built against one cert-manager
# release, so the pin is the line built against the release line of the
# cluster's chart (`versions:chart-cert-manager` in Pulumi.yaml): the cmctl
# 2.6 line is built against cert-manager 1.21. An `allowedVersions` bound in
# `renovate.json5` keeps renovate on that line, so a chart bump to another
# minor moves this pin and the bound by hand, to the line built against it,
# which cmctl's `go.mod` names. Its releases are static binaries.
cmctl = "2.6.2"
# Helm is what `update_crds` pulls the pinned chart set with and renders it
# with, offline. It finds the binary on `PATH`, so it runs under `mise x`. The
# release is the Helm SDK the kubernetes provider renders charts with: the one
# its plugin embeds, at the `pulumi-kubernetes` release `uv.lock` pins, whose
# Go build information names it in a `dep helm.sh/helm/v3` line. So the bundle
# comes out of the template engine the cluster's charts are installed with. The
# Kubernetes release a chart renders for is the other half of what it sees,
# and no Helm release carries that one: `update_crds` hands `helm template`
# the release the cluster runs, with `--kube-version`
# (`update_crds.sources.kube_version`). A test reads the `dep` line out of the
# plugin and holds this pin equal to it. Renovate leaves the pin alone (its rule
# in `renovate.json5`): it moves by hand, with `mise lock helm`, in the pull
# request that bumps `pulumi-kubernetes` to a release embedding another Helm,
# which that test holds red until it has. Its releases are static binaries,
# from the Helm project's own download host rather than from GitHub.
helm = "3.20.2"
# vmctl is VictoriaMetrics' migration client, which imports the legacy
# Prometheus's series into the history store at Wave C's head
# (docs/cluster/migration.md §2.1). It reaches each store only through its
# HTTP API -- Prometheus's remote read on one side, VictoriaMetrics' import on
# the other -- and reads no store's files, so the release it runs at is
# indifferent to the one the stores run. vmalert-tool evaluates the cluster's
# alerting rules over synthesized series in the suite
# (tests/test_alert_evaluation.py), and has to be the engine the cluster's
# vmalert runs, so the pin is the stack chart's release, its `appVersion`,
# which a test there holds it to, and renovate moves it beside the chart, in
# the `victoriametrics` group. VictoriaMetrics publishes both only inside the
# `vmutils` archive of each release, beside the other utilities, as
# `vmctl-prod` and `vmalert-tool-prod`: `matching_regex` narrows the assets to
# those archives and leaves the platform to mise's selection, `rename_exe`
# drops each binary's `-prod`, and `filter_bins` puts those two alone on
# `PATH`, so the archive's `vmbackup-prod` and the rest stay off it. Both are
# applied when mise installs a release, so a change to either reaches an
# installed release only through
# `mise install --force github:VictoriaMetrics/VictoriaMetrics`. The key is
# the repository, which is how mise's GitHub backend names a tool. Its
# releases are static binaries.
"github:VictoriaMetrics/VictoriaMetrics" = { version = "v1.156.0", matching_regex = '^vmutils-[a-z0-9]+-[a-z0-9]+-v[0-9.]+\.(tar\.gz|zip)$', rename_exe = { "vmctl-prod" = "vmctl", "vmalert-tool-prod" = "vmalert-tool" }, filter_bins = "vmctl,vmalert-tool" }
# node runs ZeroTier's own rule compiler, which the suite asks whether Central
# would accept the overlay's rendered flow rules. The compiler is JavaScript
# with no dependencies, vendored at the release the CI member runs
# (tests/vendor/zerotier-rule-compiler/source.toml), so node is the whole of
# what it needs installed.
node = "24.22.0"
# The prose checker AGENTS.md's gate runs over every markdown file but the
# generated SDKs' under `sdks/`, and the one gate tool no registry carries: it
# is pinned straight to its GitHub
# release, whose `linux-x64` archive bundles the Java it runs on, so a runner
# needs no JDK beside it. Both `ltex-cli-plus` and the `ltex-ls-plus` server
# the editors speak to come from this one archive.
#
# The empty `version_prefix` is what keeps the install off the GitHub API,
# which a Claude Code cloud session's GitHub proxy refuses for every repository
# not attached to the session (framework/dispatch.md §1.4). This project tags
# its releases without a `v`, and without the option mise looks for a
# `v`-prefixed tag first. With it, and from mise 2026.9.14 on, the release and
# its attestation come from mise's versions host and the archive from the
# release download, and `api.github.com` is asked only if that host fails; an
# earlier mise asks the API whatever the prefix. That floor is why CI and the
# cloud session install one mise, pinned in the workflows and in
# `deploy/cloud-session/toolchain.sh` (framework/ci.md §3). Renovate reads the
# table form as it read the bare string: same dependency, same datasource, the
# `version` moved.
"github:ltex-plus/ltex-ls-plus" = { version = "18.7.0", version_prefix = "" }

# What a `pulumi` run needs that no template can compute: the Pulumi
# stack passphrase, recovered from its escrow ciphertext (docs/credentials.md
# §2.2), and the backend URL and the three files of the client bundle it
# connects with. Each is read from its **workstation slot** -- a git-ignored
# file under `.credentials/`, written by a `credentials` or `state-backend`
# command (credentials.md §1 rule 6).
#
# No provider credential is among them, the `github` stack's admin token
# included: each of those is a secret in its own stack's committed
# configuration, which the program reads for itself with a passphrase
# (credentials.md §3).
#
# **Nothing here reaches an operator stack** -- a stack no CI job runs, `github`
# among them (framework/pulumi.md §3.3). Those are encrypted under a
# passphrase of their own and may keep their state somewhere other than the
# backend below, and a template cannot see which stack a command names, so
# neither value can be chosen here. They run through the `operator-stack`
# driver, which sets both on the process it starts and removes these, so
# `operator-stack github plan` rather than `pulumi preview -s github`. A bare
# `pulumi ... -s github` meets the stack passphrase, and that is not silent:
# `encryptionsalt` is a verifier, so `pulumi` answers `error: incorrect
# passphrase` and exits non-zero having written nothing.
#
# **Nor does `physical`'s passphrase**, for the same reason: that stack is
# encrypted under a passphrase of its own, which reaches only the CI
# Environments a pull request cannot (credentials.md §3), and a template
# cannot see that a command names `physical`. A run by hand against it names
# that passphrase's slot to `pulumi` itself, with the passphrase below taken
# out of its environment -- `mise x -- env -u PULUMI_CONFIG_PASSPHRASE
# PULUMI_CONFIG_PASSPHRASE_FILE=.credentials/physical.passphrase pulumi ...
# --stack physical` (credentials.md §4.4); one that does not meets the
# verifier the same way.
#
# Every one of them falls back to whatever is already in the environment
# rather than to an empty string: CI sets the passphrase on the step that runs
# `pulumi`, from an Environment secret, and a blank value here would overwrite
# it (framework/ci.md §2); the bundle and its URL CI materializes into the
# slot instead (below). The Python side finds `.credentials/` by walking up to
# this file (`kluster.lib.workstation`), so a slot a command writes and a slot
# a template reads agree on `config_root` -- the directory holding this file
# -- rather than by coincidence.
#
# Where a slot exists it outranks the environment, because the slot is the
# source: inside a checkout that holds one, an exported `PULUMI_BACKEND_URL`
# does not redirect a `pulumi` run through `mise x`. A scratch probe therefore
# calls the binary `mise which pulumi` names with its own backend in that one
# command (framework/testing.md §5.1).
#
# The slots answer for the checkout itself and for nothing under its
# `.claude/`, which is where `jj` workspaces live (framework/dispatch.md
# §1.2). A workspace holds no slots of its own -- `.credentials/` is ignored
# and never copied -- but mise renders every `mise.toml` from the working
# directory up, so inside a workspace these templates run twice: first from
# the enclosing checkout's copy, with `config_root` naming that checkout, and
# then from the workspace's own, which fall back to whatever the first
# rendering put in the environment. Unguarded, that hands every workspace the
# enclosing checkout's backend URL and passphrases ahead of the shell's,
# while the Python side, which finds `.credentials/` from its own source tree
# (`workstation.directory()`), gives a workspace none. So each template
# answers as if no slot existed when the working directory lies under
# `config_root/.claude/`, and a `pulumi` run that needs the slots runs from
# the checkout that holds them (kluster-ops#387). The test is a prefix match
# with the separator included, so `.claude-notes/`, or a sibling checkout
# whose name extends this one's, is not under it; Tera's `starting_with`
# takes only a literal, which is why it is spelled as a `split` whose first
# piece is empty. The guard is repeated in each template rather than set once
# in `[vars]`: mise merges `[vars]` across config files with the nearest
# winning, so there it would be computed against the workspace's own
# `config_root` and never fire.
[env]
PULUMI_CONFIG_PASSPHRASE = """
{%- set slot = [config_root, '.credentials/pulumi.passphrase'] | join_path -%}
{%- set claude = [config_root, '.claude'] | join_path ~ '/' -%}
{%- set nested = (cwd ~ '/') | split(pat=claude) | first == '' -%}
{%- if slot is file and not nested -%}
{{- read_file(path=slot) | trim -}}
{%- else -%}
{{- env.PULUMI_CONFIG_PASSPHRASE | default(value="") -}}
{%- endif -%}
"""
# The URL in the slot is the bundle's connection string: `psql` reads it as
# it is written, and `pg_dump` and `pg_restore` with the pooler's session
# entry as its database (`kluster.lib.bundle.Purpose`). What `pulumi` is given
# has `binary_parameters=yes` added to its query: the `lib/pq` driver behind
# Pulumi's Postgres backend then sends each statement in one round trip, which
# a transaction-pooling pooler needs, and libpq refuses the parameter, which
# is why it is added here rather than written into the slot. The Python side
# forms the same value (`kluster.lib.bundle.pulumi_url`), and
# `tests/test_mise_env.py` holds the two equal. The parameter is that
# driver's, so a URL of another scheme is passed on as the slot holds it, and
# so is a value from the environment: whoever exported it formed it.
PULUMI_BACKEND_URL = """
{%- set slot = [config_root, '.credentials/state-backend/backend-url'] | join_path -%}
{%- set claude = [config_root, '.claude'] | join_path ~ '/' -%}
{%- set nested = (cwd ~ '/') | split(pat=claude) | first == '' -%}
{%- if slot is file and not nested -%}
{%- set url = read_file(path=slot) | trim -%}
{%- if url is not starting_with(pat='postgres://') -%}
{{- url -}}
{%- elif '?' in url -%}
{{- url ~ '&binary_parameters=yes' -}}
{%- else -%}
{{- url ~ '?binary_parameters=yes' -}}
{%- endif -%}
{%- else -%}
{{- env.PULUMI_BACKEND_URL | default(value="") -}}
{%- endif -%}
"""
# The bundle the URL above authenticates with. It names no path itself, so the
# three files travel as the libpq variables — which is the one channel both
# libpq and the driver behind Pulumi's Postgres backend read, and which
# nothing has to expand. Each is tested on the slot's URL file, the same test
# the URL itself makes, so the four come from one place -- the slot, or else
# the environment -- rather than a URL from one and a certificate from the
# other. CI runs `pulumi` through mise too, and materializes the `ci` bundle
# into `.credentials/state-backend/` of the checkout, so it resolves here
# exactly as a workstation does.
PGSSLROOTCERT = """
{%- set slot = [config_root, '.credentials/state-backend'] | join_path -%}
{%- set slot_url = [slot, 'backend-url'] | join_path -%}
{%- set claude = [config_root, '.claude'] | join_path ~ '/' -%}
{%- set nested = (cwd ~ '/') | split(pat=claude) | first == '' -%}
{%- if slot_url is file and not nested -%}
{{- [slot, 'ca.crt'] | join_path -}}
{%- else -%}
{{- env.PGSSLROOTCERT | default(value="") -}}
{%- endif -%}
"""
PGSSLCERT = """
{%- set slot = [config_root, '.credentials/state-backend'] | join_path -%}
{%- set slot_url = [slot, 'backend-url'] | join_path -%}
{%- set claude = [config_root, '.claude'] | join_path ~ '/' -%}
{%- set nested = (cwd ~ '/') | split(pat=claude) | first == '' -%}
{%- if slot_url is file and not nested -%}
{{- [slot, 'client.crt'] | join_path -}}
{%- else -%}
{{- env.PGSSLCERT | default(value="") -}}
{%- endif -%}
"""
PGSSLKEY = """
{%- set slot = [config_root, '.credentials/state-backend'] | join_path -%}
{%- set slot_url = [slot, 'backend-url'] | join_path -%}
{%- set claude = [config_root, '.claude'] | join_path ~ '/' -%}
{%- set nested = (cwd ~ '/') | split(pat=claude) | first == '' -%}
{%- if slot_url is file and not nested -%}
{{- [slot, 'client.key'] | join_path -}}
{%- else -%}
{{- env.PGSSLKEY | default(value="") -}}
{%- endif -%}
"""
# How every `pulumi` run writes a stack's state: the checkpoint compressed
# with zstd, as `<stack>.json.zst`, and no copy of it under `backups/` at the
# end of each writing operation (pulumi's `PULUMI_DIY_BACKEND_ZSTD` and
# `PULUMI_DIY_BACKEND_DISABLE_CHECKPOINT_BACKUPS`, `sdk/go/common/env` and
# `pkg/backend/diy/state.go` at the pinned CLI). The backend moves every
# object whole, and the server serving one statement holds several copies of
# the value it reads or writes, so the value's size is what one statement
# costs the appliance (physical/state-backend.md §2). Every job that runs
# `pulumi` runs it through `mise x`, as a workstation does, so every writer of
# a stack CI deploys writes it this way; a reader needs neither, because the
# backend finds the checkpoint under whichever suffix it has and reads its
# compression off its first bytes. Literal values rather than templates,
# since no slot decides them, so a caller's own setting is overridden too.
#
# An operator stack's run starts with none of its caller's `PULUMI_`
# variables (`stack_environment.process`), so the `operator-stack` driver and
# a `credentials` command take these from this table instead: every `PULUMI_`
# variable it sets to a literal value (`stack_environment.state_switches`).
# An operator stack kept in the estate's backend is given them, and is written
# as the stacks CI deploys are. The stack whose state is committed is given
# neither, and its checkpoint stays the plain `<stack>.json` that git and its
# checks read (framework/pulumi.md §3.3).
PULUMI_DIY_BACKEND_ZSTD = "true"
PULUMI_DIY_BACKEND_DISABLE_CHECKPOINT_BACKUPS = "true"
# The stack the prose checker's language server runs its threads on. Its
# markdown inline-math parser scans from a lone `$` to the end of the block
# with a `java.util.regex` lazy loop, which recurses once per character: past
# a few hundred words after the `$` the worker overflows the default stack,
# the server swallows the `StackOverflowError`, and `ltex-cli-plus` waits for
# diagnostics that never come (kluster-ops#465). Every way this repository
# reaches the checker -- AGENTS.md's recipe, the prose step -- is `mise x --
# ltex-cli-plus`, which carries this; ltex is the only Java among the tools
# above. A workaround, held by `tests/test_ltex_stack.py`: remove this line
# when that case fails because the pinned release checks its reproducer on
# the default stack.
JAVA_OPTS = "-Xss16m"

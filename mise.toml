# All three are secrets in the sense that matters here -- one passphrase
# decrypts the estate's config and state, the other decrypts the `github`
# stack's config, and the URL names a client key -- so mise does not echo them
# back in `mise env` or a task's command line. This list is variable names; the
# files they are read from are covered by .gitignore instead.
redactions = ["PULUMI_CONFIG_PASSPHRASE", "KLUSTER_GITHUB_PASSPHRASE", "PULUMI_BACKEND_URL"]

# Pinned, not `latest`: CI installs from this file, so a floating version is a
# breaking upgrade that lands without a PR, a preview, or a way to bisect it.
# Renovate maintains these -- it cannot bump `latest`, which is why they are
# written out.
[tools]
pulumi = "3.257.0"
uv = "0.11.26"
# age is the tool this repository escrows with rather than a format it
# reimplements: `age`/`age-keygen` write and open every ciphertext under
# `escrow/`, and the box's dumps are age-encrypted too; butane renders the
# appliance's Ignition. This version tracks the appliance's pin
# (state_backend/settings.py), so the round trip the tests exercise is the one
# that actually runs there -- a test holds the two equal.
age = "1.3.1"
"aqua:coreos/butane" = "0.29.0"
# The prose checker AGENTS.md's gate runs over every markdown file, and the
# one gate tool no registry carries: it is pinned straight to its GitHub
# release, whose `linux-x64` archive bundles the Java it runs on, so a runner
# needs no JDK beside it. Both `ltex-cli-plus` and the `ltex-ls-plus` server
# the editors speak to come from this one archive.
"github:ltex-plus/ltex-ls-plus" = "18.7.0"

# What a `pulumi` run needs that no template can compute: the state
# passphrase, recovered from its escrow ciphertext (docs/credentials.md
# §2.2), and the backend URL and the three files of the client bundle it
# connects with. Each is read from its **workstation slot** -- a git-ignored
# file under `.credentials/`, written by a `credentials` or `state-backend`
# command (credentials.md §1 rule 6).
#
# No provider credential is among them, the `github` stack's admin token
# included: each of those is a secret in its own stack's committed
# configuration, which the program reads for itself with a passphrase
# (credentials.md §3).
#
# **Which** passphrase is not something `[env]` can decide, and that is why
# the `github` one below is exported under a name of its own rather than as
# `PULUMI_CONFIG_PASSPHRASE`. That variable is process-global -- `pulumi` reads
# one value per invocation -- while the `github` stack's config is encrypted
# apart from the estate's, so the right value depends on the `-s` a command
# carries, and a template never sees the command line. Every `credentials`
# command resolves it from the stack it is acting on (`pulumi_config.Stack`);
# a `pulumi` an operator runs against that stack goes through the `github`
# task at the end of this file, which fixes the stack and passes this value in
# as `PULUMI_CONFIG_PASSPHRASE` together, so the one cannot be paired with the
# other's stack:
#
#     mise run github preview
#
# A bare `pulumi ... -s github` meets the estate passphrase, and that is not
# silent: `encryptionsalt` is a verifier, so `pulumi` answers `error: incorrect
# passphrase` and exits non-zero having written nothing. Note that
# `PULUMI_CONFIG_PASSPHRASE_FILE` is no use here -- `pulumi` prefers
# `PULUMI_CONFIG_PASSPHRASE` whenever it is set, including when it is set to
# the empty string, and this file always sets it.
#
# Every one of them falls back to whatever is already in the environment
# rather than to an empty string: CI passes them in as Environment secrets,
# and a blank value here would overwrite them (framework/ci.md §2). The
# `.credentials/` layout is what `workstation.py` writes, so the two agree on
# `config_root` -- the directory holding this file -- rather than by
# coincidence.
#
# Where a slot exists it outranks the environment, because the slot is the
# source: inside a checkout that holds one, an exported `PULUMI_BACKEND_URL`
# does not redirect a `pulumi` run through `mise x`. A scratch probe therefore
# calls the binary `mise which pulumi` names with its own backend in that one
# command (framework/testing.md §5.1).
#
# The slots answer for the checkout itself and for nothing under its
# `.claude/`, which is where `jj` workspaces live (framework/dispatch.md
# §1.2). A workspace holds no slots of its own -- `.credentials/` is ignored
# and never copied -- but mise renders every `mise.toml` from the working
# directory up, so inside a workspace these templates run twice: first from
# the enclosing checkout's copy, with `config_root` naming that checkout, and
# then from the workspace's own, which fall back to whatever the first
# rendering put in the environment. Unguarded, that hands every workspace the
# enclosing checkout's backend URL and passphrases ahead of the shell's,
# while the Python side, which finds `.credentials/` from its own source tree
# (`workstation.directory()`), gives a workspace none. So each template
# answers as if no slot existed when the working directory lies under
# `config_root/.claude/`, and a `pulumi` run that needs the slots runs from
# the checkout that holds them (kluster-ops#387). The test is a prefix match
# with the separator included, so `.claude-notes/`, or a sibling checkout
# whose name extends this one's, is not under it; Tera's `starting_with`
# takes only a literal, which is why it is spelled as a `split` whose first
# piece is empty. The guard is repeated in each template rather than set once
# in `[vars]`: mise merges `[vars]` across config files with the nearest
# winning, so there it would be computed against the workspace's own
# `config_root` and never fire.
[env]
PULUMI_CONFIG_PASSPHRASE = """
{%- set slot = [config_root, '.credentials/pulumi.passphrase'] | join_path -%}
{%- set claude = [config_root, '.claude'] | join_path ~ '/' -%}
{%- set nested = (cwd ~ '/') | split(pat=claude) | first == '' -%}
{%- if slot is file and not nested -%}
{{- read_file(path=slot) | trim -}}
{%- else -%}
{{- env.PULUMI_CONFIG_PASSPHRASE | default(value="") -}}
{%- endif -%}
"""
PULUMI_BACKEND_URL = """
{%- set slot = [config_root, '.credentials/state-backend/backend-url'] | join_path -%}
{%- set claude = [config_root, '.claude'] | join_path ~ '/' -%}
{%- set nested = (cwd ~ '/') | split(pat=claude) | first == '' -%}
{%- if slot is file and not nested -%}
{{- read_file(path=slot) | trim -}}
{%- else -%}
{{- env.PULUMI_BACKEND_URL | default(value="") -}}
{%- endif -%}
"""
# The bundle the URL above authenticates with. It names no path itself, so the
# three files travel as the libpq variables — which is the one channel both
# libpq and the driver behind Pulumi's Postgres backend read, and which
# nothing has to expand. Each is tested on the slot's URL file, the same test
# the URL itself makes, so the four come from one place -- the slot, or else
# the environment -- rather than a URL from one and a certificate from the
# other. CI runs `pulumi` through mise too, and materializes the `ci` bundle
# into `.credentials/state-backend/` of the checkout, so it resolves here
# exactly as a workstation does.
PGSSLROOTCERT = """
{%- set slot = [config_root, '.credentials/state-backend'] | join_path -%}
{%- set slot_url = [slot, 'backend-url'] | join_path -%}
{%- set claude = [config_root, '.claude'] | join_path ~ '/' -%}
{%- set nested = (cwd ~ '/') | split(pat=claude) | first == '' -%}
{%- if slot_url is file and not nested -%}
{{- [slot, 'ca.crt'] | join_path -}}
{%- else -%}
{{- env.PGSSLROOTCERT | default(value="") -}}
{%- endif -%}
"""
PGSSLCERT = """
{%- set slot = [config_root, '.credentials/state-backend'] | join_path -%}
{%- set slot_url = [slot, 'backend-url'] | join_path -%}
{%- set claude = [config_root, '.claude'] | join_path ~ '/' -%}
{%- set nested = (cwd ~ '/') | split(pat=claude) | first == '' -%}
{%- if slot_url is file and not nested -%}
{{- [slot, 'client.crt'] | join_path -}}
{%- else -%}
{{- env.PGSSLCERT | default(value="") -}}
{%- endif -%}
"""
# The `github` stack's own passphrase (credentials.md §3), under its own name
# because it must never become the ambient `PULUMI_CONFIG_PASSPHRASE`: that one
# is in every CI Environment, and this stack is the one nothing in CI may read.
# `credentials derived github-passphrase generate` (or `... recover`) writes the
# slot.
KLUSTER_GITHUB_PASSPHRASE = """
{%- set slot = [config_root, '.credentials/github.passphrase'] | join_path -%}
{%- set claude = [config_root, '.claude'] | join_path ~ '/' -%}
{%- set nested = (cwd ~ '/') | split(pat=claude) | first == '' -%}
{%- if slot is file and not nested -%}
{{- read_file(path=slot) | trim -}}
{%- else -%}
{{- env.KLUSTER_GITHUB_PASSPHRASE | default(value="") -}}
{%- endif -%}
"""
PGSSLKEY = """
{%- set slot = [config_root, '.credentials/state-backend'] | join_path -%}
{%- set slot_url = [slot, 'backend-url'] | join_path -%}
{%- set claude = [config_root, '.claude'] | join_path ~ '/' -%}
{%- set nested = (cwd ~ '/') | split(pat=claude) | first == '' -%}
{%- if slot_url is file and not nested -%}
{{- [slot, 'client.key'] | join_path -}}
{%- else -%}
{{- env.PGSSLKEY | default(value="") -}}
{%- endif -%}
"""

# `pulumi <args>` against the `github` stack, under that stack's own
# passphrase (the `[env]` comment above says why it has a name of its own):
# `mise run github preview`, `mise run github up --yes`,
# `mise run github config get <key>`, `mise run github stack --show-urns`. The
# task declares no `usage`, and that is what hands the arguments on whole:
# mise then appends them, each quoted, to the end of the script, which is why
# the script ends by calling `main` bare. A `usage` spec would hand them over
# as one pre-quoted string instead, and would route the ones after a leading
# `--` around it.
#
# mise keeps three words for itself, and only a `pulumi` command that carries
# one of them needs anything more than the plain form. A `--help` or `-h`
# anywhere is its own, and so is a `--`: a leading one always, and from mise
# 2026.9 on the first one wherever it stands. After a leading `--`, releases
# before and after that change alike pass the rest through whole, so that is
# the form for those three: `mise run github -- config set <key> -- <value>`,
# `mise run github -- up --help`. The `description` below says so too, because
# it is what mise prints when it takes a `--help` for itself. A `--` swallowed
# by mise leaves what followed it to be read as flags, and an `-s` there is
# refused like any other.
#
# It is shell rather than a Python console script because all it does is
# check and rearrange words before `exec pulumi`, and a Python entry point
# would start the virtualenv ahead of every `pulumi` run.
#
# The stack is the task's and never the caller's. An argument that can name
# one ahead of a `--` -- `--stack`, and any single-dash cluster holding an `s`,
# which is how `-s dev`, `-sdev` and `-ys dev` all reach the `-s` shorthand --
# is refused rather than overridden, since a caller who wrote one meant some
# other stack. `--stack github` is then placed after every flag the caller
# gave and ahead of any `--`, past which a word is an argument rather than a
# flag; `pulumi` keeps the last of a repeated flag, so the task's would count
# even beside one the refusal missed.
#
# An empty `KLUSTER_GITHUB_PASSPHRASE` is refused too, before `pulumi` starts.
# It is what the variable resolves to, unless the caller exported a value, on
# a machine without the slot and in a workspace under `.claude/`, where the
# slots do not answer (the `[env]` comment above); handed on, it would reach
# `pulumi` as an empty passphrase -- refused by the salt, or, in a stack file
# that has lost its salt, adopted as the new key (docs/credentials.md §4.2).
[tasks.github]
description = "pulumi <args> against the github stack, under that stack's own passphrase; a --, -h or --help meant for pulumi goes after a leading --: mise run github -- up --help"
# Without it mise echoes the script's first line, a `refuse() {` that says
# nothing, ahead of whatever `pulumi` prints.
quiet = true
run = '''
refuse() {
  echo "mise run github: $1" >&2
  exit 2
}
main() {
  [ "$#" -gt 0 ] || refuse 'name a pulumi command, as in `mise run github preview`'
  n=$#
  spliced=
  while [ "$n" -gt 0 ]; do
    a=$1
    shift
    n=$((n - 1))
    if [ -z "$spliced" ]; then
      case $a in
        --) set -- "$@" --stack github; spliced=1 ;;
        --stack | --stack=* | -s | -s?*) refuse "\`$a\` names a stack; this task runs against \`github\` alone" ;;
        --*) ;;
        -*s*) refuse "\`$a\` may carry the \`-s\` shorthand, which names a stack; write another short flag's value as a separate word or as \`--flag=value\`. This task runs against \`github\` alone" ;;
      esac
    fi
    set -- "$@" "$a"
  done
  [ -n "$spliced" ] || set -- "$@" --stack github
  [ -n "${KLUSTER_GITHUB_PASSPHRASE:-}" ] || refuse "KLUSTER_GITHUB_PASSPHRASE is empty, so there is no passphrase for the \`github\` stack. It is read from \`.credentials/github.passphrase\` in the checkout, which \`credentials derived github-passphrase recover\` writes, and never inside a workspace under \`.claude/\`: run from the checkout that holds it."
  PULUMI_CONFIG_PASSPHRASE=$KLUSTER_GITHUB_PASSPHRASE exec pulumi "$@"
}
main'''

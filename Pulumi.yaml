  versions:image-gateway-adguard-bob: ghcr.io/aetf/homelab-containers/adguard:16@sha256:bbd608d951fd70e54eee3e5072035a2b6a8979bc3959d5638e739fd851b2544f
  versions:image-gateway-zerotier: ghcr.io/aetf/homelab-containers/zerotier:16@sha256:953ee1cf70a9777d5a39c93b9a37da93afeefae19cbd7e133be304e8c52b309d

  # local-path-provisioner, which `k8s-base` declares as resources rather than

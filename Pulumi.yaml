name: kluster-py
runtime:
  name: python
  options:
    toolchain: uv
    virtualenv: .venv
description: Kluster configurations

# Project-level configuration: values that apply to every stack, which a
# stack's own file overrides only where it deliberately runs something
# different from the rest (rfc-002 §11.1).
#
# The `versions:` namespace is what this is for. Every pin the repository
# holds lives here, one kind per key prefix, so that five stack programs read
# one copy instead of five files drifting apart -- Pulumi has no include
# between stack configurations, and this is the mechanism that does not need
# one. `pulumi config set` cannot write project-level values, so these are
# hand-edited YAML, which is what a renovate-maintained pin wants anyway; a
# key in someone else's namespace may carry a value and neither a type nor a
# default. `lib/versions.py` is what reads them.
config:
  # The whole fleet's Talos release: machine configurations, the cloud image
  # imported from the factory, and the worker's `nocloud` disk image.
  versions:talos: v1.13.9

  # The gateway's container root filesystems, one pin per service and not one
  # per build -- the two resolvers run the same image, and separate keys are
  # what let one of them be proven before the other. Each is a whole reference,
  # `<repository>:<tag>@sha256:<digest>`: the digest is the identity, the tag is
  # where those bytes were found, and one renovate data source reads all three
  # off the line and moves the tag and the digest together.
  #
  # Which repository publishes a given build is still this repository's
  # decision, held as `conventions.gateway.image_repository` -- the stack checks
  # each pin against it and refuses a mismatch by key, so the two resolvers
  # cannot drift onto two different images.
  versions:image-gateway-caddy: ghcr.io/aetf/homelab-containers/caddy:3@sha256:8258d234b66696ef52b34e9cb5b73ca6af4dfcc0fc91c25e894374753e50780c
  versions:image-gateway-adguard-alice: ghcr.io/aetf/homelab-containers/adguard:3@sha256:45a2895bea93f2d7ed02a1ea4a36783e32eae29733ea613869724ddeb024aad5
  versions:image-gateway-adguard-bob: ghcr.io/aetf/homelab-containers/adguard:3@sha256:45a2895bea93f2d7ed02a1ea4a36783e32eae29733ea613869724ddeb024aad5
  versions:image-gateway-zerotier: ghcr.io/aetf/homelab-containers/zerotier:3@sha256:e4d8cb40f8a5e787b7d4ad6ddc60d6a0289d2eb988b3575e6a54273a354c39d7

  versions:image-splitpro-database: ghcr.io/aetf/pgcron-cnpg:17.10-standard-trixie-8850f6aa8e37@sha256:e8ed81d29bf838af718028acfc0b694eda412f18e23367c47a7658d9d1eb2b39

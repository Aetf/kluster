  # The images the applications' components run, `apps` and the shapes it
  # builds them from (rfc-008 §4 and §5): one pin per container a component
  # declares, keyed by the component and the container's role in it rather
  # than by the software, so that a component changing what it runs keeps its
  # key. Each digest is the image index's where the publisher has one, since a
  # component on the cloud pool runs on arm64 and one on the worker on amd64;
  # the pins below that a component runs on the worker alone may name one
  # architecture.
  #
  # Renovate reads each the way it reads every image pin here. A tagging scheme
  # its default reading would never move -- a release line that moves by
  # patches alone, a tag carrying a packaging revision beside the upstream
  # version, or one ending in a fingerprint -- has a rule in `renovate.json5`
  # naming the dependency.
  #
  # The images built in `docker/` are published under their conf's `TAG` and a
  # fingerprint of what each was built from (framework/ci.md §4), and a
  # published tag never changes: a new build of the pinned version is a new
  # tag, which compares equal under the image's versioning, so the pin is moved
  # to it by hand.


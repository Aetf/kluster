  # The charts `k8s-base` installs (declarative/cluster-infra.md §1), one
  # object per chart, written under `value:` -- the one form Pulumi's project
  # schema accepts for an object. The key's `<name>` is the chart's name in its
  # repository. Beside where the chart is served and its version, a pin carries
  # what `update_crds` needs to render it: whether it renders definitions into
  # the CRD bundle (`packages/crds`), the `render-values` that make it render
  # them, and a `floor` its operator version has to clear, with the section
  # that states it. The script checks a floor against the `appVersion` the
  # chart itself declares, so no operator version is kept by hand here.
  #
  # Renovate reads `repository` and moves `version` and `digest`, which are
  # the first three fields after `value:`, in that order. It cannot finish a
  # bump of a pin `update_crds` reads: `packages/crds` records the pins the
  # bundle was rendered from, and a test holds that record to this block, so
  # such a bump is red until `update_crds` has run on its branch
  # (framework/pulumi.md §4).
  #
  # A chart carries the digest of its manifest wherever its publisher's OCI
  # registry has the pinned version. Helm pulls the chart by that digest and
  # refuses one the version's tag no longer resolves to, so the pin holds the
  # bytes it was proposed at. Cilium's bump travels alone in renovate, the
  # way Talos's does (operations.md §2.2).
  versions:chart-cilium:
    value:
      repository: oci://quay.io/cilium/charts
      version: 1.20.4
      digest: sha256:712e1f65bf30533d117d1996ac3ace3efdb2521302d31ee887b1e45806bd6b64
      # The chart installs no definitions: the agent registers its own at
      # runtime, and `update_crds` reads them from the source tree at this
      # version's tag instead.
      definitions: false
      # ExternalAuth fails closed from 1.20.2 (cilium/cilium#47929): below it,
      # a route whose filter names a backend Cilium cannot use is served with
      # the filter dropped, unauthenticated.
      floor:
        operator: '1.20.2'
        document: 'cluster-infra.md §2: the ExternalAuth route filter (GEP-1494), which fails closed from 1.20.2'
  versions:chart-cert-manager:
    value:
      repository: oci://quay.io/jetstack/charts
      version: v1.21.1
      digest: sha256:15c0b46d9006ce8eb9ff14d1bf54d1bbfcc587bb9e24cd9fe186fb8fec56af1f
      definitions: true
      # The definitions are templates behind this switch rather than the
      # chart's `crds/` directory, so the render has to ask for them.
      render-values:
        crds.enabled: 'true'
  versions:chart-cloudnative-pg:
    value:
      repository: oci://ghcr.io/cloudnative-pg/charts
      version: 0.29.0
      digest: sha256:209c588b902982bf283a0073db83edd422d9710a2c8a670fe57c0329abe789a4
      definitions: true
      floor:

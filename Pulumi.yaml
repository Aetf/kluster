name: kluster-py
runtime:
  name: python
  options:
    toolchain: uv
    virtualenv: .venv
description: Kluster configurations

# Project-level configuration: values that apply to every stack, which a
# stack's own file overrides only where it deliberately runs something
# different from the rest (docs/framework/pulumi.md §3.2).
#
# The `versions:` namespace is what this is for. Every pin a stack program
# reads lives here, one kind per key prefix, so that five stack programs read
# one copy instead of five files drifting apart -- Pulumi has no include
# between stack configurations, and this is the mechanism that does not need
# one. `pulumi config set` cannot write project-level values, so these are
# hand-edited YAML, which is what a renovate-maintained pin wants anyway; a
# key in someone else's namespace may carry a value and neither a type nor a
# default. `lib/versions.py` is what reads them, for a stack program from its
# configuration and for a script from this file, so a pin a script also reads
# lives here too; no stack file overrides one of those, since the script
# reads only this file, and a test holds that.
config:
  # The whole fleet's Talos release: machine configurations, the cloud image
  # imported from the factory, and the worker's `nocloud` disk image.
  versions:talos: v1.13.9

  # The gateway's container root filesystems, one pin per service and not one
  # per build -- the two resolvers run the same image, and separate keys are
  # what let one of them be proven before the other. Each is a whole reference,
  # `<repository>:<tag>@sha256:<digest>`: the digest is the identity, the tag is
  # where those bytes were found, and one renovate data source reads all three
  # off the line and moves the tag and the digest together.
  #
  # Which repository publishes a given build is still this repository's
  # decision, held as `conventions.gateway.image_repository` -- the stack checks
  # each pin against it and refuses a mismatch by key, so the two resolvers
  # cannot drift onto two different images.
  versions:image-gateway-caddy: ghcr.io/aetf/homelab-containers/caddy:3@sha256:8258d234b66696ef52b34e9cb5b73ca6af4dfcc0fc91c25e894374753e50780c
  versions:image-gateway-adguard-alice: ghcr.io/aetf/homelab-containers/adguard:3@sha256:45a2895bea93f2d7ed02a1ea4a36783e32eae29733ea613869724ddeb024aad5
  versions:image-gateway-adguard-bob: ghcr.io/aetf/homelab-containers/adguard:3@sha256:45a2895bea93f2d7ed02a1ea4a36783e32eae29733ea613869724ddeb024aad5
  versions:image-gateway-zerotier: ghcr.io/aetf/homelab-containers/zerotier:3@sha256:e4d8cb40f8a5e787b7d4ad6ddc60d6a0289d2eb988b3575e6a54273a354c39d7

  # local-path-provisioner, which `k8s-base` declares as resources rather than
  # installing from a chart (declarative/cluster-infra.md §1): the provisioner,
  # and the helper pod it starts on a node to create and remove a volume's
  # directory. Each digest is the image index's, since the cluster's nodes run
  # two architectures.
  versions:image-local-path-provisioner: docker.io/rancher/local-path-provisioner:v0.0.37@sha256:e757967a5ec338f6a9b371c5a9688bedaa8c3578ea3dd4db329ea0084be0a86f
  versions:image-local-path-helper: docker.io/library/busybox:1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e

  # The charts `k8s-base` installs (declarative/cluster-infra.md §1), one
  # object per chart, written under `value:` -- the one form Pulumi's project
  # schema accepts for an object. The key's `<name>` is the chart's name in its
  # repository. Beside where the chart is served and its version, a pin carries
  # what `update_crds` needs to render it: whether it renders definitions into
  # the CRD bundle (`packages/crds`), the `render-values` that make it render
  # them, and a `floor` its operator version has to clear, with the section
  # that states it. The script checks a floor against the `appVersion` the
  # chart itself declares, so no operator version is kept by hand here.
  #
  # Renovate reads `repository` and moves `version` and `digest`, which are
  # the first three fields after `value:`, in that order. It cannot finish a
  # bump of a pin `update_crds` reads: `packages/crds` records the pins the
  # bundle was rendered from, and a test holds that record to this block, so
  # such a bump is red until `update_crds` has run on its branch
  # (framework/pulumi.md §4).
  #
  # A chart carries the digest of its manifest wherever its publisher's OCI
  # registry has the pinned version. Helm pulls the chart by that digest and
  # refuses one the version's tag no longer resolves to, so the pin holds the
  # bytes it was proposed at. Cilium's bump travels alone in renovate, the
  # way Talos's does (operations.md §2.2).
  versions:chart-cilium:
    value:
      repository: oci://quay.io/cilium/charts
      version: 1.20.1
      digest: sha256:906ce40d35daad838d12add8a5ba7033e767767f51799a93c7eace2cec9cdc05
      # The chart installs no definitions: the agent registers its own at
      # runtime, and `update_crds` reads them from the source tree at this
      # version's tag instead.
      definitions: false
      floor:
        operator: '1.20'
        document: 'cluster-infra.md §2: the ExternalAuth route filter (GEP-1494)'
  versions:chart-cert-manager:
    value:
      repository: oci://quay.io/jetstack/charts
      version: v1.21.1
      digest: sha256:15c0b46d9006ce8eb9ff14d1bf54d1bbfcc587bb9e24cd9fe186fb8fec56af1f
      definitions: true
      # The definitions are templates behind this switch rather than the
      # chart's `crds/` directory, so the render has to ask for them.
      render-values:
        crds.enabled: 'true'
  versions:chart-cloudnative-pg:
    value:
      repository: oci://ghcr.io/cloudnative-pg/charts
      version: 0.29.0
      digest: sha256:209c588b902982bf283a0073db83edd422d9710a2c8a670fe57c0329abe789a4
      definitions: true
      floor:
        operator: '1.26'
        document: 'cluster-infra.md §1 item 5: declarative offline in-place major upgrades (workloads.md §4)'
  versions:chart-plugin-barman-cloud:
    value:
      repository: oci://ghcr.io/cloudnative-pg/charts
      version: 0.8.1
      digest: sha256:b48511269e2c75603ee2f06f6c5444e8154542103a3c3b9d692344725bac37b7
      definitions: true
  versions:chart-victoria-metrics-k8s-stack:
    value:
      repository: oci://ghcr.io/victoriametrics/helm-charts
      version: 0.95.0
      digest: sha256:c18a44589ebb3f8be9e1497a09392e2c6091d31d28a9a1cd2f9e9b1158f0ce5c
      definitions: true
  versions:chart-node-feature-discovery:
    value:
      repository: oci://registry.k8s.io/nfd/charts
      version: 0.19.0
      digest: sha256:c74eeb7fe33c060e49e42cc8d588eeeddfbda6ae9bcd0835e0e398e02c5c2223
      definitions: true
  versions:chart-reloader:
    value:
      repository: oci://ghcr.io/stakater/charts
      version: 2.2.16
      digest: sha256:af2e01b729b9460048ed9482bf6c391154270903072f0e7b1e01db9aba9ea7a5
      definitions: false

  versions:chart-sealed-secrets:
    value:
      repository: oci://registry-1.docker.io/bitnamicharts
      version: 2.20.0
      digest: sha256:9e60fff9c99e22028d5b2cdc223bc669709cdd7447b9aef76714146a40932eec
      definitions: true
  versions:chart-intel-device-plugins-operator:
    value:
      repository: oci://ghcr.io/intel/helm-charts
      version: 0.37.0
      digest: sha256:b5faf0d99d9885ccb69d32a60ad00a537353382b789be63ecdacda2476a8450e
      definitions: true
  versions:chart-intel-device-plugins-gpu:
    value:
      repository: oci://ghcr.io/intel/helm-charts
      version: 0.37.0
      digest: sha256:209a77a29de72667f7e6dfe0b896d6663c2d2c721734527f6c00dc3f4cb79b4f
      # The `GpuDevicePlugin` object it creates is defined by the operator
      # chart above; this one is a plain workload.
      definitions: false

  # The two charts below come from HTTP chart repositories, and carry no
  # digest because there is none to check: Helm downloads an archive from such
  # a repository and checks nothing about it but an optional provenance
  # signature against its publisher's key, so the version is all a pin can
  # hold. A chart carries a digest wherever its publisher's registry has the
  # pinned version, and neither of these is published to one: volsync's
  # release workflows push no chart, and metrics-server's chart workflow runs
  # chart-releaser alone, which publishes to the HTTP repository.
  versions:chart-volsync:
    value:
      repository: https://backube.github.io/helm-charts/
      version: 0.16.0
      definitions: true
  versions:chart-metrics-server:
    value:
      repository: https://kubernetes-sigs.github.io/metrics-server/
      version: 3.14.0
      # `metrics.k8s.io` is an aggregated APIService, not a definition.
      definitions: false

  # The Gateway API definitions, which are no chart (cluster-infra.md §1
  # item 1): a release asset, applied by the program and rendered by
  # `update_crds`, both through `kluster.lib.release_assets.fetch_manifest`,
  # which refuses an asset whose sha256 is not this one. The experimental
  # channel is the one carrying the ExternalAuth route filter (GEP-1494) every
  # app that does not speak OIDC is gated by (cluster-infra.md §2). Renovate
  # moves `release` and `sha256` together, hashing the same asset of the next
  # release.
  versions:manifest-gateway-api:
    value:
      repository: kubernetes-sigs/gateway-api
      release: v1.6.1
      asset: experimental-install.yaml
      sha256: d7fa77650e4ef28fca0411536fcb5e237deb4d50301cfded3be49d9a1b7bbd02

# The generated SDKs under `sdks/`, one entry per SDK. None of them is a
# published Pulumi SDK, and this block is their recipe -- `pulumi install`
# regenerates every `sdks/<name>` from it, and the result is committed (every
# CI job would otherwise fetch the generators' plugins before it could
# `uv sync`). Each SDK's own `pulumi_<name>/pulumi-plugin.json` records what it
# was generated from, and a test holds it to this block, so a bump here is not
# finished until the SDK has been regenerated: renovate proposes the bump, and
# a workflow regenerates on its branch (framework/ci.md §3). No stack program
# reads this block -- it is the generator's input, and the engine resolves the
# plugin at run time from the SDK's `pulumi-plugin.json`.
#
# Three entries are providers Pulumi's any-Terraform-provider bridge generates:
# the bridge release (`version`) and the upstream provider it is parameterized
# with (`parameters`: the registry coordinates, then the provider's version).
# The bridge version is shared by all three: it moves under one renovate
# dependency (`pulumi/pulumi-terraform-provider`), so it moves for all three at
# once. Each upstream provider is a dependency of its own, spelled in lower
# case as the registry API takes it: renovate looks the coordinates up
# verbatim and the lookup is case-sensitive, while the bridge canonicalizes
# either spelling to the same SDK.
#
# One entry, `crds`, is the kubernetes provider's CRD extension: the provider
# release (`version`) and the CRD manifest it generates the custom resources'
# classes from (`crd-manifest`, relative to this file). The manifest is the
# bundle `update_crds` renders from the `versions:` pins above, and a run of it
# ends by running `pulumi install`; the release is the `pulumi-kubernetes`
# version `pyproject.toml` pins exactly, held equal to it by a test and moved
# with it by one renovate dependency (framework/pulumi.md §4).
#
# These pins name releases, not bytes, and no field here can hold a hash of
# what they download. Pulumi reads a `checksums` map on an entry (`PackageSpec`
# in its `sdk/go/common/workspace/project.go`), keyed by `<os>-<arch>`, but
# declares the values as bytes, which its YAML decoder takes from no scalar,
# while the project schema refuses anything but a string: at the pinned CLI an
# entry carrying one fails to load, `package must be either a string or a
# package specification object`. Nor would the map reach a run. A preview or
# an update fetches the plugin the SDK's `pulumi-plugin.json` names, and that
# file has no field for a hash; the bridge then fetches the upstream provider
# from the registry, and its loader installs it with no recorded hash to hold
# it to.
#
# `pulumi plugin install --checksum` is the one route that holds a plugin to a
# recorded sum: a plugin installed that way, ahead of the engine, is found
# installed rather than downloaded. Nothing here installs plugins so yet
# (Aetf/kluster-ops#489), and the same gap holds for the plugins the program's
# provider SDKs name: `uv.lock` holds each SDK's hashes, not those of the
# plugin binary the engine downloads for it.
packages:
  b2:
    source: terraform-provider
    version: 1.4.0
    parameters:
      - backblaze/b2
      - 0.14.0
  unifi:
    source: terraform-provider
    version: 1.4.0
    parameters:
      - filipowm/unifi
      - 1.1.0
  zerotier:
    source: terraform-provider
    version: 1.4.0
    parameters:
      - zerotier/zerotier
      - 1.6.0
  crds:
    source: kubernetes
    version: 4.34.2
    extensions:
      - name=crds
      - crd-manifest=packages/crds/crds.yaml

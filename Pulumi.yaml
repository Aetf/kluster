  # The two charts below come from HTTP chart repositories, and carry no
  # digest because there is none to check: Helm downloads an archive from such
  # a repository and checks nothing about it but an optional provenance
  # signature against its publisher's key, so the version is all a pin can
  # hold. A chart carries a digest wherever its publisher's registry has the
  # pinned version, and neither of these is published to one: volsync's
  # release workflows push no chart, and metrics-server's chart workflow runs
  # chart-releaser alone, which publishes to the HTTP repository.
  versions:chart-volsync:
    value:
      repository: https://backube.github.io/helm-charts/
      version: 0.17.0
      definitions: true
  versions:chart-metrics-server:
    value:
      repository: https://kubernetes-sigs.github.io/metrics-server/
      version: 3.14.0
      # `metrics.k8s.io` is an aggregated APIService, not a definition.
      definitions: false

  # The Gateway API definitions, which are no chart (cluster-infra.md §1
  # item 1): a release asset, applied by the program and rendered by
  # `update_crds`, both through `kluster.lib.release_assets.fetch_manifest`,
  # which refuses an asset whose sha256 is not this one. The experimental
  # channel is the one carrying the ExternalAuth route filter (GEP-1494) every
  # app that does not speak OIDC is gated by (cluster-infra.md §2). Renovate
  # moves `release` and `sha256` together, hashing the same asset of the next
  # release.
  versions:manifest-gateway-api:
    value:
      repository: kubernetes-sigs/gateway-api
      release: v1.7.0
      asset: experimental-install.yaml
      sha256: e6d2d3407717f54b579b22ad4d164b6863895b3524f21250b0da0c1ff9a05d53

# The generated SDKs under `sdks/`, one entry per SDK. None of them is a
# published Pulumi SDK, and this block is their recipe -- `pulumi install`
# regenerates every `sdks/<name>` from it, and the result is committed (every
# CI job would otherwise fetch the generators' plugins before it could
# `uv sync`). Each SDK's own `pulumi_<name>/pulumi-plugin.json` records what it
# was generated from, and a test holds it to this block, so a bump here is not
# finished until the SDK has been regenerated: renovate proposes the bump, and
# a workflow regenerates on its branch (framework/ci.md §3). No stack program
# reads this block -- it is the generator's input, and the engine resolves the
# plugin at run time from the SDK's `pulumi-plugin.json`.
#
# Three entries are providers Pulumi's any-Terraform-provider bridge generates:
# the bridge release (`version`) and the upstream provider it is parameterized
# with (`parameters`: the registry coordinates, then the provider's version).
# The bridge version is shared by all three: it moves under one renovate
# dependency (`pulumi/pulumi-terraform-provider`), so it moves for all three at
# once. Each upstream provider is a dependency of its own, spelled in lower
# case as the registry API takes it: renovate looks the coordinates up
# verbatim and the lookup is case-sensitive, while the bridge canonicalizes
# either spelling to the same SDK.
#
# One entry, `crds`, is the kubernetes provider's CRD extension: the provider
# release (`version`) and the CRD manifest it generates the custom resources'
# classes from (`crd-manifest`, relative to this file). The manifest is the
# bundle `update_crds` renders from the `versions:` pins above, and a run of it
# ends by running `pulumi install`; the release is the `pulumi-kubernetes`
# version `pyproject.toml` pins exactly, held equal to it by a test and moved
# with it by one renovate dependency (framework/pulumi.md §4).
#
# These pins name releases, not bytes, and no field here can hold a hash of
# what they download. Pulumi reads a `checksums` map on an entry (`PackageSpec`
# in its `sdk/go/common/workspace/project.go`), keyed by `<os>-<arch>`, but
# declares the values as bytes, which its YAML decoder takes from no scalar,
# while the project schema refuses anything but a string: at the pinned CLI an
# entry carrying one fails to load, `package must be either a string or a
# package specification object`. Nor would the map reach a run. A preview or
# an update fetches the plugin the SDK's `pulumi-plugin.json` names, and that
# file has no field for a hash; the bridge then fetches the upstream provider
# from the registry, and its loader installs it with no recorded hash to hold
# it to.
#
# `pulumi plugin install --checksum` is the one route that holds a plugin to a
# recorded sum: a plugin installed that way, ahead of the engine, is found
# installed rather than downloaded. Nothing here installs plugins so yet
# (Aetf/kluster-ops#489), and the same gap holds for the plugins the program's
# provider SDKs name: `uv.lock` holds each SDK's hashes, not those of the
# plugin binary the engine downloads for it.
packages:
  b2:
    source: terraform-provider
    version: 1.5.0
    parameters:
      - backblaze/b2
      - 0.14.0
  unifi:
    source: terraform-provider
    version: 1.5.0
    parameters:
      - filipowm/unifi
      - 1.1.0
  zerotier:
    source: terraform-provider
    version: 1.5.0
    parameters:
      - zerotier/zerotier
      - 1.6.0
  crds:
    source: kubernetes
    version: 4.34.2
    extensions:
      - name=crds
      - crd-manifest=packages/crds/crds.yaml

# This stack's configuration is encrypted under a passphrase of its own rather
# than the estate's (docs/credentials.md §1 rule 6). The `encryptionsalt` below
# is a verifier for that passphrase: `mise.toml` exports it as
# `KLUSTER_GITHUB_PASSPHRASE`, a hand-run `pulumi` passes it in as
# `PULUMI_CONFIG_PASSPHRASE` (docs/framework/github.md §1), and under any other
# value `pulumi` refuses with `incorrect passphrase` and writes nothing. The
# salt is never deleted by hand: a stack file without one is keyed to whatever
# passphrase the next `pulumi` command finds in its environment (§4.2). The one
# secret here, the forge's admin token, is written by
# `credentials derived github-admin record`.
config:
  pulumi:disable-default-providers:
    - github
  kluster-py:githubAdminToken:
    secure: v1:9rFmlp3YpF+6eHDm:Z/jed6UVRxQoeXpIwQ5AhQfMYHQSEh5c0ulTEy3FVsvuspN4375cRK5Lrt4/uXNoj0eD27A+rOvXICtR0mkaDluzuZ8T2tlIc4vnHCIU3UXMdSgC7Uoxp06e0Wd+QCbGQVoV0yHz2nn3WRyCqg==
encryptionsalt: v1:mOPkKdjz2Tc=:v1:bHmL+0jM9l7zTfSo:GjLSir4iTty8cpMEm0RUDWPAsQSqNA==

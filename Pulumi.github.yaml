# This stack is an operator stack, one no CI job runs, and its configuration is
# encrypted under the operator passphrase rather than the stack passphrase
# every CI Environment but `physical`'s holds, or `physical`'s own, which those
# two hold (docs/credentials.md §1 rule 6). The
# `encryptionsalt` below is a verifier for that passphrase: the
# `operator-stack` driver hands it to `pulumi` (docs/framework/pulumi.md §3.3),
# and under any other value `pulumi` refuses with `incorrect passphrase` and
# writes nothing. The salt is never deleted by hand: a stack file without one
# is keyed to whatever passphrase the next `pulumi` command finds in its
# environment (docs/credentials.md §4.2). The one secret here, the forge's
# admin token, is written by `credentials derived github-admin record`.
config:
  pulumi:disable-default-providers:
    - github
  kluster-py:githubAdminToken:
    secure: v1:9rFmlp3YpF+6eHDm:Z/jed6UVRxQoeXpIwQ5AhQfMYHQSEh5c0ulTEy3FVsvuspN4375cRK5Lrt4/uXNoj0eD27A+rOvXICtR0mkaDluzuZ8T2tlIc4vnHCIU3UXMdSgC7Uoxp06e0Wd+QCbGQVoV0yHz2nn3WRyCqg==
encryptionsalt: v1:mOPkKdjz2Tc=:v1:bHmL+0jM9l7zTfSo:GjLSir4iTty8cpMEm0RUDWPAsQSqNA==

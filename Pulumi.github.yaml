# No `encryptionsalt`. This stack's configuration is encrypted under a
# passphrase of its own rather than the estate's (docs/credentials.md §1 rule
# 6), and the salt is a verifier *for a particular passphrase* -- so the one
# this file used to carry named the wrong key. Removing it is safe here and
# nowhere else: this file holds no ciphertext, so there is nothing the change
# of key can strand. `credentials derived github-admin record` writes the
# first secret and, with no salt to check against, the fresh one it derives
# from the passphrase in hand (§4.2).
config:
  pulumi:disable-default-providers:
    - github
  kluster-py:githubAdminToken:
    secure: v1:9rFmlp3YpF+6eHDm:Z/jed6UVRxQoeXpIwQ5AhQfMYHQSEh5c0ulTEy3FVsvuspN4375cRK5Lrt4/uXNoj0eD27A+rOvXICtR0mkaDluzuZ8T2tlIc4vnHCIU3UXMdSgC7Uoxp06e0Wd+QCbGQVoV0yHz2nn3WRyCqg==
encryptionsalt: v1:mOPkKdjz2Tc=:v1:bHmL+0jM9l7zTfSo:GjLSir4iTty8cpMEm0RUDWPAsQSqNA==

name: Image conf
description: >
  Derive an image's ghcr reference and build-arg file from its docker/*.conf,
  so the build and the manifest jobs read the tag from one place.

inputs:
  image:
    description: The docker/<image>.conf basename.
    required: true

outputs:
  ref:
    description: The ghcr reference to build and publish, tag included.
    value: ${{ steps.conf.outputs.ref }}
  args-file:
    description: The conf reduced to build args, for `buildah --build-arg-file`.
    value: ${{ steps.conf.outputs.args-file }}

runs:
  using: composite
  steps:
    - id: conf
      shell: bash
      run: |
        set -euo pipefail
        conf="docker/${{ inputs.image }}.conf"

        # The conf is *sourced*, not parsed, because TAG is written as an
        # expression over the other keys — `TAG="${PG_MAJOR}.${PG_MINOR}-${PG_REV}"`
        # for the CNPG operands, a bare version for the rest. That keeps a
        # version bump a one-line edit renovate can make, with the tag
        # following from it.
        set -a; . "$conf"; set +a

        # ghcr paths are lowercase and the owner login is not.
        echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE}:${TAG}" >> "$GITHUB_OUTPUT"

        # IMAGE and TAG address the registry, everything else addresses the
        # Containerfile; the two names are reserved for that reason.
        #
        # The arg file is written from the *sourced* values, not by filtering
        # the conf's lines: the confs carry renovate hints and prose comments
        # that buildah must not be handed, and a value written in terms of
        # another key -- or in quotes -- has to arrive resolved rather than
        # verbatim.
        args="$RUNNER_TEMP/${{ inputs.image }}.build-args"
        : > "$args"
        keys=$(sed -nE 's/^[[:space:]]*([A-Za-z_][A-Za-z0-9_]*)=.*/\1/p' "$conf" \
          | grep -vxE 'IMAGE|TAG' | sort -u || true)
        for key in $keys; do
          printf '%s=%s\n' "$key" "${!key}" >> "$args"
        done
        echo "args-file=$args" >> "$GITHUB_OUTPUT"

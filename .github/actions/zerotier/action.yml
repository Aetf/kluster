name: Join ZeroTier
description: >
  Join this installation's ZeroTier network as a pre-authorized CI member,
  using an identity generated in Pulumi state rather than a Central API
  token — a leaked join credential is then one confined member, not the
  ability to enroll more (physical/gateway.md §2.6).

inputs:
  network_id:
    description: The ZeroTier network to join
    required: true
  identity:
    description: The member's identity.secret
    required: true
  wait_for:
    description: host:port to wait for before returning, if any
    required: false
    default: ''

runs:
  using: composite
  steps:
    # The join's clock starts before the install, so the wait below can hold
    # the whole action to one deadline however long the install took.
    - name: Start the join's clock
      id: clock
      shell: bash
      run: echo "started=$(date +%s)" >>"$GITHUB_OUTPUT"

    # ZeroTier from its own apt repository, pinned twice over: the package at
    # a release written here, and the repository's signing key trusted only
    # when it is the key with the fingerprint written here. The key is
    # fetched from the same host as the packages, so the fingerprint is what
    # a change on that host cannot move; apt then refuses any index that key
    # did not sign. Neither the release nor the key changes without a pull
    # request (framework/ci.md §3).
    #
    # A custom manager in `renovate.json5` reads the release off ZeroTier's
    # apt repository, for the suite named here, and a test holds the two
    # suites equal.
    - name: Install ZeroTier
      shell: bash
      env:
        ZEROTIER_VERSION: '1.16.2'
        ZEROTIER_SUITE: resolute
        ZEROTIER_KEY_FINGERPRINT: 74A5E9C458E1A431F1DA57A71657198823E52A61
      run: |
        set -euo pipefail
        GNUPGHOME="$(mktemp -d)"
        export GNUPGHOME
        curl -fsSL https://download.zerotier.com/contact%40zerotier.com.gpg -o "$GNUPGHOME/published"
        gpg --batch --quiet --import "$GNUPGHOME/published"
        # Only the pinned key leaves the scratch keyring, and what left it is
        # read back, so a file holding another key, or none, fails here.
        gpg --batch --export "$ZEROTIER_KEY_FINGERPRINT" >"$GNUPGHOME/zerotier.gpg"
        found="$(gpg --batch --show-keys --with-colons "$GNUPGHOME/zerotier.gpg" 2>/dev/null \
          | awk -F: '$1 == "pub" { primary = 1; next } $1 == "fpr" && primary { print $10; primary = 0 }')" || true
        if [ "$found" != "$ZEROTIER_KEY_FINGERPRINT" ]; then
          echo "::error::ZeroTier's published signing key is not ${ZEROTIER_KEY_FINGERPRINT} (found: ${found:-none})"
          exit 1
        fi
        sudo install -m 0644 "$GNUPGHOME/zerotier.gpg" /usr/share/keyrings/zerotier.gpg
        echo "deb [signed-by=/usr/share/keyrings/zerotier.gpg] https://download.zerotier.com/debian/${ZEROTIER_SUITE} ${ZEROTIER_SUITE} main" \
          | sudo tee /etc/apt/sources.list.d/zerotier.list >/dev/null
        sudo apt-get update \
          -o Dir::Etc::sourcelist=sources.list.d/zerotier.list \
          -o Dir::Etc::sourceparts=- \
          -o APT::Get::List-Cleanup=0
        sudo apt-get install -y --no-install-recommends "zerotier-one=${ZEROTIER_VERSION}"

    - name: Install the member identity
      shell: bash
      env:
        IDENTITY: ${{ inputs.identity }}
      run: |
        set -euo pipefail
        sudo systemctl stop zerotier-one
        printf '%s' "$IDENTITY" | sudo tee /var/lib/zerotier-one/identity.secret >/dev/null
        sudo chmod 600 /var/lib/zerotier-one/identity.secret
        sudo zerotier-idtool getpublic /var/lib/zerotier-one/identity.secret \
          | sudo tee /var/lib/zerotier-one/identity.public >/dev/null
        sudo systemctl start zerotier-one
        sudo zerotier-cli join ${{ inputs.network_id }}

    # The flow rules drop a run's first packets until the peer's certificate
    # of ownership has arrived (`chr ipauth`, physical/gateway.md §2.3), and a
    # fresh runner needs a moment to find a path, so readiness is asserted
    # against the actual dependency rather than assumed.
    #
    # The wait runs against a wall-clock deadline, JOIN_DEADLINE seconds after
    # the join's clock started, so the install and the wait share one budget
    # and a slow install shortens the wait rather than outlasting the step.
    # The deadline is derived from the tightest cap a caller puts on this
    # action -- the smaller of the step's `timeout-minutes` and the job's --
    # and sits a minute inside it, so that what runs once it has
    # passed (one last connect attempt of at most a second, and the listings
    # below, each under its own `timeout`) ends in this step's own error
    # before the cap ends the step without one. `test_zerotier_action` holds
    # every caller's cap that far above the deadline.
    - name: Wait for the target
      if: inputs.wait_for != ''
      shell: bash
      env:
        TARGET: ${{ inputs.wait_for }}
        STARTED: ${{ steps.clock.outputs.started }}
        JOIN_DEADLINE: '240'
      run: |
        set -euo pipefail
        # A clock step that was skipped, or wrote its output under another
        # name, leaves STARTED empty, which the arithmetic would read as the
        # epoch: the wait would fail at once and blame the target.
        if [ -z "$STARTED" ]; then
          echo "::error::the join's clock set no start time, so the wait has no deadline"
          exit 1
        fi
        deadline=$((STARTED + JOIN_DEADLINE))
        waiting=$(date +%s)
        attempts=0
        while :; do
          attempts=$((attempts + 1))
          left=$((deadline - $(date +%s)))
          if timeout "$((left < 1 ? 1 : left < 3 ? left : 3))" \
            bash -c "cat < /dev/null > /dev/tcp/${TARGET/:/\/}" 2>/dev/null; then
            # Read by physical/gateway-cutover.md §8.3, which takes gateway.md
            # §2.4's items 4 and 7 off it by its leading `<host> reachable
            # after N attempts`.
            echo "${TARGET} reachable after ${attempts} attempts, $(($(date +%s) - waiting)) s"
            exit 0
          fi
          if [ $((attempts % 10)) -eq 0 ]; then timeout 5 sudo zerotier-cli peers || true; fi
          left=$((deadline - $(date +%s)))
          if [ "$left" -le 0 ]; then break; fi
          sleep "$((left < 3 ? left : 3))"
        done
        echo "::error::${TARGET} unreachable over ZeroTier after ${attempts} attempts, $(($(date +%s) - waiting)) s; the join's ${JOIN_DEADLINE} s deadline has passed"
        timeout 5 sudo zerotier-cli listnetworks || true
        exit 1

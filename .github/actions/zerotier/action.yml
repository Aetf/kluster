name: Join ZeroTier
description: >
  Join this installation's ZeroTier network as a pre-authorized CI member,
  using an identity generated in Pulumi state rather than a Central API
  token — a leaked join credential is then one confined member, not the
  ability to enroll more (physical/gateway.md §2.6).

inputs:
  network_id:
    description: The ZeroTier network to join
    required: true
  identity:
    description: The member's identity.secret
    required: true
  routes:
    description: >
      Routes the run needs and the network does not carry, one
      `<target> via <next hop>` per line, installed once the next hop is on
      the member's overlay link (framework/ci.md §2)
    required: false
    default: ''
  wait_for:
    description: >
      host:port targets, separated by spaces or newlines, to wait for before
      returning: the first one that answers ends the wait
    required: false
    default: ''

runs:
  using: composite
  steps:
    # The join's clock starts before the install, so the steps below that
    # wait can hold the whole action to one deadline however long the install
    # took.
    #
    # The deadline is JOIN_DEADLINE seconds after this step, derived from the
    # tightest cap a caller puts on this action -- the smaller of the step's
    # `timeout-minutes` and the job's -- and sits a minute inside it, so that
    # what runs once it has passed (one last attempt per target of at most a
    # second each, and the listings, each under its own `timeout`) ends in the
    # waiting step's own error before the cap ends the step without one.
    # `test_zerotier_action` holds every caller's cap that far above the
    # deadline.
    - name: Start the join's clock
      id: clock
      shell: bash
      env:
        JOIN_DEADLINE: '240'
      run: echo "deadline=$(($(date +%s) + JOIN_DEADLINE))" >>"$GITHUB_OUTPUT"

    # ZeroTier from its own apt repository, pinned twice over: the package at
    # a release written here, and the repository's signing key trusted only
    # when it is the key with the fingerprint written here. The key is
    # fetched from the same host as the packages, so the fingerprint is what
    # a change on that host cannot move; apt then refuses any index that key
    # did not sign. Neither the release nor the key changes without a pull
    # request (framework/ci.md §3).
    #
    # A custom manager in `renovate.json5` reads the release off ZeroTier's
    # apt repository, for the suite named here, and a test holds the two
    # suites equal.
    - name: Install ZeroTier
      shell: bash
      env:
        ZEROTIER_VERSION: '1.16.2'
        ZEROTIER_SUITE: resolute
        ZEROTIER_KEY_FINGERPRINT: 74A5E9C458E1A431F1DA57A71657198823E52A61
      run: |
        set -euo pipefail
        GNUPGHOME="$(mktemp -d)"
        export GNUPGHOME
        curl -fsSL https://download.zerotier.com/contact%40zerotier.com.gpg -o "$GNUPGHOME/published"
        gpg --batch --quiet --import "$GNUPGHOME/published"
        # Only the pinned key leaves the scratch keyring, and what left it is
        # read back, so a file holding another key, or none, fails here.
        gpg --batch --export "$ZEROTIER_KEY_FINGERPRINT" >"$GNUPGHOME/zerotier.gpg"
        found="$(gpg --batch --show-keys --with-colons "$GNUPGHOME/zerotier.gpg" 2>/dev/null \
          | awk -F: '$1 == "pub" { primary = 1; next } $1 == "fpr" && primary { print $10; primary = 0 }')" || true
        if [ "$found" != "$ZEROTIER_KEY_FINGERPRINT" ]; then
          echo "::error::ZeroTier's published signing key is not ${ZEROTIER_KEY_FINGERPRINT} (found: ${found:-none})"
          exit 1
        fi
        sudo install -m 0644 "$GNUPGHOME/zerotier.gpg" /usr/share/keyrings/zerotier.gpg
        echo "deb [signed-by=/usr/share/keyrings/zerotier.gpg] https://download.zerotier.com/debian/${ZEROTIER_SUITE} ${ZEROTIER_SUITE} main" \
          | sudo tee /etc/apt/sources.list.d/zerotier.list >/dev/null
        sudo apt-get update \
          -o Dir::Etc::sourcelist=sources.list.d/zerotier.list \
          -o Dir::Etc::sourceparts=- \
          -o APT::Get::List-Cleanup=0
        sudo apt-get install -y --no-install-recommends "zerotier-one=${ZEROTIER_VERSION}"

    - name: Install the member identity
      shell: bash
      env:
        IDENTITY: ${{ inputs.identity }}
      run: |
        set -euo pipefail
        sudo systemctl stop zerotier-one
        printf '%s' "$IDENTITY" | sudo tee /var/lib/zerotier-one/identity.secret >/dev/null
        sudo chmod 600 /var/lib/zerotier-one/identity.secret
        sudo zerotier-idtool getpublic /var/lib/zerotier-one/identity.secret \
          | sudo tee /var/lib/zerotier-one/identity.public >/dev/null
        sudo systemctl start zerotier-one
        sudo zerotier-cli join ${{ inputs.network_id }}

    # A route only this run needs is installed here rather than carried by
    # the network, which would hand it to every member (framework/ci.md §2).
    # The kernel takes a `via` only on a link it is directly connected to, so
    # each route waits for its next hop to be on one: the member's overlay
    # link, once the member holds its address. The flow rules, not the route,
    # are what confine where the run may go.
    - name: Install the run's routes
      if: inputs.routes != ''
      shell: bash
      env:
        ROUTES: ${{ inputs.routes }}
        DEADLINE: ${{ steps.clock.outputs.deadline }}
      run: |
        set -euo pipefail
        # A clock step that was skipped, or wrote its output under another
        # name, leaves DEADLINE empty, which the arithmetic would read as the
        # epoch: the wait would fail at once and blame the next hop.
        if [ -z "$DEADLINE" ]; then
          echo "::error::the join's clock set no deadline, so the routes have none to wait under"
          exit 1
        fi
        routes=()
        while IFS= read -r line; do
          read -r target word hop rest <<<"$line" || true
          [ -z "${target:-}" ] && continue
          if [ "$word" != via ] || [ -z "$hop" ] || [ -n "$rest" ]; then
            echo "::error::'${line}' is not a route of the form '<target> via <next hop>'"
            exit 1
          fi
          routes+=("$target $hop")
        done <<<"$ROUTES"
        for route in "${routes[@]}"; do
          read -r target hop <<<"$route"
          waiting=$(date +%s)
          echo "waiting for ${hop} to be on a link of this host, to route ${target} through it"
          # `ip route get` names a gateway of its own for an address that is
          # not on a connected link, none for one that is, and fails for one
          # it has no route to at all.
          until found="$(ip -4 route get "$hop" 2>/dev/null)" && [[ "$found" != *' via '* ]]; do
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "::error::${hop} is on no link of this host after $(($(date +%s) - waiting)) s, so ${target} cannot be routed through it; the join's deadline has passed"
              timeout 5 sudo zerotier-cli listnetworks || true
              exit 1
            fi
            sleep 1
          done
          sudo ip route replace "$target" via "$hop"
          echo "${target} via ${hop} installed"
        done

    # The flow rules drop a run's first packets until the peer's certificate
    # of ownership has arrived (`chr ipauth`, physical/gateway.md §2.3), and a
    # fresh runner needs a moment to find a path, so readiness is asserted
    # against the actual dependency rather than assumed. The first target to
    # answer ends the wait, so a caller that reaches several equivalent
    # services -- the two resolvers -- fails here only when none of them
    # does, and one that is down fails only what depends on it.
    - name: Wait for the target
      if: inputs.wait_for != ''
      shell: bash
      env:
        TARGETS: ${{ inputs.wait_for }}
        DEADLINE: ${{ steps.clock.outputs.deadline }}
      run: |
        set -euo pipefail
        # A clock step that was skipped, or wrote its output under another
        # name, leaves DEADLINE empty, which the arithmetic would read as the
        # epoch: the wait would fail at once and blame the target.
        if [ -z "$DEADLINE" ]; then
          echo "::error::the join's clock set no deadline, so the wait has none"
          exit 1
        fi
        # Every line, not the first: a caller may write the targets one
        # per line, as it writes `routes`.
        read -r -d '' -a targets <<<"$TARGETS" || true
        waiting=$(date +%s)
        attempts=0
        while :; do
          attempts=$((attempts + 1))
          for target in "${targets[@]}"; do
            left=$((DEADLINE - $(date +%s)))
            if timeout "$((left < 1 ? 1 : left < 3 ? left : 3))" \
              bash -c "cat < /dev/null > /dev/tcp/${target/:/\/}" 2>/dev/null; then
              # Read by physical/gateway-cutover.md §8.3, which takes gateway.md
              # §2.4's item 4 off its leading `<host> reachable after N
              # attempts` and item 7 off its trailing `S s`, the seconds from
              # `zerotier-cli join` returning to this connect.
              echo "${target} reachable after ${attempts} attempts, $(($(date +%s) - waiting)) s"
              exit 0
            fi
          done
          if [ $((attempts % 10)) -eq 0 ]; then timeout 5 sudo zerotier-cli peers || true; fi
          left=$((DEADLINE - $(date +%s)))
          if [ "$left" -le 0 ]; then break; fi
          sleep "$((left < 3 ? left : 3))"
        done
        echo "::error::${TARGETS} unreachable over ZeroTier after ${attempts} attempts, $(($(date +%s) - waiting)) s; the join's deadline has passed"
        timeout 5 sudo zerotier-cli listnetworks || true
        exit 1

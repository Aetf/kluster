name: Join ZeroTier
description: >
  Join this installation's ZeroTier network as a pre-authorized CI member,
  using an identity generated in Pulumi state rather than a Central API
  token — a leaked join credential is then one confined member, not the
  ability to enroll more (physical/gateway.md §2.6). Every run, passing or
  failing, ends in a `zt-reading:` line: the path to each member the run
  dials and to the roots, the overlay MTU the runner received, and whether
  full-size packets cross to each target in each direction
  (`kluster.scripts.zt_reading`; framework/ci.md §2). The reading keeps what
  it was taken from, and `ZT_READING_KEPT` names where for the rest of the
  job, so that a job's last step takes it again when a later step fails.

inputs:
  network_id:
    description: The ZeroTier network to join
    required: true
  identity:
    description: The member's identity.secret
    required: true
  routes:
    description: >
      Routes the run needs and the network does not carry, one
      `<target> via <next hop>` per line, installed once the next hop is on
      the member's overlay link (framework/ci.md §2)
    required: false
    default: ''
  wait_for:
    description: >
      host:port targets the run dials, separated by spaces or newlines, to
      wait for before returning: the wait ends once every one has answered
    required: false
    default: ''
  wait_for_any:
    description: >
      host:port targets that stand in for one another, separated by spaces or
      newlines, to wait for before returning: the first one that answers
      satisfies them all
    required: false
    default: ''

runs:
  using: composite
  steps:
    # The join's clock starts before the install, so the steps below that
    # wait can hold the whole action to one deadline however long the install
    # took.
    #
    # The deadline is JOIN_DEADLINE seconds after this step, derived from the
    # tightest cap a caller puts on this action -- the smaller of the step's
    # `timeout-minutes` and the job's -- and sits a minute inside it, so that
    # what runs once it has passed (one last attempt per target of at most a
    # second each, and the listings, each under its own `timeout`) ends in the
    # waiting step's own error before the cap ends the step without one. The
    # join's reading, the last step, runs after that error inside the same
    # minute, under a bound of its own that leaves the wait at least half of
    # it. `test_zerotier_action` holds every caller's cap that far above the
    # deadline, and the reading's bound inside the minute.
    - name: Start the join's clock
      id: clock
      shell: bash
      env:
        JOIN_DEADLINE: '240'
      run: echo "deadline=$(($(date +%s) + JOIN_DEADLINE))" >>"$GITHUB_OUTPUT"

    # ZeroTier from its own apt repository, pinned twice over: the package at
    # a release written here, and the repository's signing key trusted only
    # when it is the key with the fingerprint written here. The key is
    # fetched from the same host as the packages, so the fingerprint is what
    # a change on that host cannot move; apt then refuses any index that key
    # did not sign. Neither the release nor the key changes without a pull
    # request (framework/ci.md §3).
    #
    # A custom manager in `renovate.json5` reads the release off ZeroTier's
    # apt repository, for the suite named here, and a test holds the two
    # suites equal.
    - name: Install ZeroTier
      shell: bash
      env:
        ZEROTIER_VERSION: '1.16.2'
        ZEROTIER_SUITE: resolute
        ZEROTIER_KEY_FINGERPRINT: 74A5E9C458E1A431F1DA57A71657198823E52A61
      run: |
        set -euo pipefail
        GNUPGHOME="$(mktemp -d)"
        export GNUPGHOME
        curl -fsSL https://download.zerotier.com/contact%40zerotier.com.gpg -o "$GNUPGHOME/published"
        gpg --batch --quiet --import "$GNUPGHOME/published"
        # Only the pinned key leaves the scratch keyring, and what left it is
        # read back, so a file holding another key, or none, fails here.
        gpg --batch --export "$ZEROTIER_KEY_FINGERPRINT" >"$GNUPGHOME/zerotier.gpg"
        found="$(gpg --batch --show-keys --with-colons "$GNUPGHOME/zerotier.gpg" 2>/dev/null \
          | awk -F: '$1 == "pub" { primary = 1; next } $1 == "fpr" && primary { print $10; primary = 0 }')" || true
        if [ "$found" != "$ZEROTIER_KEY_FINGERPRINT" ]; then
          echo "::error::ZeroTier's published signing key is not ${ZEROTIER_KEY_FINGERPRINT} (found: ${found:-none})"
          exit 1
        fi
        sudo install -m 0644 "$GNUPGHOME/zerotier.gpg" /usr/share/keyrings/zerotier.gpg
        echo "deb [signed-by=/usr/share/keyrings/zerotier.gpg] https://download.zerotier.com/debian/${ZEROTIER_SUITE} ${ZEROTIER_SUITE} main" \
          | sudo tee /etc/apt/sources.list.d/zerotier.list >/dev/null
        sudo apt-get update \
          -o Dir::Etc::sourcelist=sources.list.d/zerotier.list \
          -o Dir::Etc::sourceparts=- \
          -o APT::Get::List-Cleanup=0
        sudo apt-get install -y --no-install-recommends "zerotier-one=${ZEROTIER_VERSION}"

    # `systemctl start` returns once the service's process has started,
    # which is before the service listens on its local control port, and a
    # `zerotier-cli` command that cannot reach that port fails at once: the
    # join prints `0 join connection failed` and exits 1. So the join waits
    # until `zerotier-cli info` answers, which it does only once the service
    # serves its control API.
    - name: Install the member identity
      shell: bash
      env:
        IDENTITY: ${{ inputs.identity }}
        NETWORK_ID: ${{ inputs.network_id }}
        DEADLINE: ${{ steps.clock.outputs.deadline }}
      run: |
        set -euo pipefail
        # A clock step that was skipped, or wrote its output under another
        # name, leaves DEADLINE empty, which the arithmetic would read as the
        # epoch: the wait would fail at once and blame the service.
        if [ -z "$DEADLINE" ]; then
          echo "::error::the join's clock set no deadline, so the wait for the ZeroTier service has none"
          exit 1
        fi
        sudo systemctl stop zerotier-one
        printf '%s' "$IDENTITY" | sudo tee /var/lib/zerotier-one/identity.secret >/dev/null
        sudo chmod 600 /var/lib/zerotier-one/identity.secret
        sudo zerotier-idtool getpublic /var/lib/zerotier-one/identity.secret \
          | sudo tee /var/lib/zerotier-one/identity.public >/dev/null
        sudo systemctl start zerotier-one
        waiting=$(date +%s)
        attempts=0
        echo "waiting for the ZeroTier service to answer on its local control port (zerotier-cli info) before it joins"
        while :; do
          attempts=$((attempts + 1))
          left=$((DEADLINE - $(date +%s)))
          if answer="$(timeout "$((left < 1 ? 1 : left < 3 ? left : 3))" sudo zerotier-cli info 2>&1)"; then
            break
          fi
          if [ "$(date +%s)" -ge "$DEADLINE" ]; then
            echo "::error::the ZeroTier service never answered on its local control port, after ${attempts} attempts, $(($(date +%s) - waiting)) s; the join's deadline has passed (zerotier-cli info last printed: ${answer:-nothing})"
            timeout 5 sudo systemctl status --no-pager zerotier-one || true
            exit 1
          fi
          sleep 1
        done
        echo "the ZeroTier service answered on its local control port after ${attempts} attempts, $(($(date +%s) - waiting)) s: ${answer}"
        if ! joined="$(sudo zerotier-cli join "$NETWORK_ID")"; then
          echo "::error::the ZeroTier service refused the join: ${joined:-no answer}"
          exit 1
        fi
        echo "$joined"

    # A route only this run needs is installed here rather than carried by
    # the network, which would hand it to every member (framework/ci.md §2).
    # The kernel takes a `via` only on a link it is directly connected to, so
    # each route waits for its next hop to be on one: the member's overlay
    # link, once the member holds its address. The flow rules, not the route,
    # are what confine where the run may go.
    - name: Install the run's routes
      if: inputs.routes != ''
      shell: bash
      env:
        ROUTES: ${{ inputs.routes }}
        DEADLINE: ${{ steps.clock.outputs.deadline }}
      run: |
        set -euo pipefail
        # A clock step that was skipped, or wrote its output under another
        # name, leaves DEADLINE empty, which the arithmetic would read as the
        # epoch: the wait would fail at once and blame the next hop.
        if [ -z "$DEADLINE" ]; then
          echo "::error::the join's clock set no deadline, so the routes have none to wait under"
          exit 1
        fi
        routes=()
        while IFS= read -r line; do
          read -r target word hop rest <<<"$line" || true
          [ -z "${target:-}" ] && continue
          if [ "$word" != via ] || [ -z "$hop" ] || [ -n "$rest" ]; then
            echo "::error::'${line}' is not a route of the form '<target> via <next hop>'"
            exit 1
          fi
          routes+=("$target $hop")
        done <<<"$ROUTES"
        for route in "${routes[@]}"; do
          read -r target hop <<<"$route"
          waiting=$(date +%s)
          echo "waiting for ${hop} to be on a link of this host, to route ${target} through it"
          # `ip route get` names a gateway of its own for an address that is
          # not on a connected link, none for one that is, and fails for one
          # it has no route to at all.
          until found="$(ip -4 route get "$hop" 2>/dev/null)" && [[ "$found" != *' via '* ]]; do
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "::error::${hop} is on no link of this host after $(($(date +%s) - waiting)) s, so ${target} cannot be routed through it; the join's deadline has passed"
              timeout 5 sudo zerotier-cli listnetworks || true
              exit 1
            fi
            sleep 1
          done
          sudo ip route replace "$target" via "$hop"
          echo "${target} via ${hop} installed"
        done

    # The flow rules drop a run's first packets until the peer's certificate
    # of ownership has arrived (`chr ipauth`, physical/gateway.md §2.3), and a
    # fresh runner needs a moment to find a path to each peer it dials, so
    # readiness is asserted against the actual dependencies rather than
    # assumed. Each `wait_for` target is a dependency of its own, and the wait
    # ends only once every one has answered: a run that dials two members
    # learns here, and not at its own first dial, that one of them has no path
    # yet. The `wait_for_any` targets are one dependency together, met by the
    # first of them to answer, so a caller that reaches several equivalent
    # services -- the two resolvers -- fails here only when none of them
    # does, and one that is down fails only what depends on it.
    - name: Wait for the target
      if: inputs.wait_for != '' || inputs.wait_for_any != ''
      shell: bash
      env:
        TARGETS: ${{ inputs.wait_for }}
        ANY_TARGETS: ${{ inputs.wait_for_any }}
        DEADLINE: ${{ steps.clock.outputs.deadline }}
        ZT_READING: ${{ github.action_path }}/../../../src/kluster/scripts/zt_reading.py
      run: |
        set -euo pipefail
        # A clock step that was skipped, or wrote its output under another
        # name, leaves DEADLINE empty, which the arithmetic would read as the
        # epoch: the wait would fail at once and blame the target.
        if [ -z "$DEADLINE" ]; then
          echo "::error::the join's clock set no deadline, so the wait has none"
          exit 1
        fi
        # Every line, not the first: a caller may write the targets one
        # per line, as it writes `routes`. Each entry of `pending` is one
        # dependency still unmet, as the targets any one of which meets it.
        read -r -d '' -a every <<<"$TARGETS" || true
        read -r -d '' -a any <<<"$ANY_TARGETS" || true
        pending=("${every[@]}")
        if [ "${#any[@]}" -gt 0 ]; then pending+=("${any[*]}"); fi
        waiting=$(date +%s)
        attempts=0
        while :; do
          attempts=$((attempts + 1))
          unmet=()
          for dependency in "${pending[@]}"; do
            read -r -a alternatives <<<"$dependency"
            met=''
            for target in "${alternatives[@]}"; do
              left=$((DEADLINE - $(date +%s)))
              if timeout "$((left < 1 ? 1 : left < 3 ? left : 3))" \
                bash -c "cat < /dev/null > /dev/tcp/${target/:/\/}" 2>/dev/null; then
                # Read by physical/gateway-cutover.md §8.3, which takes gateway.md
                # §2.4's item 4 off the gateway's leading `<host> reachable after
                # N attempts` and item 7 off its trailing `S s`, the seconds from
                # `zerotier-cli join` returning to this connect. N counts the
                # rounds this target was tried in.
                echo "${target} reachable after ${attempts} attempts, $(($(date +%s) - waiting)) s"
                met=1
                break
              fi
            done
            if [ -z "$met" ]; then unmet+=("$dependency"); fi
          done
          if [ "${#unmet[@]}" -eq 0 ]; then exit 0; fi
          pending=("${unmet[@]}")
          # The listing names each peer's physical path, which a public
          # repository's log must not carry: the reading's filter keeps the
          # path's kind, latency and address family and drops the address and
          # port, and a filter that fails prints nothing.
          if [ $((attempts % 10)) -eq 0 ]; then
            timeout 5 sudo zerotier-cli peers | python3 -I -S "$ZT_READING" redact || true
          fi
          left=$((DEADLINE - $(date +%s)))
          if [ "$left" -le 0 ]; then break; fi
          sleep "$((left < 3 ? left : 3))"
        done
        echo "::error::${pending[*]} unreachable over ZeroTier after ${attempts} attempts, $(($(date +%s) - waiting)) s; the join's deadline has passed"
        timeout 5 sudo zerotier-cli listnetworks || true
        exit 1

    # The join's reading, on every run whether the join passed or not, so that
    # a run that reached the home and one that did not are read side by side:
    # how each member the run dials and the roots are reached, the MTU the
    # overlay interface received, and whether a segment filling it crosses to
    # each target in each direction. The members and the legs probed are the
    # ones this join's own `wait_for`, `wait_for_any` and `routes` name.
    # `kluster.scripts.zt_reading` says how to read the line it prints. The
    # runner has no environment of this project's at this step, so the script
    # runs by path from the checkout this action is part of, under the
    # runner's own `python3` and its standard library. It is a diagnostic, so
    # nothing it finds fails the join, and it runs inside the headroom the
    # clock step leaves: READING_SECONDS is its own deadline, and the
    # `timeout` a guard against a hang past it.
    #
    # The reading keeps what it was taken from in the job's temporary
    # directory, and ZT_READING_KEPT names the file for every later step, so a
    # job whose later step fails takes the same reading again as its last
    # step (framework/ci.md §2). A job whose join never ran has no such
    # variable, and takes none.
    - name: Take the join's reading
      if: always()
      shell: bash
      env:
        NETWORK_ID: ${{ inputs.network_id }}
        TARGETS: ${{ inputs.wait_for }}
        ANY_TARGETS: ${{ inputs.wait_for_any }}
        ROUTES: ${{ inputs.routes }}
        ZT_READING: ${{ github.action_path }}/../../../src/kluster/scripts/zt_reading.py
        READING_SECONDS: '20'
      run: |
        kept="$RUNNER_TEMP/zt-reading.json"
        echo "ZT_READING_KEPT=$kept" >>"$GITHUB_ENV"
        timeout "$((READING_SECONDS + 5))" \
          python3 -I -S "$ZT_READING" reading "$NETWORK_ID" "$READING_SECONDS" \
          --every "$TARGETS" --any "$ANY_TARGETS" --routes "$ROUTES" --keep "$kept" || true

name: noop-automerge

# Merges a pull request with nobody reading it, and only one of a single
# shape: every path it changes is on the **allow-list** in `classify`, and a
# preview of every stack a pull request can preview comes back empty. Every
# other pull request waits for a human -- a path the list does not name, a
# fork's, one labeled `expect-changes`.
#
# Its own workflow rather than a step in preview.yml, which runs for every PR
# and only reports: "this may merge without a human" deserves its own trigger,
# its own log and its own red X.
#
# **The route is an allow-list, because what a deny-list misses is what
# matters.** The zero-diff preview below measures what the previewed stacks'
# programs render, and a path no previewed stack reads previews empty however
# it changed -- the operator stacks, `state-backend` among them, are never
# previewed. Those paths are not inert. `escrow/RECIPIENTS` names who every new
# escrow generation is encrypted to; the `*.txt` files in
# `src/kluster/lib/state_backend/machine/` hold the appliance's operator keys
# and the drill recipient; `.github/actions/` is code `deploy.yml` runs with
# `physical-plan` secrets; `mise.toml`'s templates read the kit's slots on the
# workstation that holds it. A list of what to refuse admits each of those
# until somebody thinks to add it, and a pull request touching one merges on
# an empty preview in the meantime. So the list names what is admitted, and
# it is short on purpose:
#
#   * `uv.lock` -- the resolved dependency set, which lockfile maintenance
#     rewrites;
#   * `Pulumi.yaml` itself, on renovate's pull request and when nothing but
#     its `packages:` block changed -- the **admission** below;
#   * `sdks/**` -- the bridged provider SDKs, which sdk-regenerate.yml
#     generates from that block -- only beside that admitted bump, in the
#     same pull request.
#
# What those have in common is that they are code a stack program runs and
# nothing else reads as trust. What the preview measures of them differs.
# `uv.lock` is resolved by every previewed stack, so a change to what those
# render shows as a diff. `sdks/` is not measured at all: the bridged SDKs
# render only in `physical`, which no pull request previews, and `checks`
# holds them to the block only through each SDK's `pulumi-plugin.json`. So a
# change under `sdks/` merges unread, and runs in `plan-physical` on the next
# run of the chain -- which is why it is admitted only as what it is for: the
# regeneration sdk-regenerate.yml commits onto renovate's bump of the block,
# the one way anything writes there. A change under `sdks/` on any other pull
# request, renovate's lockfile maintenance included, waits for a reader.
# The code a dependency carries also runs with the credentials of every job
# that installs it, `deploy.yml`'s ungated `plan-physical` included; that is
# the residual ci.md §3 records under credential partitioning, and a bump
# that moves physical rendering stalls in front of `up-physical`'s reviewer
# gate rather than applying. Documentation is off the list for a reason of its
# own: no preview measures it, so a reader is the only thing that stands
# between a documentation change and `main`, and dispatch.md §3 says no pull
# request here merges reviewed by nobody but its author.
#
# **The proof** is a zero-diff preview of the stacks a pull request can
# preview at all: `dns`, `k8s-base` and `apps`, which is `prove`'s matrix
# below. It covers neither `physical` nor `github`, and each is read somewhere
# else instead. `physical`'s credentials are main-only, so no pull request
# previews it (ci.md §3): a bump that moves physical rendering surfaces as a
# diff in deploy.yml's `plan-physical` and stalls the chain in front of
# `up-physical`'s reviewer gate -- after this merge rather than before it, and
# on the next run of the chain rather than on this one, because the merge
# below starts no workflow at all (last paragraph). `github` is previewed and
# applied by no workflow: the forge is declared here and applied by hand from
# a workstation (ci.md §3), so its diff is read by whoever runs that apply.
#
# **The classification is only as good as the path list, so the list is
# complete or the verdict is a refusal.** GitHub pages a pull request's changed
# files, and a reader that takes the first page alone -- `gh pr view --json
# files` -- answers with at most a hundred paths and nothing to say that there
# were more, so a pull request carrying a hundred allow-listed paths could
# hold a path off the list the test never saw and merge unattended. `classify`
# pages the list instead and counts what it got against the number the pull
# request reports; a read that failed, an empty list and a count that falls
# short each refuse candidacy rather than decide on what arrived.
#
# **The route asks who only for the admission, and refuses a fork or an
# `expect-changes` label before it asks anything.** `uv.lock` merges on the
# proof whoever opened the pull request; `Pulumi.yaml`, and `sdks/` beside it,
# are on the list for renovate's pull request alone.
#
# **Why `Pulumi.yaml` is admitted at all**: its `packages:` block is not
# stack configuration -- no stack program reads it. It is the recipe
# `pulumi install` generates the three SDKs under `sdks/` from, and a bump of
# it reaches a stack only through the regenerated SDK, which `checks` already
# holds to the block (ci.md §3). So `classify` counts `Pulumi.yaml` as on the
# list when the author is renovate and the document with `packages` removed is
# equal at base and head. What the bump regenerates -- `sdks/` -- joins the
# list with it, and only when the pull request itself changes `Pulumi.yaml`:
# the admission compares documents, so it also holds for a renovate pull
# request that never touched the file, and `sdks/` on one of those is not a
# regeneration of anything. `uv.lock` is on the list in its own right, and the
# pull request merges behind the same zero-diff preview as any other.
#
# **That equality is of parsed documents, not of the diff**, and the step
# below decides it from three inputs and nothing else: the author, the base
# SHA and the head SHA. A hunk test would answer for the lines around the
# block as readily as for the block. So both revisions are read through the
# API -- `classify` has no checkout -- parsed, stripped of `packages`, and
# compared with their keys sorted. A comment does not count, and neither does
# a reordering of keys; an edit to any other key does. `versions:` is the key
# that matters: a pin there is what a stack program reads, so a bump that
# moved one is a change to what gets deployed, and it keeps the human route.
#
# **A person's edit to the recipe keeps the human route as well**, even when
# it is packages-only: an added entry is a new provider, and a pin moved by
# hand is a design decision. Renovate's bump is the mechanical case, and the
# only one `sdk-regenerate.yml` finishes on its branch.
#
# **Base is the base branch's tip**, which is what the event carries. Where
# that is not also the merge base -- a branch behind a `main` that has since
# moved `Pulumi.yaml` -- the two documents differ and the verdict is "not a
# candidate". That is the safe direction, and a temporary one: `main` requires
# an up-to-date branch (ci.md §5), so a branch that can merge at all has been
# rebased onto that tip, and renovate rebases its own.
#
# **An operator opt-in by label is ruled out rather than unbuilt** (kluster-ops
# #244, #247). A label carries no record of who put it there: the event names
# no labeler, and on a later `synchronize` the actor is the author regardless.
# So a label that *removes* a gate is one an author can apply to their own pull
# request and merge behind, which is the case dispatch.md §3 forbids by name.
# `expect-changes` is safe against the same hole only because it runs the other
# way -- it can stand the merge down and can never let one through.
#
# **The login is in the census `conventions/forge.py` carries, and a test holds
# this file to it.** A login a workflow branches on and nothing declares makes
# the condition silently dead: the comparison is never true, the route is never
# taken, and nothing anywhere reports that. The same census carries every label
# a workflow reads, for the same reason. The literal is written once -- in
# `env` below -- because two spellings are two things to get wrong, and the
# same test holds it to that one place.
#
# **The verdict is about one head, and the merge is of that head.** The run
# was started for the event's head, `prove` checks out that event's merge
# commit, and `classify` refuses unless the head the pull request reports
# when it is read is still that one. The merge names it too, with
# `--match-head-commit`, so GitHub refuses it if the branch has moved since.
# A newer push ordinarily cancels this run (`concurrency` below), but a
# re-run of a run's failed jobs reuses its finished jobs' outputs and its
# original event: without the pin, a re-run of an old head's run would merge
# whatever head the branch carries by then, which nothing classified or
# proved.
#
# A fork's pull request is refused outright, by name in `classify`, rather than
# left to the proof, which needs Environment secrets a fork never receives: a
# refusal that rests on a later job failing is one that a change to that job
# removes without anybody deciding to.
#
# The merge does not start deploy.yml -- pushes made with GITHUB_TOKEN start no
# workflow runs. That is correct by construction for what the proof covers: the
# pull request merged because the previewable stacks rendered identically. For
# `physical` it defers rather than settles, which is the reading
# `plan-physical` does on the next run of the chain (see **The proof** above).

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]

concurrency:
  group: noop-automerge-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  # `gh pr checks` reads the head commit's rollup, which is check runs and
  # commit statuses. An explicit permissions block grants nothing it does not
  # name, so without these two the wait below is a 403 rather than a wait.
  checks: read
  statuses: read

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_REPO: ${{ github.repository }}
  PR: ${{ github.event.pull_request.number }}
  # Who opened the pull request, and the one login the admission admits. The
  # literal is written here and nowhere else in this file (see the header);
  # `conventions.forge.RENOVATE` is the census that holds it.
  AUTHOR: ${{ github.event.pull_request.user.login }}
  RENOVATE: renovate[bot]
  # The head this run was started for: what `classify` holds the pull request
  # to, and the only head the merge may land (see the header).
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  classify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      noop: ${{ steps.classify.outputs.noop }}
    steps:
      # No checkout: every input is read through the API, and a job whose
      # entire output is a verdict has no reason to put an untrusted head on
      # disk.
      #
      # The admission the header describes, decided from the author and the two
      # revisions and nothing else -- which is what lets the same script be run
      # against a pair of real commits from a workstation. `yq` is on the
      # runner image; the JSON it writes carries no comments, and
      # `sort_keys(..)` makes two documents that differ only in the order of
      # their keys compare equal.
      #
      # Every read is guarded rather than assumed: the author test comes first,
      # so a pull request that is not renovate's costs no API call and a fork's
      # head is never fetched; and each revision is read into a variable of its
      # own, because a `gh api` that failed inside a `[ "$(...)" = "$(...)" ]`
      # would compare two empty strings and admit the pull request. Under
      # `set -euo pipefail` an assignment that fails ends the step, the job's
      # outputs are never written, and the merge job's `if` is false.
      - name: Is this a renovate bump of the packages block
        id: recipe
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          recipe() {
            gh api "repos/$GH_REPO/contents/Pulumi.yaml?ref=$1" \
              --header 'Accept: application/vnd.github.raw' \
            | yq --output-format=json --indent=0 'del(.packages) | sort_keys(..)'
          }
          if [ "$AUTHOR" != "$RENOVATE" ]; then
            echo 'admit=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base=$(recipe "$BASE_SHA")
          head=$(recipe "$HEAD_SHA")
          admit=false
          if [ "$base" = "$head" ]; then
            admit=true
          fi
          echo "admit=$admit" >> "$GITHUB_OUTPUT"

      - name: Classify the PR
        id: classify
        env:
          # Escape hatch: label a PR `expect-changes` when a bump is *supposed*
          # to move resources. Such a PR wants human eyes on the diff.
          OVERRIDE: ${{ contains(github.event.pull_request.labels.*.name, 'expect-changes') }}
          FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          ADMIT: ${{ steps.recipe.outputs.admit }}
          # The allow-list, and the only place it is written (the header says
          # why each entry is here and why nothing else is). One bash pattern
          # per line, matched against the whole path, where `*` crosses `/`:
          # `sdks/**` is every file under `sdks/`. `ALLOWED` is the list for
          # every pull request; `WITH_THE_BUMP` joins it only when the step
          # above admitted the pull request and `Pulumi.yaml` is among the
          # paths it changes -- renovate's packages-only bump, beside the
          # regeneration it carries.
          ALLOWED: |
            uv.lock
          WITH_THE_BUMP: |
            Pulumi.yaml
            sdks/**
        run: |
          set -euo pipefail
          if [ "$FORK" = 'true' ] || [ "$OVERRIDE" = 'true' ]; then
            echo 'noop=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The complete list, which `gh pr view --json files` is not: it
          # answers with the API's first page, at most a hundred paths, and
          # says nothing about the rest, so a pull request carrying a hundred
          # early-sorting paths hides every path after them from the test
          # below. `--paginate` walks the pages, and the `--jq` filter runs on
          # each of them, so the output is one line per entry however many
          # pages there were; `per_page` decides only how many requests that
          # is.
          #
          # **An entry is a change, and a rename is one entry with two paths.**
          # The API reports a rename once, with the new path in `filename` and
          # the old one in `previous_filename`, and `changedFiles` counts it
          # once. A test that read `filename` alone would never see the old
          # path, so a rename from anywhere into `sdks/` would delete a file
          # off the list unread. So each line carries both paths, tab-separated
          # -- `@tsv` escapes a tab or a newline inside a name, which keeps an
          # entry on one line and the count a count of entries -- and each is
          # held to the list below.
          #
          # Each read lands in a variable of its own and the list is counted,
          # because every way this can go wrong goes wrong the same way: a
          # short list still passes the test below. So a read that failed
          # refuses, an empty list refuses, and a count that does not match the
          # number the pull request itself reports refuses -- naming both
          # numbers, a log being the only reader there is.
          if ! files=$(gh api --paginate "repos/$GH_REPO/pulls/$PR/files?per_page=100" \
              --jq '.[] | [.filename, (.previous_filename // "")] | @tsv') \
            || ! reported=$(gh pr view "$PR" --json changedFiles,headRefOid --jq '.changedFiles, .headRefOid'); then
            echo 'The changed paths could not be read; not a candidate.'
            echo 'noop=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=
          head=
          { read -r changed; read -r head; } <<<"$reported" || true
          # Read after the list, so a head that still matches is the head the
          # list describes.
          if [ "$head" != "$HEAD_SHA" ]; then
            echo "The pull request's head is '$head', not $HEAD_SHA, which this run is for; not a candidate."
            echo 'noop=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Compared as strings: `-ne` on a count that is not a number is a
          # test error, which an `if` reads as false and walks past, where a
          # string that differs refuses by construction.
          seen=$(grep -c . <<<"$files" || true)
          if [ "$seen" = 0 ] || [ "$seen" != "$changed" ]; then
            echo "Read $seen of the $changed changed paths; not a candidate."
            echo 'noop=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Whether a path matches a pattern of a list. The pattern is unquoted
          # on purpose: quoted, `[[ == ]]` compares it as a literal string and
          # `sdks/**` matches nothing.
          matches() {
            local pattern
            while IFS= read -r pattern; do
              if [ -n "$pattern" ] && [[ $1 == $pattern ]]; then
                return 0
              fi
            done <<<"$2"
            return 1
          }
          # The pull request is renovate's packages-only bump when the step
          # above admitted it and it changes `Pulumi.yaml` itself. `@tsv`
          # writes a path that has no previous one as the path and a tab.
          allowed=$ALLOWED
          if [ "$ADMIT" = 'true' ] && grep -q $'^Pulumi\\.yaml\t' <<<"$files"; then
            allowed+=$'\n'$WITH_THE_BUMP
          fi
          # Every path is on the list -- both of a rename's -- or the pull
          # request is the human route, and the log says which path and why.
          while IFS=$'\t' read -r path previous; do
            for candidate in "$path" ${previous:+"$previous"}; do
              if matches "$candidate" "$allowed"; then
                continue
              fi
              if matches "$candidate" "$WITH_THE_BUMP"; then
                echo "$candidate is on the allow-list only in renovate's packages-only bump of Pulumi.yaml, which this pull request is not; not a candidate."
              else
                echo "$candidate is not on the allow-list; not a candidate."
              fi
              echo 'noop=false' >> "$GITHUB_OUTPUT"
              exit 0
            done
          done <<<"$files"
          # Last, and the only line that writes it: see the merge job's `if`.
          echo 'noop=true' >> "$GITHUB_OUTPUT"

  prove:
    needs: classify
    # The proof is for every candidate: a fork, an `expect-changes` label and a
    # path off the allow-list all leave `noop` false, which skips this job and
    # the merge with it.
    if: needs.classify.outputs.noop == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        stack: [dns, k8s-base, apps]
    environment: ${{ matrix.stack }}
    # Same lock as the preview's dns job, and the same reason: one ZeroTier
    # identity, one live endpoint (framework/ci.md §2).
    concurrency:
      group: ${{ matrix.stack == 'dns' && 'zt-dns' || format('noop-{0}-{1}', github.ref, matrix.stack) }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          # Pinned like every tool `mise.toml` manages, and for the same
          # reason (framework/ci.md §3). This is the action's own input, and
          # the one renovate bumps.
          version: 2026.9.14
          experimental: true
      - run: mise x uv -- uv sync --locked
      # dns is the LAN-touching stack: its AdGuard rewrites live on the UDM
      # (declarative/dns.md §3). apps reaches nothing but the cluster, and an
      # apps job holding ZeroTier secrets would break that partition.
      - uses: ./.github/actions/zerotier
        if: matrix.stack == 'dns'
        with:
          network_id: ${{ secrets.ZEROTIER_NETWORK_ID }}
          identity: ${{ secrets.ZEROTIER_IDENTITY }}
      - uses: ./.github/actions/state-backend
        with:
          url: ${{ secrets.PULUMI_BACKEND_URL }}
          ca: ${{ secrets.PULUMI_BACKEND_CA }}
          certificate: ${{ secrets.PULUMI_BACKEND_CERT }}
          key: ${{ secrets.PULUMI_BACKEND_KEY }}
      - name: Prove the preview is empty
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        run: mise x -- pulumi preview --stack ${{ matrix.stack }} --expect-no-changes

  merge:
    needs: [classify, prove]
    # `prove` ran, and every entry of its matrix proved an empty preview.
    # `classify` writes `noop=true` as the last line of a `set -euo pipefail`
    # script, so no path through it that ends early writes that value; a
    # `classify` that failed outright skips `prove`, and a skipped `prove` is
    # not a success. A draft is excluded because `pull_request`/`opened` fires
    # for one while `gh pr merge` refuses it -- without this the route would
    # produce a red job rather than a merge.
    if: >-
      github.event.pull_request.draft == false
      && needs.classify.outputs.noop == 'true'
      && needs.prove.result == 'success'
    runs-on: ubuntu-24.04
    # A required check that never arrives ends the job rather than holding a
    # runner for GitHub's six-hour default.
    timeout-minutes: 60
    steps:
      # `main` requires `checks` and `changes` on an up-to-date branch
      # (framework/ci.md §5), and the merge API refuses while either is
      # outstanding. Nothing orders `prove` after `checks` -- they are two
      # workflows started by the same event -- so the merge would otherwise
      # race a precondition it has no reason to win. This is not a delay
      # standing in for a condition: `--required` names exactly the contexts
      # branch protection names, `--watch` returns when they reach a terminal
      # state, and a failure exits non-zero so the merge below never runs.
      - name: Wait for the required checks
        run: gh pr checks "$PR" --required --watch --fail-fast --interval 15

      # Rebase, never squash: squashing rewrites the committer to
      # noreply@github.com. Of the head this run classified and proved, and no
      # other: GitHub refuses the merge if the branch has moved (see the
      # header).
      - name: Merge
        run: gh pr merge "$PR" --rebase --delete-branch --match-head-commit "$HEAD_SHA"

name: noop-automerge

# A PR that touches neither the program (`src/`) nor its stack config
# (`Pulumi.*`) cannot legitimately change what gets deployed — lockfile
# maintenance, dependency bumps, docs. This workflow merges such a PR
# unattended — and one `Pulumi.yaml` change besides, which is the **admission**
# below.
#
# Its own workflow rather than a step in preview.yml, which runs for every PR
# and only reports: "this may merge without a human" deserves its own trigger,
# its own log and its own red X.
#
# Two routes reach the merge. The path classification decides candidacy for
# both, and it is most of what tells them apart:
#
#   * **Proven.** A change that can still reach a stack — a lockfile, a
#     dependency, a workflow — merges only behind a **zero-diff preview** of
#     the stacks a pull request can preview at all: `dns`, `k8s-base` and
#     `apps`, which is `prove`'s matrix below. That proof is the gate, and it
#     is what catches a bump which silently changes rendering. It covers
#     neither `physical` nor `github`, and each is read somewhere else
#     instead. `physical`'s credentials are main-only, so no pull request
#     previews it (ci.md §3): a bump that moves physical rendering surfaces as
#     a diff in deploy.yml's `plan-physical` and stalls the chain in front of
#     `up-physical`'s reviewer gate — after this merge rather than before it,
#     and on the next run of the chain rather than on this one, because the
#     merge below starts no workflow at all (last paragraph). `github` is
#     previewed and applied by no workflow: the forge is declared here and
#     applied by hand from a workstation (ci.md §3), so its diff is read by
#     whoever runs that apply.
#   * **Unproven.** A change to documentation, editor configuration or
#     `.gitignore` reaches no stack at all: no `pulumi` program reads those
#     paths, so there is no rendering for a preview to compare and the proof
#     would be a ceremony over an empty diff. Such a PR skips the matrix and
#     merges on the required checks alone.
#
# **The classification is only as good as the path list, so the list is
# complete or the verdict is a refusal.** GitHub pages a pull request's changed
# files, and a reader that takes the first page alone -- `gh pr view --json
# files` -- answers with at most a hundred paths and nothing to say that there
# were more, so a pull request carrying a hundred early-sorting paths could
# hold a `src/` file the test never saw and merge unattended. `classify` pages
# the list instead and counts what it got against the number the pull request
# reports; a read that failed, an empty list and a count that falls short each
# refuse candidacy rather than decide on what arrived.
#
# **The unproven route asks who as well as the path; the proven one asks the
# path, and asks who only for the admission above. Both are refused outright
# by a fork or an `expect-changes` label first.** Skipping the
# proof also skips the only thing that was holding a documentation change until
# somebody read it, and dispatch.md §3 says no PR here merges reviewed by
# nobody but its author — a rule whose subject is `AGENTS.md` and `docs/` more
# than anything else. So the unproven route is open to renovate's own pull
# requests and to nothing else.
#
# **One `Pulumi.*` path is admitted even so**: `Pulumi.yaml`'s `packages:`
# block, on renovate's own pull request. That block is not stack
# configuration — no stack program reads it. It is the recipe `pulumi install`
# generates the three SDKs under `sdks/` from, and a bump of it reaches a
# stack only through the regenerated SDK, which `checks` already holds to the
# block (ci.md §3). So `classify` admits a pull request whose only
# `src/`-or-`Pulumi.*` path is `Pulumi.yaml`, when the author is renovate and
# the document with `packages` removed is equal at base and head. What the
# bump actually changes — `sdks/`, `uv.lock` — is code, so such a pull request
# stays on the proven route and merges behind the same zero-diff preview as
# any other bump.
#
# **That equality is of parsed documents, not of the diff**, and the step
# below decides it from three inputs and nothing else: the author, the base
# SHA and the head SHA. A hunk test would answer for the lines around the
# block as readily as for the block. So both revisions are read through the
# API — `classify` has no checkout — parsed, stripped of `packages`, and
# compared with their keys sorted. A comment does not count, and neither does
# a reordering of keys; an edit to any other key does. `versions:` is the key
# that matters: a pin there is what a stack program reads, so a bump that
# moved one is a change to what gets deployed, and it keeps the human route.
#
# **A person's edit to the recipe keeps the human route as well**, even when
# it is packages-only: an added entry is a new provider, and a pin moved by
# hand is a design decision. Renovate's bump is the mechanical case, and the
# only one `sdk-regenerate.yml` finishes on its branch.
#
# **Base is the base branch's tip**, which is what the event carries. Where
# that is not also the merge base — a branch behind a `main` that has since
# moved `Pulumi.yaml` — the two documents differ and the verdict is "not a
# candidate". That is the safe direction, and a temporary one: `main` requires
# an up-to-date branch (ci.md §5), so a branch that can merge at all has been
# rebased onto that tip, and renovate rebases its own.
#
# **An operator opt-in by label is ruled out rather than unbuilt** (kluster-ops
# #244, #247). A label carries no record of who put it there: the event names
# no labeler, and on a later `synchronize` the actor is the author regardless.
# So a label that *removes* a gate is one an author can apply to their own pull
# request and merge behind, which is the case dispatch.md §3 forbids by name.
# `expect-changes` is safe against the same hole only because it runs the other
# way — it can stand the merge down and can never let one through.
#
# **The login is in the census `conventions/forge.py` carries, and a test holds
# this file to it.** A login a workflow branches on and nothing declares makes
# the condition silently dead: the comparison is never true, the route is never
# taken, and nothing anywhere reports that. The same census carries every label
# a workflow reads, for the same reason. Both routes test the same login, and
# it is written once — in `env` below — because two spellings are two things
# to get wrong, and the same test holds it to that one place.
#
# A fork's pull request is refused outright, by name in `classify`. Until the
# unproven route existed the refusal was implicit — the proof needs Environment
# secrets, which a fork never receives, so it errored — and an implicit refusal
# does not survive a route that runs no job needing a secret.
#
# The merge does not start deploy.yml — pushes made with GITHUB_TOKEN start no
# workflow runs. That is correct by construction for what the proof covers: a
# proven PR merged because the previewable stacks rendered identically, and an
# unproven one changes nothing an apply reads. For `physical` it defers rather
# than settles, which is the reading `plan-physical` does on the next run of
# the chain (see **Proven** above).

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]

concurrency:
  group: noop-automerge-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  # `gh pr checks` reads the head commit's rollup, which is check runs and
  # commit statuses. An explicit permissions block grants nothing it does not
  # name, so without these two the wait below is a 403 rather than a wait.
  checks: read
  statuses: read

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_REPO: ${{ github.repository }}
  PR: ${{ github.event.pull_request.number }}
  # Who opened the pull request, and the one login either route admits. The
  # literal is written here and nowhere else in this file (see the header);
  # `conventions.forge.RENOVATE` is the census that holds it.
  AUTHOR: ${{ github.event.pull_request.user.login }}
  RENOVATE: renovate[bot]

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      noop: ${{ steps.classify.outputs.noop }}
      # Whether this PR may merge without the proof, which is the path
      # classification and the author test together.
      unproven: ${{ steps.classify.outputs.unproven }}
    steps:
      # No checkout. On a `pull_request` event paths-filter reads the file list
      # from the API rather than from a working tree, and a job whose entire
      # output is a verdict has no reason to put an untrusted head on disk.
      - uses: dorny/paths-filter@v3
        id: paths
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '!docs/**'
              - '!**/*.md'
              - '!.vscode/**'
              - '!.gitignore'

      # The admission the header describes, decided from the author and the two
      # revisions and nothing else -- which is what lets the same script be run
      # against a pair of real commits from a workstation. `yq` is on the
      # runner image; the JSON it writes carries no comments, and
      # `sort_keys(..)` makes two documents that differ only in the order of
      # their keys compare equal.
      #
      # Every read is guarded rather than assumed: the author test comes first,
      # so a pull request that is not renovate's costs no API call and a fork's
      # head is never fetched; and each revision is read into a variable of its
      # own, because a `gh api` that failed inside a `[ "$(...)" = "$(...)" ]`
      # would compare two empty strings and admit the pull request. Under
      # `set -euo pipefail` an assignment that fails ends the step, the job's
      # outputs are never written, and the merge job's `if` is false.
      - name: Is this a renovate bump of the packages block
        id: recipe
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          recipe() {
            gh api "repos/$GH_REPO/contents/Pulumi.yaml?ref=$1" \
              --header 'Accept: application/vnd.github.raw' \
            | yq --output-format=json --indent=0 'del(.packages) | sort_keys(..)'
          }
          if [ "$AUTHOR" != "$RENOVATE" ]; then
            echo 'admit=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base=$(recipe "$BASE_SHA")
          head=$(recipe "$HEAD_SHA")
          admit=false
          if [ "$base" = "$head" ]; then
            admit=true
          fi
          echo "admit=$admit" >> "$GITHUB_OUTPUT"

      - name: Classify the PR
        id: classify
        env:
          # Escape hatch: label a PR `expect-changes` when a bump is *supposed*
          # to move resources. Such a PR wants human eyes on the diff.
          OVERRIDE: ${{ contains(github.event.pull_request.labels.*.name, 'expect-changes') }}
          FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          # `code: false` means every file in the PR is documentation, editor
          # configuration or `.gitignore`. The filter above is preview.yml's
          # own, pattern for pattern and under the same `every` quantifier, so
          # a file that stops being inert stops being inert in both at once.
          INERT: ${{ steps.paths.outputs.code == 'false' }}
          ADMIT: ${{ steps.recipe.outputs.admit }}
        run: |
          set -euo pipefail
          trusted=false
          if [ "$AUTHOR" = "$RENOVATE" ]; then
            trusted=true
          fi
          if [ "$FORK" = 'true' ] || [ "$OVERRIDE" = 'true' ]; then
            echo 'noop=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The complete list, which `gh pr view --json files` is not: it
          # answers with the API's first page, at most a hundred paths, and
          # says nothing about the rest, so a pull request carrying a hundred
          # early-sorting paths hides every path after them from the test
          # below. `--paginate` walks the pages, and the `--jq` filter runs on
          # each of them, so the output is one path per line however many pages
          # there were; `per_page` decides only how many requests that is.
          #
          # Each read lands in a variable of its own and the list is counted,
          # because every way this can go wrong goes wrong the same way: a
          # short list still greps clean. So a read that failed refuses, an
          # empty list refuses, and a count that does not match the number the
          # pull request itself reports refuses -- naming both numbers, a log
          # being the only reader there is.
          if ! files=$(gh api --paginate "repos/$GH_REPO/pulls/$PR/files?per_page=100" --jq '.[].filename') \
            || ! changed=$(gh pr view "$PR" --json changedFiles --jq '.changedFiles'); then
            echo 'The changed paths could not be read; not a candidate.'
            echo 'noop=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          seen=$(grep -c . <<<"$files" || true)
          if [ "$seen" -eq 0 ] || [ "$seen" -ne "$changed" ]; then
            echo "Read $seen of the $changed changed paths; not a candidate."
            echo 'noop=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Every path that can reach a stack. `Pulumi.yaml` alone, admitted by
          # the step above, is the one such list that is still a candidate: any
          # other member, and a second member beside it, is the human route.
          reaching=$(grep -E '^(src/|Pulumi\.)' <<<"$files" || true)
          if [ -n "$reaching" ] && { [ "$reaching" != 'Pulumi.yaml' ] || [ "$ADMIT" != 'true' ]; }; then
            echo 'noop=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$INERT" = 'true' ] && [ "$trusted" = 'true' ]; then
            echo 'unproven=true' >> "$GITHUB_OUTPUT"
          fi
          # Last, and the only line that writes it: see the merge job's `if`.
          echo 'noop=true' >> "$GITHUB_OUTPUT"

  prove:
    needs: classify
    # The proof is for every candidate that is not on the unproven route: a
    # fork, an `expect-changes` label, and a `src/`-or-`Pulumi.*` touch the
    # admission above does not cover, all leave `noop` false, which skips this
    # job and the merge with it. An admitted bump is a candidate that is not
    # inert, so it arrives here rather than skipping past.
    if: needs.classify.outputs.noop == 'true' && needs.classify.outputs.unproven != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        stack: [dns, k8s-base, apps]
    environment: ${{ matrix.stack }}
    # Same lock as the preview's dns job, and the same reason: one ZeroTier
    # identity, one live endpoint (framework/ci.md §2).
    concurrency:
      group: ${{ matrix.stack == 'dns' && 'zt-dns' || format('noop-{0}-{1}', github.ref, matrix.stack) }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          # Pinned like every tool `mise.toml` manages, and for the same
          # reason (framework/ci.md §3). This is the action's own input, and
          # the one renovate bumps.
          version: 2026.9.1
          experimental: true
      - run: mise x uv -- uv sync --locked
      # dns is the LAN-touching stack: its AdGuard rewrites live on the UDM
      # (declarative/dns.md §3). apps reaches nothing but the cluster, and an
      # apps job holding ZeroTier secrets would break that partition.
      - uses: ./.github/actions/zerotier
        if: matrix.stack == 'dns'
        with:
          network_id: ${{ secrets.ZEROTIER_NETWORK_ID }}
          identity: ${{ secrets.ZEROTIER_IDENTITY }}
      - uses: ./.github/actions/state-backend
        with:
          url: ${{ secrets.PULUMI_BACKEND_URL }}
          ca: ${{ secrets.PULUMI_BACKEND_CA }}
          certificate: ${{ secrets.PULUMI_BACKEND_CERT }}
          key: ${{ secrets.PULUMI_BACKEND_KEY }}
      - name: Prove the preview is empty
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        run: mise x -- pulumi preview --stack ${{ matrix.stack }} --expect-no-changes

  merge:
    needs: [classify, prove]
    # `prove` is skipped on the unproven route, and a skipped dependency would
    # cascade-skip an ordinary `needs`, so this reads results instead of
    # depending on success. Both ways through are checkable rather than
    # inferred from how a failed job behaves: `classify` writes `noop=true` as
    # the last line of a `set -euo pipefail` script, so no path through it that
    # ends early writes that value; and a `classify` that failed outright
    # cascade-skips `prove`, which leaves only the `skipped` branch, which
    # needs an `unproven` that was never written either. A draft is excluded
    # because `pull_request`/`opened` fires for one while `gh pr merge` refuses
    # it — without this the route would produce a red job rather than a merge.
    if: >-
      !cancelled()
      && github.event.pull_request.draft == false
      && needs.classify.outputs.noop == 'true'
      && (needs.prove.result == 'success'
          || (needs.prove.result == 'skipped'
              && needs.classify.outputs.unproven == 'true'))
    runs-on: ubuntu-latest
    # A required check that never arrives ends the job rather than holding a
    # runner for GitHub's six-hour default.
    timeout-minutes: 60
    steps:
      # `main` requires `checks` and `changes` on an up-to-date branch
      # (framework/ci.md §5), and the merge API refuses while either is
      # outstanding. On the unproven route `classify` is done in under a minute
      # while `checks` is still installing its tools, so the merge would
      # otherwise race a precondition it cannot win. This is not a delay
      # standing in for a condition: `--required` names exactly the contexts
      # branch protection names, `--watch` returns when they reach a terminal
      # state, and a failure exits non-zero so the merge below never runs.
      - name: Wait for the required checks
        run: gh pr checks "$PR" --required --watch --fail-fast --interval 15

      # Rebase, never squash: squashing rewrites the committer to
      # noreply@github.com.
      - name: Merge
        run: gh pr merge "$PR" --rebase --delete-branch

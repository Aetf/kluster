name: drift

# The weekly drift check (framework/ci.md §3), fired by the ops repo's
# scheduler through the trigger App — this repo carries no `schedule:` trigger
# by rule, because once public a scheduled workflow sits under GitHub's 60-day
# inactivity auto-disable, and a freshness check that dies quietly is worse
# than none.
#
# `--refresh` is load-bearing: a plain preview diffs code against cached state
# and would report zero for a console hand-edit. A preview's refresh writes
# nothing: the refreshed state is compared and discarded, so the same diff
# fails every weekly run until it is reconciled (framework/ci.md §3.2).
#
# A diff is a failed run, and a failed run raises an `actionable` alert through
# the producer (`alert.yml`; cluster/architecture.md §4.3), keyed by this
# workflow, so that once the ops repository's dispatch handler exists, a drift
# that persists is one open issue there rather than a page a week
# (framework/ci.md §3 says what is built). Its playbook is framework/ci.md
# §3.2.

on:
  workflow_dispatch:

concurrency:
  group: drift
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-26.04
    # The sum of its steps' bounds, a `uses:` step twice, plus five minutes
    # for the runner's own phases: a backstop for what no step bound reaches
    # (framework/ci.md §3).
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - stack: physical
            environment: physical-plan
            zerotier: true
            # The join waits for the gateway's shell and the homelab host's,
            # as deploy.yml's `physical` joins do, and installs no route of
            # its own.
            routes: ''
            wait_for: '10.144.1.1:22 10.144.180.10:22'
            wait_for_any: ''
            lock: zt-physical
            # The libvirt provider reads two files by path that the program
            # writes before it builds the provider, and a refresh builds
            # providers from state before the program runs: without the
            # program first, this fresh checkout has neither file when the
            # refresh dials (physical/homelab-host.md §6).
            run_program: --run-program
          - stack: dns
            environment: dns
            # The AdGuard rewrites are on the UDM (declarative/dns.md §3).
            zerotier: true
            # The two resolver APIs, reached through the gateway by routes
            # this run installs for itself, and the first to answer ends the
            # join, as deploy.yml's `dns` join does (framework/ci.md §2).
            routes: |
              10.0.5.3/32 via 10.144.1.1
              10.0.5.4/32 via 10.144.1.1
            wait_for: ''
            wait_for_any: '10.0.5.3:80 10.0.5.4:80'
            lock: zt-dns
          - stack: k8s-base
            environment: k8s-base
            zerotier: false
            lock: drift-k8s-base
          - stack: apps
            environment: apps
            zerotier: false
            lock: drift-apps
    environment: ${{ matrix.environment }}
    # A drift run joins with the very identities the deploy chain uses, so the
    # workflow's own `drift` group cannot keep them apart: the lock has to be
    # the identity, shared across workflows (framework/ci.md §2). Each matrix
    # entry carries a distinct key — two entries of one run sharing a key is
    # the case GitHub does not serialize reliably — and the non-ZeroTier
    # stacks get a key that only ever collides with another drift run.
    concurrency:
      group: ${{ matrix.lock }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        timeout-minutes: 5
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        timeout-minutes: 5
        with:
          # Pinned like every tool `mise.toml` manages, and for the same
          # reason (framework/ci.md §3). This is the action's own input, and
          # the one renovate bumps.
          version: 2026.10.5
          experimental: true
      - run: mise x uv -- uv sync --locked
        timeout-minutes: 5
      - uses: ./.github/actions/zerotier
        timeout-minutes: 5
        if: matrix.zerotier
        with:
          network_id: ${{ secrets.ZEROTIER_NETWORK_ID }}
          identity: ${{ secrets.ZEROTIER_IDENTITY }}
          routes: ${{ matrix.routes }}
          wait_for: ${{ matrix.wait_for }}
          wait_for_any: ${{ matrix.wait_for_any }}
      - uses: ./.github/actions/state-backend
        timeout-minutes: 5
        with:
          url: ${{ secrets.PULUMI_BACKEND_URL }}
          ca: ${{ secrets.PULUMI_BACKEND_CA }}
          certificate: ${{ secrets.PULUMI_BACKEND_CERT }}
          key: ${{ secrets.PULUMI_BACKEND_KEY }}
      - name: Install plugins
        # Before the program runs, with the job's token, and that token in
        # this step alone: deploy.yml's `plan-physical` says why
        # (framework/ci.md §3).
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise x -- pulumi plugin install
      - name: Refresh and compare
        timeout-minutes: 30
        env:
          # The passphrase of the stack the entry's Environment runs:
          # `physical`'s own in `physical-plan`, the stack passphrase in the
          # others (credentials.md §3).
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        # `run_program` is set on the stack whose providers read a file the
        # program writes, and on no other: every other provider here is built
        # from values its inputs in state carry whole, so a refresh needs
        # nothing on disk. An entry without it expands to nothing.
        run: mise x -- pulumi preview --stack ${{ matrix.stack }} --refresh ${{ matrix.run_program }} --diff --expect-no-changes

  # The alert job (framework/ci.md §3). This workflow has no pull-request
  # trigger, so the guard on the event is never what stands it down; it is kept
  # so the condition is the one condition every caller writes.
  alert:
    needs: [drift]
    if: always() && github.event_name != 'pull_request' && contains(needs.*.result, 'failure')
    uses: ./.github/workflows/alert.yml
    with:
      tier: actionable
      summary: drift check failed on at least one stack
      playbook: docs/framework/ci.md §3.2
    secrets:
      dispatch-app-private-key: ${{ secrets.DISPATCH_APP_PRIVATE_KEY }}

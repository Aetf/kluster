name: drift

# The weekly drift check (framework/ci.md §3), fired by the ops repo's
# scheduler through the trigger App — this repo carries no `schedule:` trigger
# by rule, because once public a scheduled workflow sits under GitHub's 60-day
# inactivity auto-disable, and a freshness check that dies quietly is worse
# than none.
#
# `--refresh` is load-bearing: a plain preview diffs code against cached state
# and would report zero for a console hand-edit. A preview's refresh writes
# nothing: the refreshed state is compared and discarded, so the same diff
# fails every weekly run until it is reconciled (framework/ci.md §3.2).
#
# A diff is a failed run, and a failed run raises an `actionable` alert through
# the producer (`alert.yml`; cluster/architecture.md §4.3), keyed by this
# workflow, so that once the ops repository's dispatch handler exists, a drift
# that persists is one open issue there rather than a page a week
# (framework/ci.md §3 says what is built). Its playbook is framework/ci.md
# §3.2.

on:
  workflow_dispatch:

concurrency:
  group: drift
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - stack: physical
            environment: physical-plan
            zerotier: true
            lock: zt-physical
          - stack: dns
            environment: dns
            # The AdGuard rewrites are on the UDM (declarative/dns.md §3).
            zerotier: true
            lock: zt-dns
          - stack: k8s-base
            environment: k8s-base
            zerotier: false
            lock: drift-k8s-base
          - stack: apps
            environment: apps
            zerotier: false
            lock: drift-apps
    environment: ${{ matrix.environment }}
    # A drift run joins with the very identities the deploy chain uses, so the
    # workflow's own `drift` group cannot keep them apart: the lock has to be
    # the identity, shared across workflows (framework/ci.md §2). Each matrix
    # entry carries a distinct key — two entries of one run sharing a key is
    # the case GitHub does not serialize reliably — and the non-ZeroTier
    # stacks get a key that only ever collides with another drift run.
    concurrency:
      group: ${{ matrix.lock }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          # Pinned like every tool `mise.toml` manages, and for the same
          # reason (framework/ci.md §3). This is the action's own input, and
          # the one renovate bumps.
          version: 2026.9.1
          experimental: true
      - run: mise x uv -- uv sync --locked
      - uses: ./.github/actions/zerotier
        if: matrix.zerotier
        with:
          network_id: ${{ secrets.ZEROTIER_NETWORK_ID }}
          identity: ${{ secrets.ZEROTIER_IDENTITY }}
      - uses: ./.github/actions/state-backend
        with:
          url: ${{ secrets.PULUMI_BACKEND_URL }}
          ca: ${{ secrets.PULUMI_BACKEND_CA }}
          certificate: ${{ secrets.PULUMI_BACKEND_CERT }}
          key: ${{ secrets.PULUMI_BACKEND_KEY }}
      - name: Refresh and compare
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        run: mise x -- pulumi preview --stack ${{ matrix.stack }} --refresh --diff --expect-no-changes

  # The alert job (framework/ci.md §3). This workflow has no pull-request
  # trigger, so the guard on the event is never what stands it down; it is kept
  # so the condition is the one condition every caller writes.
  alert:
    needs: [drift]
    if: always() && github.event_name != 'pull_request' && contains(needs.*.result, 'failure')
    uses: ./.github/workflows/alert.yml
    with:
      tier: actionable
      summary: drift check failed on at least one stack
      playbook: docs/framework/ci.md §3.2
    secrets:
      dispatch-app-private-key: ${{ secrets.DISPATCH_APP_PRIVATE_KEY }}

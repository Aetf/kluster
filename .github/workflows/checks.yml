name: checks

# Everything that can be judged without touching the cloud: formatting, lint,
# types, unit tests, the appliance's pinned digests, and the prose of the
# markdown a change touches. The checks read no secret, so they run for forks
# too; the one job that does -- `alert`, on a red push to `main` -- never runs
# for a pull request. A pull request of the fast path's shape runs a part of
# them, which the `Scope` step decides; a push always runs them all
# (framework/ci.md §3).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-26.04
    # Every step carries a bound of its own, so a hung step fails by name and
    # the alert below fires for it. This one is the sum of theirs, a `uses:`
    # step twice for its `post` phase, plus five minutes for the runner's own
    # phases -- a backstop for what no step bound reaches (framework/ci.md §3).
    timeout-minutes: 160
    # Every mise command in the job reads `mise.ci.toml` beside `mise.toml`,
    # so the install puts the pinned podman in, and every `mise x` puts it on
    # the path ahead of the runner image's (framework/ci.md §3).
    env:
      MISE_ENV: ci
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        timeout-minutes: 5
        with:
          # The prose step diffs against the base commit, which a shallow
          # clone does not have.
          fetch-depth: 0

      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        timeout-minutes: 5
        with:
          # Pinned like every tool `mise.toml` manages, and for the same
          # reason (framework/ci.md §3). This is the action's own input, and
          # the one renovate bumps.
          version: 2026.10.5
          experimental: true

      # The log names the interpreter every step after this one runs -- the
      # build uv installs for `.python-version` -- and the OpenSSL that build
      # carries, which is what every TLS connection a job's Python makes runs
      # on (`kluster.scripts.interpreter`).
      - name: Install dependencies
        timeout-minutes: 5
        run: |
          set -euo pipefail
          mise x uv -- uv sync --locked
          mise x uv -- uv run interpreter

      # `stack-files` for a pull request of the fast path's shape
      # (framework/ci.md §3, `kluster.scripts.checks_scope`); `full` for
      # anything else, and for a run whose verdict is missing. Under
      # `stack-files` the steps that read nothing such a change can move are
      # skipped -- each one carries the `if` -- and the tests run only the
      # cases that read a committed stack file. A push skips this step, so it
      # runs every step in full.
      - name: Scope
        id: scope
        if: github.event_name == 'pull_request'
        timeout-minutes: 5
        env:
          EVENT: ${{ github.event_name }}
          # The base the prose step diffs against on a pull request, for the
          # reason given there.
          BASE: HEAD^1
        run: mise x uv -- uv run checks-scope --event "$EVENT" --base "$BASE" --github-output "$GITHUB_OUTPUT"

      - name: Format
        if: steps.scope.outputs.scope != 'stack-files'
        timeout-minutes: 5
        run: mise x uv -- uv run ruff format --check .

      - name: Lint
        if: steps.scope.outputs.scope != 'stack-files'
        timeout-minutes: 5
        run: mise x uv -- uv run ruff check .

      # basedpyright through `typecheck`, which runs it under a heap a full
      # run of the tree does not exhaust and exits 5 when a run empties its
      # type cache anyway: an emptied cache drops the report of a
      # `# pyright: ignore` that suppresses nothing in every file parsed
      # again after it (`kluster.scripts.typecheck`).
      - name: Types
        if: steps.scope.outputs.scope != 'stack-files'
        timeout-minutes: 10
        run: mise x uv -- uv run typecheck

      # The source layout is a set of layers, and nothing else notices when
      # one of them reaches upwards: a wrong import type-checks and passes
      # its tests. The contract is in `pyproject.toml`.
      - name: Imports
        if: steps.scope.outputs.scope != 'stack-files'
        timeout-minutes: 5
        run: mise x uv -- uv run lint-imports

      # `tests/test_state_roles.py` runs the appliance's Postgres roles in the
      # images the box runs, Postgres and the PgBouncer in front of it, and
      # skips where no copy of either is local rather than fetch one mid-run;
      # this step makes both local, so those cases run on every event that
      # runs the whole suite (framework/ci.md §3). The images are the ones
      # `settings.POSTGRES_IMAGE` and `settings.PGBOUNCER_IMAGE` pin, by
      # their tags and digests.
      #
      # Docker Hub limits anonymous pulls per address, and a runner's address
      # is shared, so the Postgres image is pulled from Google's mirror of
      # Docker Hub instead, by the pinned digest: the mirror serves exactly
      # the pinned image or the pull fails. PgBouncer's is pulled from its own
      # registry, GitHub's, by its digest. Each is then tagged with the
      # repository and tag of its pin, which is what lets the pinned
      # reference -- tag and digest -- resolve to it locally, as the cases
      # run it. `appliance-image` prints each pin's three parts.
      #
      # The podman every case runs containers on is `mise.ci.toml`'s pin, not
      # the runner image's (framework/ci.md §3). Its archive's binaries are
      # taken and its configuration is not. Two files in the runner user's
      # configuration fit the runner's own to them: a `containers.conf`
      # drop-in names the pinned build's conmon, OCI runtimes, init
      # (catatonit) and helpers (netavark, pasta, rootlessport), which would
      # otherwise resolve to the runner image's copies, found first on the
      # default search paths, and a `storage.conf` keeps the store in the user's
      # home, where without one this podman takes the `graphroot` of the
      # runner's `/usr/share/containers/storage.conf`, which only root can
      # write. The step fails unless podman reports the pinned version, and
      # the log names what it runs with -- the buildah it carries and every
      # runtime piece, by path and version -- which is what the suite's
      # podman and pasta workarounds name as their removal conditions.
      - name: Podman
        if: steps.scope.outputs.scope != 'stack-files'
        timeout-minutes: 5
        run: |
          set -euo pipefail
          expected=$(mise current github:mgoltzsche/podman-static)
          # The archive's tree under its `usr/local`, wherever mise unpacked it.
          build=$(dirname "$(dirname "$(mise which podman)")")
          # Ubuntu admits an unprivileged user namespace only to a program an
          # AppArmor profile names, and the runner's podman profile names
          # `/usr/bin/podman` alone, so with the restriction on, the pinned
          # podman fails its re-exec into the rootless namespace (`failed to
          # reexec: Permission denied`). The runner is a VM this job alone
          # uses, and the restriction is lifted on it for every program.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          mkdir -p ~/.config/containers/containers.conf.d
          cat >~/.config/containers/containers.conf.d/50-pinned-podman.conf <<EOF
          [containers]
          init_path = "$build/lib/podman/catatonit"

          [engine]
          helper_binaries_dir = ["$build/lib/podman", "$build/libexec/podman", "$build/bin"]
          conmon_path = ["$build/lib/podman/conmon"]

          [engine.runtimes]
          crun = ["$build/bin/crun"]
          runc = ["$build/bin/runc"]
          EOF
          cat >~/.config/containers/storage.conf <<EOF
          [storage]
          driver = "overlay"
          graphroot = "$HOME/.local/share/containers/storage"
          runroot = "$XDG_RUNTIME_DIR/containers"
          EOF
          mise x -- podman info --format json | mise x -- jq '{podman: .version.Version, buildah: .host.buildahVersion, conmon: .host.conmon, ociRuntime: (.host.ociRuntime | {name, path, version}), network: .host.networkBackendInfo, pasta: .host.pasta, rootlessNetworkCmd: .host.rootlessNetworkCmd, cgroupManager: .host.cgroupManager, eventLogger: .host.eventLogger, graphDriver: .store.graphDriverName}'
          found=$(mise x -- podman info --format '{{.Version.Version}}')
          if [ "$found" != "$expected" ]; then
            echo "::error::podman is $found, and mise.ci.toml pins $expected"
            exit 1
          fi
          pin=$(mise x uv -- uv run appliance-image postgres)
          read -r repository tag digest <<<"$pin"
          echo "pulling $repository:$tag@$digest from mirror.gcr.io"
          id=$(mise x -- podman pull --quiet "mirror.gcr.io/${repository#docker.io/}@$digest")
          mise x -- podman tag "$id" "$repository:$tag"
          pin=$(mise x uv -- uv run appliance-image pgbouncer)
          read -r repository tag digest <<<"$pin"
          echo "pulling $repository:$tag@$digest"
          id=$(mise x -- podman pull --quiet "$repository@$digest")
          mise x -- podman tag "$id" "$repository:$tag"

      # A hung case fails by name under the per-case bound `pyproject.toml`
      # configures; the outer `timeout` is the hang guard for what that
      # cannot reach, an order of magnitude above the run so that the
      # ordinary run never meets it (framework/testing.md §1). The step's own
      # bound sits above that outer one, so the hang that one can catch is
      # reported by it. Under `stack-files` the run is the cases marked
      # `stack_files`, every case that reads a committed stack file
      # (framework/testing.md §2), under the same bounds.
      - name: Tests
        timeout-minutes: 30
        env:
          SCOPE: ${{ steps.scope.outputs.scope }}
        run: |
          if [ "$SCOPE" = stack-files ]; then
            timeout 1200 mise x -- uv run pytest -q -m stack_files
          else
            timeout 1200 mise x -- uv run pytest -q
          fi

      # Renovate can bump a pinned version but cannot recompute its digest;
      # this is what stops a stale hash from reaching the appliance.
      - name: Pinned artifacts
        if: steps.scope.outputs.scope != 'stack-files'
        timeout-minutes: 5
        run: mise x uv -- uv run state-backend pins

      # The prose gate AGENTS.md describes, run the way it says: the two word
      # lists under `.vscode/` become one client configuration, which
      # `ltex-config` writes (the checker reads neither list on its own, and a
      # reference to a list file is silently dropped, so the words go in
      # whole), and the checker is handed one file per invocation, because a
      # batch large enough stops making progress and dies at the bound
      # instead of finishing -- the cost of the serial form, and why batching
      # is not the way out of it, are in framework/ci.md §3. Only the
      # markdown the event changed is checked --
      # at several seconds a file, the whole tree is minutes, and a file the
      # change did not touch says nothing about the change. Deleted files are
      # left out (`--diff-filter=d`) since there is nothing to read. So are
      # the generated SDKs under `sdks/`, whichever way the files are chosen:
      # their markdown is their generator's text, regenerated as it was
      # written, so it is no more this repository's prose to reword than
      # their code is its to annotate -- the directory basedpyright and ruff
      # exclude for the same reason.
      #
      # A step inside this job rather than a job of its own: branch protection
      # requires the context `checks` by name (`REQUIRED_CHECKS` in the
      # `github` stack), so a separate job would report and never block.
      #
      # The step's own bound sits above a whole-tree pass, the longest a
      # healthy run of it gets, with room for files that stall and are
      # killed at the per-file bound below.
      - name: Prose
        timeout-minutes: 60
        env:
          # push: the commit `main` moved from. PR: the checkout is GitHub's
          # merge of the head into `main`, so its first parent is the `main`
          # the change is being merged onto. Not `pull_request.base.sha`,
          # which is `main` as of the pull request's creation and never
          # moves, so the range below would grow by whatever `main` gained
          # since.
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
          # The launcher takes `JAVA_HOME` before the Java the archive
          # bundles, and the runner image sets it to a Java 17 that cannot
          # load the checker's class files (compiled for 21). Empty, the
          # launcher falls back to the bundled runtime and never consults
          # the `java` on PATH.
          JAVA_HOME: ''
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/ltex.json"
          mise x uv -- uv run ltex-config "$config"

          # No base to diff against (a freshly created branch) means every
          # markdown file in the tree, and so does a change to the machinery:
          # every file, other than the prose it judges, that decides which
          # checker runs or what it is configured with -- today its pin and
          # lock, the word lists, the script that writes its configuration,
          # and this workflow. A bumped checker or a dropped dictionary word is
          # then proven against the prose it judges, not landed unchecked for
          # the next change to an affected file to fail on.
          machinery=(mise.toml mise.lock .vscode/ltex.dictionary.en-US.txt .vscode/ltex.disabledRules.en-US.txt src/kluster/scripts/ltex_config.py .github/workflows/checks.yml)
          generated=(':(exclude)sdks/')
          if git cat-file -e "${BASE:-none}^{commit}" 2>/dev/null \
             && [ -z "$(git diff --name-only "$BASE...HEAD" -- "${machinery[@]}")" ]; then
            files=$(git diff --name-only --diff-filter=d "$BASE...HEAD" -- '*.md' "${generated[@]}")
          else
            files=$(git ls-files -- '*.md' "${generated[@]}")
          fi
          [ -n "$files" ] || { echo 'no markdown changed'; exit 0; }

          # A checker that hangs on one file is killed at this bound and
          # named, rather than holding the required check pending until the
          # step's own bound fails it without saying which file; a file takes
          # seconds.
          #
          # What the kill costs the reader is the file's name: findings carry
          # their path, a kill carries nothing, and the fold it happened
          # inside is closed. So the two are told apart by exit code -- 124 is
          # `timeout`'s and nothing else's -- and the timeout branch prints
          # the file and the elapsed seconds on one line outside the fold,
          # as an annotation so it also reaches the run summary. `limit` is
          # read by the bound and by the message, so the two cannot drift.
          #
          # A kill is retried once, on that file alone and under the same
          # bound: the checker has been seen past the bound on a file it checks
          # in under 20 seconds, with nothing changed (kluster-ops#465). A
          # retry that passes prints its own duration, which is what tells a
          # slow file from a stalled checker. A second kill fails the step
          # naming the file; any other exit, a finding or the checker failing,
          # is its verdict and is not retried.
          limit=120
          status=0
          check() {
            echo "::group::$1$2"
            started=$SECONDS
            rc=0
            timeout "$limit" mise x -- ltex-cli-plus --client-configuration="$config" "$1" || rc=$?
            echo '::endgroup::'
            elapsed=$((SECONDS - started))
          }
          while IFS= read -r file; do
            check "$file" ''
            if [ "$rc" -eq 124 ]; then
              echo "::warning file=$file::ltex-cli-plus timed out on $file after ${elapsed}s (bound ${limit}s); retrying it once"
              check "$file" ' (retry)'
              if [ "$rc" -eq 124 ]; then
                echo "::error file=$file::ltex-cli-plus timed out on $file again after ${elapsed}s (bound ${limit}s)"
              elif [ "$rc" -eq 0 ]; then
                echo "::notice file=$file::ltex-cli-plus passed $file on retry after ${elapsed}s"
              fi
            fi
            [ "$rc" -eq 0 ] || status=$rc
          done <<<"$files"
          exit "$status"

  # The alert job (framework/ci.md §3); its playbook is §3.1 there.
  alert:
    needs: [checks]
    if: always() && github.event_name != 'pull_request' && contains(needs.*.result, 'failure')
    uses: ./.github/workflows/alert.yml
    with:
      tier: actionable
      summary: checks failed on main
      playbook: docs/framework/ci.md §3.1
    secrets:
      dispatch-app-private-key: ${{ secrets.DISPATCH_APP_PRIVATE_KEY }}

name: checks

# Everything that can be judged without touching the cloud: formatting, lint,
# types, unit tests, the appliance's pinned digests, and the prose of the
# markdown a change touches. The checks read no secret, so they run for forks
# too; the one job that does -- `alert`, on a red push to `main` -- never runs
# for a pull request.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The prose step diffs against the base commit, which a shallow
          # clone does not have.
          fetch-depth: 0

      - uses: jdx/mise-action@v3
        with:
          # Pinned like every tool `mise.toml` manages, and for the same
          # reason (framework/ci.md §3). This is the action's own input, and
          # the one renovate bumps.
          version: 2026.9.1
          experimental: true

      - name: Install dependencies
        run: mise x uv -- uv sync --locked

      - name: Format
        run: mise x uv -- uv run ruff format --check .

      - name: Lint
        run: mise x uv -- uv run ruff check .

      - name: Types
        run: mise x uv -- uv run basedpyright

      # The source layout is a set of layers, and nothing else notices when
      # one of them reaches upwards: a wrong import type-checks and passes
      # its tests. The contract is in `pyproject.toml`.
      - name: Imports
        run: mise x uv -- uv run lint-imports

      # A hung case fails by name under the per-case bound `pyproject.toml`
      # configures; the outer `timeout` is the hang guard for what that
      # cannot reach, an order of magnitude above the run so that the
      # ordinary run never meets it (framework/testing.md §1).
      - name: Tests
        run: timeout 1200 mise x -- uv run pytest -q

      # Renovate can bump a pinned version but cannot recompute its digest;
      # this is what stops a stale hash from reaching the appliance.
      - name: Pinned artifacts
        run: mise x uv -- uv run state-backend pins

      # The prose gate AGENTS.md describes, run the way it says: the two word
      # lists under `.vscode/` become one client configuration (the checker
      # reads neither list on its own, and a reference to a list file is
      # silently dropped, so the words go in whole), and the checker is handed
      # one file per invocation, because a batch large enough stops making
      # progress and dies at the bound instead of finishing -- the cost of
      # the serial form, and why batching is not the way out of it, are in
      # framework/ci.md §3. Only the markdown the event changed is checked --
      # at several seconds a file, the whole tree is minutes, and a file the
      # change did not touch says nothing about the change. Deleted files are
      # left out (`--diff-filter=d`) since there is nothing to read.
      #
      # A step inside this job rather than a job of its own: branch protection
      # requires the context `checks` by name (`REQUIRED_CHECKS` in the
      # `github` stack), so a separate job would report and never block.
      - name: Prose
        env:
          # push: the commit `main` moved from. PR: the checkout is GitHub's
          # merge of the head into `main`, so its first parent is the `main`
          # the change is being merged onto. Not `pull_request.base.sha`,
          # which is `main` as of the pull request's creation and never
          # moves, so the range below would grow by whatever `main` gained
          # since.
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
          # The launcher takes `JAVA_HOME` before the Java the archive
          # bundles, and the runner image sets it to a Java 17 that cannot
          # load the checker's class files (compiled for 21). Empty, the
          # launcher falls back to the bundled runtime and never consults
          # the `java` on PATH.
          JAVA_HOME: ''
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/ltex.json"
          python3 - "$config" <<'PY'
          import json, pathlib, sys
          words = lambda name: pathlib.Path(f'.vscode/ltex.{name}.en-US.txt').read_text().split()
          pathlib.Path(sys.argv[1]).write_text(json.dumps({
              'dictionary': {'en-US': words('dictionary')},
              'disabledRules': {'en-US': words('disabledRules')},
          }))
          PY

          # No base to diff against (a freshly created branch) means every
          # markdown file in the tree, and so does a change to what the
          # checker is or reads -- the pin, the two word lists, this
          # workflow: a bumped checker or a dropped dictionary word is proven
          # against the prose it judges, not landed unchecked for the next
          # change to an affected file to fail on.
          machinery=(mise.toml .vscode/ltex.dictionary.en-US.txt .vscode/ltex.disabledRules.en-US.txt .github/workflows/checks.yml)
          if git cat-file -e "${BASE:-none}^{commit}" 2>/dev/null \
             && [ -z "$(git diff --name-only "$BASE...HEAD" -- "${machinery[@]}")" ]; then
            files=$(git diff --name-only --diff-filter=d "$BASE...HEAD" -- '*.md')
          else
            files=$(git ls-files -- '*.md')
          fi
          [ -n "$files" ] || { echo 'no markdown changed'; exit 0; }

          # A checker that hangs must fail the step rather than hold the
          # required check pending for the job's six-hour default; a file
          # takes seconds.
          #
          # What the kill costs the reader is the file's name: findings carry
          # their path, a kill carries nothing, and the fold it happened
          # inside is closed. So the two are told apart by exit code -- 124 is
          # `timeout`'s and nothing else's -- and the timeout branch prints
          # the file and the elapsed seconds on one line outside the fold,
          # as an annotation so it also reaches the run summary. `limit` is
          # read by the bound and by the message, so the two cannot drift.
          limit=120
          status=0
          while IFS= read -r file; do
            echo "::group::$file"
            started=$SECONDS
            rc=0
            timeout "$limit" mise x -- ltex-cli-plus --client-configuration="$config" "$file" || rc=$?
            echo '::endgroup::'
            if [ "$rc" -eq 124 ]; then
              echo "::error file=$file::ltex-cli-plus timed out on $file after $((SECONDS - started))s (bound ${limit}s)"
            fi
            [ "$rc" -eq 0 ] || status=$rc
          done <<<"$files"
          exit "$status"

  # The alert job (framework/ci.md §3); its playbook is §3.1 there.
  alert:
    needs: [checks]
    if: always() && github.event_name != 'pull_request' && contains(needs.*.result, 'failure')
    uses: ./.github/workflows/alert.yml
    with:
      tier: actionable
      summary: checks failed on main
      playbook: docs/framework/ci.md §3.1
    secrets:
      dispatch-app-private-key: ${{ secrets.DISPATCH_APP_PRIVATE_KEY }}

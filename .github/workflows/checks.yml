name: checks

# Everything that can be judged without touching the cloud: formatting, lint,
# types, unit tests, the appliance's pinned digests, and the prose of the
# markdown a change touches. The checks read no secret, so they run for forks
# too; the one job that does -- `alert`, on a red push to `main` -- never runs
# for a pull request.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-26.04
    # Every step carries a bound of its own, so a hung step fails by name and
    # the alert below fires for it. This one is the sum of theirs, a `uses:`
    # step twice for its `post` phase, plus five minutes for the runner's own
    # phases -- a backstop for what no step bound reaches (framework/ci.md §3).
    timeout-minutes: 155
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        timeout-minutes: 5
        with:
          # The prose step diffs against the base commit, which a shallow
          # clone does not have.
          fetch-depth: 0

      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        timeout-minutes: 5
        with:
          # Pinned like every tool `mise.toml` manages, and for the same
          # reason (framework/ci.md §3). This is the action's own input, and
          # the one renovate bumps.
          version: 2026.9.14
          experimental: true

      # The log names the interpreter every step after this one runs -- the
      # build uv installs for `.python-version` -- and the OpenSSL that build
      # carries, which is what every TLS connection a job's Python makes runs
      # on.
      - name: Install dependencies
        timeout-minutes: 5
        run: |
          set -euo pipefail
          mise x uv -- uv sync --locked
          mise x uv -- uv run python -c 'import ssl, sys; print(sys.version, ssl.OPENSSL_VERSION)'

      - name: Format
        timeout-minutes: 5
        run: mise x uv -- uv run ruff format --check .

      - name: Lint
        timeout-minutes: 5
        run: mise x uv -- uv run ruff check .

      - name: Types
        timeout-minutes: 10
        run: mise x uv -- uv run basedpyright

      # The source layout is a set of layers, and nothing else notices when
      # one of them reaches upwards: a wrong import type-checks and passes
      # its tests. The contract is in `pyproject.toml`.
      - name: Imports
        timeout-minutes: 5
        run: mise x uv -- uv run lint-imports

      # `tests/test_state_roles.py` runs the appliance's Postgres roles in the
      # image the box runs, and skips where no copy of it is local rather
      # than fetch one mid-run; this step makes it local, so those cases run
      # on every event (framework/ci.md §3). The name is read from
      # `settings.POSTGRES_IMAGE`, the one place it is pinned. That pin is a
      # tag with no digest -- the major line the box's own podman-auto-update
      # follows -- so the tag is resolved to its digest here.
      #
      # Docker Hub limits anonymous pulls per address, and a runner's address
      # is shared, so the image is pulled from Google's mirror of Docker Hub
      # instead: by the digest Docker Hub itself names for the tag, read with
      # a HEAD request, which Docker Hub does not count against the limit.
      # The mirror therefore serves exactly Docker Hub's image or the pull
      # fails, and the image is then tagged with the name the program uses.
      #
      # The log names the podman the module runs on and the buildah it
      # carries, which is what the module's podman workarounds name as their
      # removal conditions.
      - name: Podman
        timeout-minutes: 5
        run: |
          set -euo pipefail
          podman info --format 'podman {{.Version.Version}}, buildah {{.Host.BuildahVersion}}, rootless network {{.Host.RootlessNetworkCmd}}'
          image=$(mise x uv -- uv run python -c 'from kluster.lib.state_backend import settings; print(settings.POSTGRES_IMAGE)')
          repository=${image#docker.io/}; repository=${repository%:*}; tag=${image##*:}
          token=$(curl -fsS "https://auth.docker.io/token?service=registry.docker.io&scope=repository:$repository:pull" | mise x -- jq -r .token)
          digest=$(curl -fsSI -H "Authorization: Bearer $token" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
            "https://registry-1.docker.io/v2/$repository/manifests/$tag" | tr -d '\r' | awk 'tolower($1) == "docker-content-digest:" {print $2}')
          test -n "$digest"
          echo "$image is $digest on Docker Hub; pulling it from mirror.gcr.io"
          id=$(podman pull --quiet "mirror.gcr.io/$repository@$digest")
          podman tag "$id" "$image"

      # A hung case fails by name under the per-case bound `pyproject.toml`
      # configures; the outer `timeout` is the hang guard for what that
      # cannot reach, an order of magnitude above the run so that the
      # ordinary run never meets it (framework/testing.md §1). The step's own
      # bound sits above that outer one, so the hang that one can catch is
      # reported by it.
      - name: Tests
        timeout-minutes: 30
        run: timeout 1200 mise x -- uv run pytest -q

      # Renovate can bump a pinned version but cannot recompute its digest;
      # this is what stops a stale hash from reaching the appliance.
      - name: Pinned artifacts
        timeout-minutes: 5
        run: mise x uv -- uv run state-backend pins

      # The prose gate AGENTS.md describes, run the way it says: the two word
      # lists under `.vscode/` become one client configuration (the checker
      # reads neither list on its own, and a reference to a list file is
      # silently dropped, so the words go in whole), and the checker is handed
      # one file per invocation, because a batch large enough stops making
      # progress and dies at the bound instead of finishing -- the cost of
      # the serial form, and why batching is not the way out of it, are in
      # framework/ci.md §3. Only the markdown the event changed is checked --
      # at several seconds a file, the whole tree is minutes, and a file the
      # change did not touch says nothing about the change. Deleted files are
      # left out (`--diff-filter=d`) since there is nothing to read. So are
      # the generated SDKs under `sdks/`, whichever way the files are chosen:
      # their markdown is their generator's text, regenerated as it was
      # written, so it is no more this repository's prose to reword than
      # their code is its to annotate -- the directory basedpyright and ruff
      # exclude for the same reason.
      #
      # A step inside this job rather than a job of its own: branch protection
      # requires the context `checks` by name (`REQUIRED_CHECKS` in the
      # `github` stack), so a separate job would report and never block.
      #
      # The step's own bound sits above a whole-tree pass, the longest a
      # healthy run of it gets, with room for files that stall and are
      # killed at the per-file bound below.
      - name: Prose
        timeout-minutes: 60
        env:
          # push: the commit `main` moved from. PR: the checkout is GitHub's
          # merge of the head into `main`, so its first parent is the `main`
          # the change is being merged onto. Not `pull_request.base.sha`,
          # which is `main` as of the pull request's creation and never
          # moves, so the range below would grow by whatever `main` gained
          # since.
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
          # The launcher takes `JAVA_HOME` before the Java the archive
          # bundles, and the runner image sets it to a Java 17 that cannot
          # load the checker's class files (compiled for 21). Empty, the
          # launcher falls back to the bundled runtime and never consults
          # the `java` on PATH.
          JAVA_HOME: ''
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/ltex.json"
          python3 - "$config" <<'PY'
          import json, pathlib, sys
          words = lambda name: pathlib.Path(f'.vscode/ltex.{name}.en-US.txt').read_text().split()
          pathlib.Path(sys.argv[1]).write_text(json.dumps({
              'dictionary': {'en-US': words('dictionary')},
              'disabledRules': {'en-US': words('disabledRules')},
          }))
          PY

          # No base to diff against (a freshly created branch) means every
          # markdown file in the tree, and so does a change to what the
          # checker is or reads -- the pin, the two word lists, this
          # workflow: a bumped checker or a dropped dictionary word is proven
          # against the prose it judges, not landed unchecked for the next
          # change to an affected file to fail on.
          machinery=(mise.toml .vscode/ltex.dictionary.en-US.txt .vscode/ltex.disabledRules.en-US.txt .github/workflows/checks.yml)
          generated=(':(exclude)sdks/')
          if git cat-file -e "${BASE:-none}^{commit}" 2>/dev/null \
             && [ -z "$(git diff --name-only "$BASE...HEAD" -- "${machinery[@]}")" ]; then
            files=$(git diff --name-only --diff-filter=d "$BASE...HEAD" -- '*.md' "${generated[@]}")
          else
            files=$(git ls-files -- '*.md' "${generated[@]}")
          fi
          [ -n "$files" ] || { echo 'no markdown changed'; exit 0; }

          # A checker that hangs on one file is killed at this bound and
          # named, rather than holding the required check pending until the
          # step's own bound fails it without saying which file; a file takes
          # seconds.
          #
          # What the kill costs the reader is the file's name: findings carry
          # their path, a kill carries nothing, and the fold it happened
          # inside is closed. So the two are told apart by exit code -- 124 is
          # `timeout`'s and nothing else's -- and the timeout branch prints
          # the file and the elapsed seconds on one line outside the fold,
          # as an annotation so it also reaches the run summary. `limit` is
          # read by the bound and by the message, so the two cannot drift.
          #
          # A kill is retried once, on that file alone and under the same
          # bound: the checker has been seen past the bound on a file it checks
          # in under 20 seconds, with nothing changed (kluster-ops#465). A
          # retry that passes prints its own duration, which is what tells a
          # slow file from a stalled checker. A second kill fails the step
          # naming the file; any other exit, a finding or the checker failing,
          # is its verdict and is not retried.
          limit=120
          status=0
          check() {
            echo "::group::$1$2"
            started=$SECONDS
            rc=0
            timeout "$limit" mise x -- ltex-cli-plus --client-configuration="$config" "$1" || rc=$?
            echo '::endgroup::'
            elapsed=$((SECONDS - started))
          }
          while IFS= read -r file; do
            check "$file" ''
            if [ "$rc" -eq 124 ]; then
              echo "::warning file=$file::ltex-cli-plus timed out on $file after ${elapsed}s (bound ${limit}s); retrying it once"
              check "$file" ' (retry)'
              if [ "$rc" -eq 124 ]; then
                echo "::error file=$file::ltex-cli-plus timed out on $file again after ${elapsed}s (bound ${limit}s)"
              elif [ "$rc" -eq 0 ]; then
                echo "::notice file=$file::ltex-cli-plus passed $file on retry after ${elapsed}s"
              fi
            fi
            [ "$rc" -eq 0 ] || status=$rc
          done <<<"$files"
          exit "$status"

  # The alert job (framework/ci.md §3); its playbook is §3.1 there.
  alert:
    needs: [checks]
    if: always() && github.event_name != 'pull_request' && contains(needs.*.result, 'failure')
    uses: ./.github/workflows/alert.yml
    with:
      tier: actionable
      summary: checks failed on main
      playbook: docs/framework/ci.md §3.1
    secrets:
      dispatch-app-private-key: ${{ secrets.DISPATCH_APP_PRIVATE_KEY }}

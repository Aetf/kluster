name: preview

# Per-layer previews for a PR, in parallel (previews mutate nothing). They only
# ever report: whether a PR may merge unattended is noop-automerge's decision.
#
# `physical` has no PR preview by design (framework/ci.md §3): its credentials
# can root the gateway, so they are main-only. A physical change is reviewed as
# code here, and its resource diff is read in plan-physical's output on main —
# that reading is the approval moment.
#
# No preview here joins the overlay: a `dns` preview without `--refresh` dials
# nothing over it, and `k8s-base` and `apps` reach nothing on the LAN. The join
# action is proved by `join (dns)`, under the `dns` identity's inputs, on a
# change to `.github/` (framework/ci.md §2).
#
# `pull_request`, never `pull_request_target`: a preview executes the PR's
# Python with provider credentials, so fork PRs must not get secrets.

on:
  pull_request:
    branches: [main]

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  changes:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      # The filter's own JSON array of matching names, which is the shape the
      # matrix below needs: a job-level `if` cannot read the `matrix` context
      # at all (it is not in scope there), so selecting stacks has to happen
      # by building the matrix rather than by filtering it afterwards.
      stacks: ${{ steps.filter.outputs.changes }}
      # Whether the change touches what the join proof below exercises. A
      # filter of its own, so that its name never lands in `stacks`.
      join: ${{ steps.join.outputs.join }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # Path filtering saves job setup, nothing more, so it is a deny-list:
      # a preview that should have run and did not is invisible (the job is
      # skipped, and a skipped job is green), while a preview that runs
      # needlessly costs a minute and no-ops internally. An allow-list gets
      # this backwards -- every new file defaults to being missed, which is
      # how `config.py` and the stack dispatch came to match nothing.
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          # A deny-list is only a deny-list under `every`. The action's
          # default quantifier is `some` -- a file matches when *any* pattern
          # does -- and under it an all-negation list matches everything
          # there is: `docs/framework/ci.md` fails `!docs/**` and `!**/*.md`
          # but clears `!.vscode/**`, which is one match and therefore a hit.
          # `every` asks the question the list is written to ask: is this
          # file none of the inert kinds?
          #
          # `checkpoints/` is the committed state of the operator stacks whose
          # state lives in this repository (framework/pulumi.md §3.3). No stack
          # this matrix previews reads it, and no CI job runs the stacks that do.
          predicate-quantifier: every
          filters: |
            dns: &code
              - '!docs/**'
              - '!**/*.md'
              - '!.vscode/**'
              - '!.gitignore'
              - '!checkpoints/**'
            k8s-base: *code
            apps: *code
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: join
        with:
          # The join action, the release it pins, the runner labels the jobs
          # that join run on: all of it is under `.github/`. A change to the
          # flow rules or the roster can break a join too, and only a run on
          # `main` proves that one (framework/ci.md §2).
          filters: |
            join:
              - '.github/**'

  preview:
    needs: changes
    # An empty matrix is not an error but it is also not a job, and a matrix
    # built from an empty array would be one -- so the whole job stands down
    # when nothing matched.
    if: needs.changes.outputs.stacks != '[]'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJSON(needs.changes.outputs.stacks) }}
    # Per-stack Environments are the credential partition: the dns job sees
    # only the Cloudflare token, apps never holds the UDM key.
    environment: ${{ matrix.stack }}
    # No entry joins the overlay: a `dns` preview without `--refresh` dials
    # nothing over it, and `k8s-base` and `apps` reach nothing on the LAN, so no
    # entry waits on the gateway or holds an identity's lock (framework/ci.md
    # §2).
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          # Pinned like every tool `mise.toml` manages, and for the same
          # reason (framework/ci.md §3). This is the action's own input, and
          # the one renovate bumps.
          version: 2026.10.5
          experimental: true

      - run: mise x uv -- uv sync --locked

      - uses: ./.github/actions/state-backend
        with:
          url: ${{ secrets.PULUMI_BACKEND_URL }}
          ca: ${{ secrets.PULUMI_BACKEND_CA }}
          certificate: ${{ secrets.PULUMI_BACKEND_CERT }}
          key: ${{ secrets.PULUMI_BACKEND_KEY }}

      # Before the program runs, with the job's token, and that token in
      # this step alone: deploy.yml's `plan-physical` says why
      # (framework/ci.md §3).
      - name: Install plugins
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise x -- pulumi plugin install

      - name: Preview
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        run: mise x -- pulumi preview --stack ${{ matrix.stack }} --diff

  # The join proof: the one job a pull request runs that joins the overlay, and
  # it runs nothing but the join. It proves the join action under the `dns`
  # identity's inputs, the one identity a pull request may name, and waits as
  # `up-dns` does; `physical`'s join is first exercised by `plan-physical` on
  # `main` (framework/ci.md §2).
  join:
    name: join (dns)
    needs: changes
    if: needs.changes.outputs.join == 'true'
    runs-on: ubuntu-26.04
    # The sum of its steps' bounds, a `uses:` step twice, plus five minutes
    # for the runner's own phases: a backstop for what no step bound reaches
    # (framework/ci.md §3).
    timeout-minutes: 25
    environment: dns
    # The identity is live in one job at a time, and a group it shares with
    # the merge chain delays this job rather than cancelling it, or being
    # cancelled by it (framework/ci.md §2).
    concurrency:
      group: zt-dns
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        timeout-minutes: 5
      - uses: ./.github/actions/zerotier
        timeout-minutes: 5
        with:
          network_id: ${{ secrets.ZEROTIER_NETWORK_ID }}
          identity: ${{ secrets.ZEROTIER_IDENTITY }}
          # `up-dns`'s routes and wait: the two resolver APIs, reached through
          # the gateway by routes this run installs for itself, and the first
          # to answer ends the join (framework/ci.md §2).
          routes: |
            10.0.5.3/32 via 10.144.1.1
            10.0.5.4/32 via 10.144.1.1
          wait_for_any: '10.0.5.3:80 10.0.5.4:80'

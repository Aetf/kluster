name: preview

# Per-layer previews for a PR, in parallel (previews mutate nothing). They only
# ever report: whether a PR may merge unattended is noop-automerge's decision.
#
# `physical` has no PR preview by design (framework/ci.md §3): its credentials
# can root the gateway, so they are main-only. A physical change is reviewed as
# code here, and its resource diff is read in plan-physical's output on main —
# that reading is the approval moment.
#
# `pull_request`, never `pull_request_target`: a preview executes the PR's
# Python with provider credentials, so fork PRs must not get secrets.

on:
  pull_request:
    branches: [main]

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      # The filter's own JSON array of matching names, which is the shape the
      # matrix below needs: a job-level `if` cannot read the `matrix` context
      # at all (it is not in scope there), so selecting stacks has to happen
      # by building the matrix rather than by filtering it afterwards.
      stacks: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v5
      # Path filtering saves job setup, nothing more, so it is a deny-list:
      # a preview that should have run and did not is invisible (the job is
      # skipped, and a skipped job is green), while a preview that runs
      # needlessly costs a minute and no-ops internally. An allow-list gets
      # this backwards -- every new file defaults to being missed, which is
      # how `config.py` and the stack dispatch came to match nothing.
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            dns: &code
              - '!docs/**'
              - '!**/*.md'
              - '!.vscode/**'
              - '!.gitignore'
            k8s-base: *code
            apps: *code

  preview:
    needs: changes
    # An empty matrix is not an error but it is also not a job, and a matrix
    # built from an empty array would be one -- so the whole job stands down
    # when nothing matched.
    if: needs.changes.outputs.stacks != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: ${{ fromJSON(needs.changes.outputs.stacks) }}
    # Per-stack Environments are the credential partition: the dns job sees
    # only the Cloudflare token, apps never holds the UDM key.
    environment: ${{ matrix.stack }}
    # The dns preview joins ZeroTier with the dns environment's identity, and
    # ZeroTier maps a member to one endpoint at a time, so it must never be
    # live in two jobs at once — including two pull requests' previews, and
    # including a deploy or drift job elsewhere in the repository. A shared
    # `zt-dns` group is that lock; every other stack keeps a per-run key so it
    # is serialized against nothing (framework/ci.md §2). Unlike a job-level
    # `if`, a job-level `concurrency` may read the matrix context.
    concurrency:
      group: ${{ matrix.stack == 'dns' && 'zt-dns' || format('preview-{0}-{1}', github.ref, matrix.stack) }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: jdx/mise-action@v3
        with:
          experimental: true

      - run: mise x uv -- uv sync --locked

      # Only dns touches the LAN (the AdGuard rewrites live on the UDM).
      - name: Join ZeroTier
        if: matrix.stack == 'dns'
        uses: ./.github/actions/zerotier
        with:
          network_id: ${{ secrets.ZEROTIER_NETWORK_ID }}
          identity: ${{ secrets.ZEROTIER_IDENTITY }}

      - uses: ./.github/actions/state-backend
        with:
          url: ${{ secrets.PULUMI_BACKEND_URL }}
          ca: ${{ secrets.PULUMI_BACKEND_CA }}
          certificate: ${{ secrets.PULUMI_BACKEND_CERT }}
          key: ${{ secrets.PULUMI_BACKEND_KEY }}

      - name: Preview
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        run: mise x -- pulumi preview --stack ${{ matrix.stack }} --diff

name: images

# Builds (PRs) and publishes (main) the self-built images in docker/ — the CNPG
# operands, emailproxy, golinks (framework/ci.md §4). The loop around it: a
# `.conf` per image holds its build args and its tag, renovate bumps the
# version in that file, noop-automerge merges the bump once the preview proves
# a zero diff, this workflow publishes the ghcr tag, and a consumer's renovate
# then opens the *deploy* PR against its pin — under a versioning that ignores
# the tag's fingerprint (framework/ci.md §4); a rebuild under an unchanged
# version is moved to by hand. Publishing is where this workflow stops — it
# never deploys.
#
# A published tag is never pushed again. The tag carries a fingerprint of what
# the image is built from (the image-conf action), so a change to that moves
# the tag and a comment edit does not, and a push run whose tag the registry
# already serves builds and pushes nothing for that image.
#
# Multi-arch is mandatory (the cloud pool is arm64) and is done by building
# each architecture on its own native runner and stitching a manifest, never by
# qemu: emulation multiplies the cost of every `RUN` step, while on a native
# runner the arm64 build costs what the amd64 one does -- the vchord operand
# installs its two extensions as prebuilt per-architecture packages and
# compiles nothing. Free `ubuntu-24.04-arm` runners are a public-repo feature,
# which this repo has been since 2026-08-25.
#
# A run that fails outside a pull request raises an `actionable` alert through
# the producer (`alert.yml`), by framework/ci.md §3's rule.

on:
  push:
    branches: [main]
    paths: &images
      - 'docker/**'
      - '.github/workflows/images.yml'
      - '.github/actions/image-conf/**'
  pull_request:
    branches: [main]
    paths: *images
  workflow_dispatch:

# Renovate rebases push in quick succession; don't stack stale runs. A running
# push to main is not canceled — an interrupted publish would leave a manifest
# half stitched — but a waiting one is, by the next push to queue behind it,
# which is why a push selects every image (select-images).
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  # A job name is a check-run name, and branch protection requires the
  # context `changes` by name — preview.yml's job, which reports on every
  # pull request because that trigger carries no `paths:` filter
  # (framework/ci.md §5). This workflow's trigger is filtered, so naming
  # this job `changes` too would fill that one required context with a
  # second run on the pull requests that touch `docker/**` alone.
  select-images:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      # A JSON array of docker/*.Containerfile basenames, which is the shape
      # the matrices below need: a job-level `if` cannot read the `matrix`
      # context at all, so selecting images has to happen by building the
      # matrix rather than by filtering it afterwards.
      images: ${{ steps.select.outputs.images }}
    steps:
      - uses: actions/checkout@v5
        with:
          # A pull request's selection diffs against the merge commit's first
          # parent, which a shallow clone does not have.
          fetch-depth: 0

      # A pull request builds the images whose own files it changes: a
      # published tag is a function of the image's own `.conf` and
      # `.Containerfile`, so an image it does not touch keeps the tag it has,
      # and building it would cost vchord's build time to prove nothing.
      #
      # Every other run -- a push to `main`, a dispatch -- selects every image,
      # and the image-conf action's published check skips each one the
      # registry already serves, at the cost of one registry read. A push
      # cannot narrow by its diff: the concurrency group keeps one run waiting
      # and a newer push cancels it, so an image changed only by the cancelled
      # run would never be selected by anyone, and nothing would say so.
      - name: Select the images to build
        id: select
        env:
          EVENT: ${{ github.event_name }}
          # On a pull request the checkout is GitHub's merge of the head into
          # `main`, so its first parent is the `main` the change is being
          # merged onto. Not `pull_request.base.sha`, which is `main` as of the
          # pull request's creation and never moves, so the diff below would
          # carry every file `main` gained since -- an image `main` changed
          # rebuilt on pull requests that never touched it.
          BASE: HEAD^1
        run: |
          set -euo pipefail
          all=$(find docker -maxdepth 1 -name '*.Containerfile' -printf '%f\n' 2>/dev/null \
            | sed 's/\.Containerfile$//' | sort || true)

          # Anything but a pull request builds everything, as does a pull
          # request with no base to diff against or one changing the build
          # machinery itself: that has to be proven against every image.
          if [ "$EVENT" != pull_request ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            picked=$all
          else
            changed=$(git diff --name-only "$BASE" HEAD)
            if grep -qE '^\.github/(workflows/images\.yml|actions/image-conf/)' <<<"$changed"; then
              picked=$all
            else
              picked=
              for image in $all; do
                if grep -q "^docker/$image\." <<<"$changed"; then
                  picked=$(printf '%s\n%s' "$picked" "$image")
                fi
              done
            fi
          fi

          echo "images=$(jq -cRn '[inputs | select(length > 0)]' <<<"$picked")" >> "$GITHUB_OUTPUT"

  build:
    needs: select-images
    # An empty matrix is not an error but it is also not a job, and a matrix
    # built from an empty array would be one — so the whole job stands down
    # when nothing matched.
    if: needs.select-images.outputs.images != '[]'
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.select-images.outputs.images) }}
        platform:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      # Before the conf step, which reads the registry: through the environment
      # and stdin, never on the command line, because a public repository's
      # process table is not the place for the token.
      - name: Log in to ghcr
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | buildah login -u "$REGISTRY_USER" --password-stdin ghcr.io

      - uses: ./.github/actions/image-conf
        id: conf
        with:
          image: ${{ matrix.image }}
          arch: ${{ matrix.platform.arch }}

      # A pull request builds regardless, because proving the recipe and the
      # machinery is what its run is for; a push builds only what it will
      # publish.
      - name: Build
        if: github.event_name == 'pull_request' || steps.conf.outputs.published != 'true'
        env:
          REF: ${{ steps.conf.outputs.ref }}
          ARGS_FILE: ${{ steps.conf.outputs.args-file }}
          ARCH: ${{ matrix.platform.arch }}
        run: |
          set -euo pipefail
          # TARGETARCH comes last so it wins over any value the conf carries:
          # the Containerfiles use it to pick an upstream .deb, and under
          # native builds the runner decides the architecture, not the file.
          buildah bud -f "docker/${{ matrix.image }}.Containerfile" \
            --build-arg-file "$ARGS_FILE" \
            --build-arg "TARGETARCH=$ARCH" \
            --annotation org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} \
            -t "$REF-$ARCH"

      # Per-architecture tags are published rather than kept as artifacts: the
      # manifest job runs on a different machine and stitches from the
      # registry. They stay visible next to the manifest, which is what makes a
      # half-published image obvious. The check reads the manifest, not these:
      # a run that pushed them and failed before stitching is retried by the
      # next one, which pushes them again from the same inputs.
      #
      # Only `main` publishes: a dispatch from a branch would publish an
      # unreviewed image under a well-formed tag, or -- with `main`'s files --
      # race `main`'s own run from another concurrency group and stitch the
      # same tag twice.
      - name: Publish the ${{ matrix.platform.arch }} image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.conf.outputs.published != 'true'
        env:
          REF: ${{ steps.conf.outputs.ref }}
          ARCH: ${{ matrix.platform.arch }}
        run: buildah push "$REF-$ARCH"

  manifest:
    needs: [select-images, build]
    # PR builds publish nothing, and only `main` publishes (the Publish step
    # above), so there is nothing to stitch anywhere else.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.select-images.outputs.images) }}
    steps:
      - uses: actions/checkout@v5

      - name: Log in to ghcr
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | buildah login -u "$REGISTRY_USER" --password-stdin ghcr.io

      - uses: ./.github/actions/image-conf
        id: conf
        with:
          image: ${{ matrix.image }}

      # The tag the cluster pins is this manifest, never one of the
      # per-architecture tags it lists.
      - name: Stitch the manifest
        if: steps.conf.outputs.published != 'true'
        env:
          REF: ${{ steps.conf.outputs.ref }}
        run: |
          set -euo pipefail
          buildah manifest create "$REF" \
            "docker://$REF-amd64" \
            "docker://$REF-arm64"
          buildah manifest push --all "$REF" "docker://$REF"

  # The alert job (framework/ci.md §3); its playbook is §3.1 there.
  alert:
    needs: [select-images, build, manifest]
    if: always() && github.event_name != 'pull_request' && contains(needs.*.result, 'failure')
    uses: ./.github/workflows/alert.yml
    with:
      tier: actionable
      summary: images failed
      playbook: docs/framework/ci.md §3.1
    secrets:
      dispatch-app-private-key: ${{ secrets.DISPATCH_APP_PRIVATE_KEY }}

name: deploy

# The merge chain (framework/ci.md §3). `up` performs its own preview, so
# there is no separate preview job — except for physical, whose apply sits
# behind an approval gate and therefore gets a plan first: a zero diff (the
# common case) skips the gated job entirely and the chain proceeds with no
# clicks, a real diff stalls the whole chain until a human reads it, and a
# plan that failed fails its job and stops the chain.

on:
  push:
    branches: [main]
  # Manual re-runs enter here. The weekly drift check is its own workflow
  # (drift.yml) — it previews, it never applies.
  workflow_dispatch:

# Serialized: one chain at a time, which state locking wants anyway. It is not
# by itself enough to keep a ZeroTier identity from being live twice — drift.yml
# joins with the same environments' identities — so every job that joins also
# takes a `zt-<domain>` group of its own (framework/ci.md §2).
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan-physical:
    runs-on: ubuntu-26.04
    # The sum of its steps' bounds, a `uses:` step twice, plus five minutes
    # for the runner's own phases: a backstop for what no step bound reaches
    # (framework/ci.md §3).
    timeout-minutes: 90
    # Ungated on purpose: reading the diff is the approval moment, so the
    # reading itself must not need approval.
    environment: physical-plan
    # Both physical environments are one ZeroTier domain: the plan and the
    # apply are meant to carry the same pre-authorized member, so they share a
    # key even though they are separate credential partitions.
    concurrency:
      group: zt-physical
      cancel-in-progress: false
    outputs:
      diff: ${{ steps.plan.outputs.diff }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        timeout-minutes: 5
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        timeout-minutes: 5
        with:
          # Pinned like every tool `mise.toml` manages, and for the same
          # reason (framework/ci.md §3). This is the action's own input, and
          # the one renovate bumps.
          version: 2026.10.5
          experimental: true
      - run: mise x uv -- uv sync --locked
        timeout-minutes: 5
      - uses: ./.github/actions/zerotier
        timeout-minutes: 5
        with:
          network_id: ${{ secrets.ZEROTIER_NETWORK_ID }}
          identity: ${{ secrets.ZEROTIER_IDENTITY }}
          # The gateway's shell, which the device-files push dials, and the
          # homelab host's, which the libvirt provider dials: the join waits
          # for both rather than racing the run's first packets to either,
          # and the gateway's readiness line is where physical/gateway.md
          # §2.4 reads items 4 and 7. Either one unreachable fails the job at
          # this step, naming it.
          wait_for: '10.144.1.1:22 10.144.180.10:22'
      - uses: ./.github/actions/state-backend
        timeout-minutes: 5
        with:
          url: ${{ secrets.PULUMI_BACKEND_URL }}
          ca: ${{ secrets.PULUMI_BACKEND_CA }}
          certificate: ${{ secrets.PULUMI_BACKEND_CERT }}
          key: ${{ secrets.PULUMI_BACKEND_KEY }}
      - name: Install plugins
        # Every plugin the program needs, installed before it runs rather
        # than fetched in the middle of the preview: with no arguments,
        # `pulumi plugin install` asks the language host for the set the
        # installed packages name, which is the set the preview resolves.
        # The talos provider's package names a `github://` server, which the
        # CLI reaches through GitHub's API; that API limits an
        # unauthenticated address, and a runner's address is shared, so the
        # step sends the job's own token, the one the CLI reads from
        # `GITHUB_TOKEN`. This step alone holds it: the github provider
        # takes `GITHUB_TOKEN` as its credential, so a step that runs the
        # program with it set would hand the token to any github provider
        # declared without one (framework/ci.md §3).
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise x -- pulumi plugin install
      - name: Plan
        timeout-minutes: 30
        id: plan
        env:
          # `physical`'s own passphrase, which only this Environment and
          # `physical` hold; the stack passphrase is in neither
          # (credentials.md §3).
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        # Three outcomes, read off the preview's exit: 0 is no change; 7 is
        # `--expect-no-changes` refusing the changes the preview proposed,
        # the code the CLI's exit-code table gives that refusal; anything
        # else is a preview that failed, which proposed no plan to read. That
        # one fails this job by name and writes no `diff`, so `up-physical`
        # never asks for approval on it, and every `up` job after it, each
        # gated on this one's success, stands down (framework/ci.md §3).
        run: |
          status=0
          mise x -- pulumi preview --stack physical --diff --expect-no-changes || status=$?
          case $status in
            0) echo 'diff=false' >> "$GITHUB_OUTPUT" ;;
            7) echo 'diff=true' >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::the physical preview failed (exit $status), so it proposed no plan to approve"
              exit "$status"
              ;;
          esac

  up-physical:
    needs: plan-physical
    if: needs.plan-physical.outputs.diff == 'true'
    runs-on: ubuntu-26.04
    # The sum of its steps' bounds, a `uses:` step twice, plus five minutes
    # for the runner's own phases: a backstop, since the `Up` step's bound
    # fires first and fails the job (framework/ci.md §3).
    timeout-minutes: 180
    # Reviewer-gated: this is the layer that can root the gateway.
    environment: physical
    concurrency:
      group: zt-physical
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        timeout-minutes: 5
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        timeout-minutes: 5
        with:
          # Pinned like every tool `mise.toml` manages, and for the same
          # reason (framework/ci.md §3). This is the action's own input, and
          # the one renovate bumps.
          version: 2026.10.5
          experimental: true
      - run: mise x uv -- uv sync --locked
        timeout-minutes: 5
      - uses: ./.github/actions/zerotier
        timeout-minutes: 5
        with:
          network_id: ${{ secrets.ZEROTIER_NETWORK_ID }}
          identity: ${{ secrets.ZEROTIER_IDENTITY }}
          # The gateway's shell and the homelab host's, as in `plan-physical`.
          wait_for: '10.144.1.1:22 10.144.180.10:22'
      - uses: ./.github/actions/state-backend
        timeout-minutes: 5
        with:
          url: ${{ secrets.PULUMI_BACKEND_URL }}
          ca: ${{ secrets.PULUMI_BACKEND_CA }}
          certificate: ${{ secrets.PULUMI_BACKEND_CERT }}
          key: ${{ secrets.PULUMI_BACKEND_KEY }}
      - name: Install plugins
        # Before the program runs, with the job's token, as in
        # `plan-physical`; that step says why the token is this step's alone.
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise x -- pulumi plugin install
      - name: Up
        # Killing an apply leaves its operations pending in the state, so the
        # bound sits far above a slow healthy apply. An apply that exceeds it
        # fails the job and `notify-failure` fires; framework/ci.md §3.3 is
        # what follows.
        timeout-minutes: 120
        env:
          # `physical`'s own passphrase, as in `plan-physical`.
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        run: mise x -- pulumi up --stack physical --yes --diff

  up-dns:
    needs: [plan-physical, up-physical]
    # A skipped gate job must not cascade-skip the chain, while any other
    # result -- failed, a timed-out apply included, or cancelled for whatever
    # reason -- stands for a physical apply that did not finish, and stops it.
    if: >-
      always() && needs.plan-physical.result == 'success'
      && (needs.up-physical.result == 'success' || needs.up-physical.result == 'skipped')
    runs-on: ubuntu-26.04
    # The sum of its steps' bounds, a `uses:` step twice, plus five minutes
    # for the runner's own phases: a backstop, since the `Up` step's bound
    # fires first and fails the job (framework/ci.md §3).
    timeout-minutes: 180
    environment: dns
    # Shared with every other job that joins on the dns environment's identity:
    # a preview, a noop-automerge proof, a drift check.
    concurrency:
      group: zt-dns
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        timeout-minutes: 5
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        timeout-minutes: 5
        with:
          # Pinned like every tool `mise.toml` manages, and for the same
          # reason (framework/ci.md §3). This is the action's own input, and
          # the one renovate bumps.
          version: 2026.10.5
          experimental: true
      - run: mise x uv -- uv sync --locked
        timeout-minutes: 5
      # The AdGuard rewrites are DNS and live on the UDM, so this stack
      # reaches the LAN (dns.md §3).
      - uses: ./.github/actions/zerotier
        timeout-minutes: 5
        with:
          network_id: ${{ secrets.ZEROTIER_NETWORK_ID }}
          identity: ${{ secrets.ZEROTIER_IDENTITY }}
          # The two resolver APIs, reached through the gateway by routes this
          # run installs for itself, and the first to answer ends the join
          # (framework/ci.md §2).
          routes: |
            10.0.5.3/32 via 10.144.1.1
            10.0.5.4/32 via 10.144.1.1
          wait_for_any: '10.0.5.3:80 10.0.5.4:80'
      - uses: ./.github/actions/state-backend
        timeout-minutes: 5
        with:
          url: ${{ secrets.PULUMI_BACKEND_URL }}
          ca: ${{ secrets.PULUMI_BACKEND_CA }}
          certificate: ${{ secrets.PULUMI_BACKEND_CERT }}
          key: ${{ secrets.PULUMI_BACKEND_KEY }}
      - name: Install plugins
        # Before the program runs, with the job's token, as in
        # `plan-physical`; that step says why the token is this step's alone.
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise x -- pulumi plugin install
      - name: Up
        # Killing an apply leaves its operations pending in the state, so the
        # bound sits far above a slow healthy apply. An apply that exceeds it
        # fails the job and `notify-failure` fires; framework/ci.md §3.3 is
        # what follows.
        timeout-minutes: 120
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        run: mise x -- pulumi up --stack dns --yes --diff

  up-k8s-base:
    # After `up-dns` whatever its result, as `up-apps` is: a name a cut hands
    # over is deleted by `dns` before it is created here or in `apps`, and a
    # failed `dns` stops neither (framework/ci.md §3).
    needs: [plan-physical, up-physical, up-dns]
    if: >-
      always() && needs.plan-physical.result == 'success'
      && (needs.up-physical.result == 'success' || needs.up-physical.result == 'skipped')
    runs-on: ubuntu-26.04
    # The sum of its steps' bounds, a `uses:` step twice, plus five minutes
    # for the runner's own phases: a backstop, since the `Up` step's bound
    # fires first and fails the job (framework/ci.md §3).
    timeout-minutes: 170
    environment: k8s-base
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        timeout-minutes: 5
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        timeout-minutes: 5
        with:
          # Pinned like every tool `mise.toml` manages, and for the same
          # reason (framework/ci.md §3). This is the action's own input, and
          # the one renovate bumps.
          version: 2026.10.5
          experimental: true
      - run: mise x uv -- uv sync --locked
        timeout-minutes: 5
      - uses: ./.github/actions/state-backend
        timeout-minutes: 5
        with:
          url: ${{ secrets.PULUMI_BACKEND_URL }}
          ca: ${{ secrets.PULUMI_BACKEND_CA }}
          certificate: ${{ secrets.PULUMI_BACKEND_CERT }}
          key: ${{ secrets.PULUMI_BACKEND_KEY }}
      - name: Install plugins
        # Before the program runs, with the job's token, as in
        # `plan-physical`; that step says why the token is this step's alone.
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise x -- pulumi plugin install
      - name: Up
        # Killing an apply leaves its operations pending in the state, so the
        # bound sits far above a slow healthy apply. An apply that exceeds it
        # fails the job and `notify-failure` fires; framework/ci.md §3.3 is
        # what follows.
        timeout-minutes: 120
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        run: mise x -- pulumi up --stack k8s-base --yes --diff

  up-apps:
    needs: [up-k8s-base, up-dns]
    if: always() && needs.up-k8s-base.result == 'success'
    runs-on: ubuntu-26.04
    # The sum of its steps' bounds, a `uses:` step twice, plus five minutes
    # for the runner's own phases: a backstop, since the `Up` step's bound
    # fires first and fails the job (framework/ci.md §3).
    timeout-minutes: 170
    environment: apps
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        timeout-minutes: 5
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        timeout-minutes: 5
        with:
          # Pinned like every tool `mise.toml` manages, and for the same
          # reason (framework/ci.md §3). This is the action's own input, and
          # the one renovate bumps.
          version: 2026.10.5
          experimental: true
      - run: mise x uv -- uv sync --locked
        timeout-minutes: 5
      - uses: ./.github/actions/state-backend
        timeout-minutes: 5
        with:
          url: ${{ secrets.PULUMI_BACKEND_URL }}
          ca: ${{ secrets.PULUMI_BACKEND_CA }}
          certificate: ${{ secrets.PULUMI_BACKEND_CERT }}
          key: ${{ secrets.PULUMI_BACKEND_KEY }}
      - name: Install plugins
        # Before the program runs, with the job's token, as in
        # `plan-physical`; that step says why the token is this step's alone.
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise x -- pulumi plugin install
      - name: Up
        # Killing an apply leaves its operations pending in the state, so the
        # bound sits far above a slow healthy apply. An apply that exceeds it
        # fails the job and `notify-failure` fires; framework/ci.md §3.3 is
        # what follows.
        timeout-minutes: 120
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        run: mise x -- pulumi up --stack apps --yes --diff

  notify-failure:
    # Nothing stands between a merge and a live apply, so a broken chain is
    # otherwise entirely silent: you would believe main was deployed when it
    # is not. Ported from kluster-code, where the same step ran inside the
    # single deploy job; here the chain is five jobs, so it is one job that
    # fires when any of them failed.
    #
    # Interim shape. The designed end state routes every CI alert through one
    # `repository_dispatch` to the ops repo, which owns tier semantics, payload
    # formatting and the GitHub-issue leg (cluster/architecture.md §4.3); that
    # producer step does not exist yet, and neither does the App whose token it
    # would use. Until it does, this posts the payload to Home Assistant
    # directly, exactly as the legacy repository did.
    needs: [plan-physical, up-physical, up-dns, up-k8s-base, up-apps]
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Push a Home Assistant notification
        env:
          # Repository secret, not an Environment one: this job belongs to no
          # stack. Any workflow in this repository can therefore read it,
          # same-repo previews included — acceptable for a URL whose only
          # power is to raise a phone notification, and it leaves CI entirely
          # once the dispatch producer replaces it.
          WEBHOOK_URL: ${{ secrets.HAOS_DEPLOY_WEBHOOK_URL }}
          # Via env, not `${{ }}` inline, so a commit message cannot break out
          # into the shell.
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "$WEBHOOK_URL" ]; then
            echo '::warning::HAOS_DEPLOY_WEBHOOK_URL is unset; no alert sent'
            exit 0
          fi
          # Absent on a workflow_dispatch run, which has no head commit.
          subject=$(printf '%s' "${COMMIT_MSG:-}" | head -1)
          jq -n \
            --arg sha "${GITHUB_SHA:0:8}" \
            --arg msg "${subject:-manual run}" \
            --arg url "$RUN_URL" \
            '{
               title: "kluster deploy failed",
               message: "the deploy chain failed on \($sha): \($msg)",
               url: $url,
             }' \
            | curl -sS --fail -m 15 -X POST "$WEBHOOK_URL" \
                -H 'Content-Type: application/json' --data @-

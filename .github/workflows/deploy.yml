name: deploy

# The merge chain (framework/ci.md §3). `up` performs its own preview, so
# there is no separate preview job — except for physical, whose apply sits
# behind an approval gate and therefore gets a plan first: a zero diff (the
# common case) skips the gated job entirely and the chain proceeds with no
# clicks, while a real diff stalls the whole chain until a human reads it.

on:
  push:
    branches: [main]
  # Manual re-runs enter here. The weekly drift check is its own workflow
  # (drift.yml) — it previews, it never applies.
  workflow_dispatch:

# Serialized: one chain at a time, which state locking wants anyway. It is not
# by itself enough to keep a ZeroTier identity from being live twice — drift.yml
# joins with the same environments' identities — so every job that joins also
# takes a `zt-<domain>` group of its own (framework/ci.md §2).
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan-physical:
    runs-on: ubuntu-latest
    # Ungated on purpose: reading the diff is the approval moment, so the
    # reading itself must not need approval.
    environment: physical-plan
    # Both physical environments are one ZeroTier domain: the plan and the
    # apply are meant to carry the same pre-authorized member, so they share a
    # key even though they are separate credential partitions.
    concurrency:
      group: zt-physical
      cancel-in-progress: false
    outputs:
      diff: ${{ steps.plan.outputs.diff }}
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          # Pinned like every tool `mise.toml` manages, and for the same
          # reason (framework/ci.md §3). This is the action's own input, and
          # the one renovate bumps.
          version: 2026.9.1
          experimental: true
      - run: mise x uv -- uv sync --locked
      - uses: ./.github/actions/zerotier
        with:
          network_id: ${{ secrets.ZEROTIER_NETWORK_ID }}
          identity: ${{ secrets.ZEROTIER_IDENTITY }}
      - uses: ./.github/actions/state-backend
        with:
          url: ${{ secrets.PULUMI_BACKEND_URL }}
          ca: ${{ secrets.PULUMI_BACKEND_CA }}
          certificate: ${{ secrets.PULUMI_BACKEND_CERT }}
          key: ${{ secrets.PULUMI_BACKEND_KEY }}
      - name: Plan
        id: plan
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        run: |
          if mise x -- pulumi preview --stack physical --diff --expect-no-changes; then
            echo 'diff=false' >> "$GITHUB_OUTPUT"
          else
            echo 'diff=true' >> "$GITHUB_OUTPUT"
          fi

  up-physical:
    needs: plan-physical
    if: needs.plan-physical.outputs.diff == 'true'
    runs-on: ubuntu-latest
    # Reviewer-gated: this is the layer that can root the gateway.
    environment: physical
    concurrency:
      group: zt-physical
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          # Pinned like every tool `mise.toml` manages, and for the same
          # reason (framework/ci.md §3). This is the action's own input, and
          # the one renovate bumps.
          version: 2026.9.1
          experimental: true
      - run: mise x uv -- uv sync --locked
      - uses: ./.github/actions/zerotier
        with:
          network_id: ${{ secrets.ZEROTIER_NETWORK_ID }}
          identity: ${{ secrets.ZEROTIER_IDENTITY }}
      - uses: ./.github/actions/state-backend
        with:
          url: ${{ secrets.PULUMI_BACKEND_URL }}
          ca: ${{ secrets.PULUMI_BACKEND_CA }}
          certificate: ${{ secrets.PULUMI_BACKEND_CERT }}
          key: ${{ secrets.PULUMI_BACKEND_KEY }}
      - name: Up
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        run: mise x -- pulumi up --stack physical --yes --diff

  up-dns:
    needs: [plan-physical, up-physical]
    # A skipped gate job must not cascade-skip the chain.
    if: always() && needs.up-physical.result != 'failure' && needs.plan-physical.result == 'success'
    runs-on: ubuntu-latest
    environment: dns
    # Shared with every other job that joins on the dns environment's identity:
    # a preview, a noop-automerge proof, a drift check.
    concurrency:
      group: zt-dns
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          # Pinned like every tool `mise.toml` manages, and for the same
          # reason (framework/ci.md §3). This is the action's own input, and
          # the one renovate bumps.
          version: 2026.9.1
          experimental: true
      - run: mise x uv -- uv sync --locked
      # The AdGuard rewrites are DNS and live on the UDM, so this is the one
      # stack that reaches the LAN (dns.md §3).
      - uses: ./.github/actions/zerotier
        with:
          network_id: ${{ secrets.ZEROTIER_NETWORK_ID }}
          identity: ${{ secrets.ZEROTIER_IDENTITY }}
      - uses: ./.github/actions/state-backend
        with:
          url: ${{ secrets.PULUMI_BACKEND_URL }}
          ca: ${{ secrets.PULUMI_BACKEND_CA }}
          certificate: ${{ secrets.PULUMI_BACKEND_CERT }}
          key: ${{ secrets.PULUMI_BACKEND_KEY }}
      - name: Up
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        run: mise x -- pulumi up --stack dns --yes --diff

  up-k8s-base:
    needs: [plan-physical, up-physical]
    if: always() && needs.up-physical.result != 'failure' && needs.plan-physical.result == 'success'
    runs-on: ubuntu-latest
    environment: k8s-base
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          # Pinned like every tool `mise.toml` manages, and for the same
          # reason (framework/ci.md §3). This is the action's own input, and
          # the one renovate bumps.
          version: 2026.9.1
          experimental: true
      - run: mise x uv -- uv sync --locked
      - uses: ./.github/actions/state-backend
        with:
          url: ${{ secrets.PULUMI_BACKEND_URL }}
          ca: ${{ secrets.PULUMI_BACKEND_CA }}
          certificate: ${{ secrets.PULUMI_BACKEND_CERT }}
          key: ${{ secrets.PULUMI_BACKEND_KEY }}
      - name: Up
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        run: mise x -- pulumi up --stack k8s-base --yes --diff

  up-apps:
    needs: up-k8s-base
    if: always() && needs.up-k8s-base.result == 'success'
    runs-on: ubuntu-latest
    environment: apps
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
        with:
          # Pinned like every tool `mise.toml` manages, and for the same
          # reason (framework/ci.md §3). This is the action's own input, and
          # the one renovate bumps.
          version: 2026.9.1
          experimental: true
      - run: mise x uv -- uv sync --locked
      - uses: ./.github/actions/state-backend
        with:
          url: ${{ secrets.PULUMI_BACKEND_URL }}
          ca: ${{ secrets.PULUMI_BACKEND_CA }}
          certificate: ${{ secrets.PULUMI_BACKEND_CERT }}
          key: ${{ secrets.PULUMI_BACKEND_KEY }}
      - name: Up
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
        run: mise x -- pulumi up --stack apps --yes --diff

  notify-failure:
    # Nothing stands between a merge and a live apply, so a broken chain is
    # otherwise entirely silent: you would believe main was deployed when it
    # is not. Ported from kluster-code, where the same step ran inside the
    # single deploy job; here the chain is five jobs, so it is one job that
    # fires when any of them failed.
    #
    # Interim shape. The designed end state routes every CI alert through one
    # `repository_dispatch` to the ops repo, which owns tier semantics, payload
    # formatting and the GitHub-issue leg (cluster/architecture.md §4.3); that
    # producer step does not exist yet, and neither does the App whose token it
    # would use. Until it does, this posts the payload to Home Assistant
    # directly, exactly as the legacy repository did.
    needs: [plan-physical, up-physical, up-dns, up-k8s-base, up-apps]
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Push a Home Assistant notification
        env:
          # Repository secret, not an Environment one: this job belongs to no
          # stack. Any workflow in this repository can therefore read it,
          # same-repo previews included — acceptable for a URL whose only
          # power is to raise a phone notification, and it leaves CI entirely
          # once the dispatch producer replaces it.
          WEBHOOK_URL: ${{ secrets.HAOS_DEPLOY_WEBHOOK_URL }}
          # Via env, not `${{ }}` inline, so a commit message cannot break out
          # into the shell.
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "$WEBHOOK_URL" ]; then
            echo '::warning::HAOS_DEPLOY_WEBHOOK_URL is unset; no alert sent'
            exit 0
          fi
          # Absent on a workflow_dispatch run, which has no head commit.
          subject=$(printf '%s' "${COMMIT_MSG:-}" | head -1)
          jq -n \
            --arg sha "${GITHUB_SHA:0:8}" \
            --arg msg "${subject:-manual run}" \
            --arg url "$RUN_URL" \
            '{
               title: "kluster deploy failed",
               message: "the deploy chain failed on \($sha): \($msg)",
               url: $url,
             }' \
            | curl -sS --fail -m 15 -X POST "$WEBHOOK_URL" \
                -H 'Content-Type: application/json' --data @-
